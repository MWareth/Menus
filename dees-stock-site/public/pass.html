<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101010">
<title>The Pass Card · Smash &amp; Pass</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Cairo:wght@500;700;900&display=swap">
<style>
:root{
  --carbon:#101010; --panel:#1B1B19; --line:#2E2E2A; --paper:#FFF9EE; --muted:#B3AEA3;
  --butter:#FFD21C; --ketchup:#F02820; --ok:#5BD08A; --bad:#FF8A80;
  --display:'Lilita One','Arial Black',sans-serif; --body:Cairo,'Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--carbon);color:var(--paper);margin:0}
body{font-family:var(--body);font-size:15px;line-height:1.45;padding:env(safe-area-inset-top,0px) 16px calc(40px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-width:0;width:100%}
.wrap>*,.panel>*{min-width:0}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;letter-spacing:.01em;text-wrap:balance}
button,input,textarea{font-family:inherit;font-size:15px}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--butter);outline-offset:2px}
.brand{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:18px}
.brand h1{font-size:44px;line-height:.9;color:var(--butter)}
.brand h1 span{display:block;color:var(--paper);font-size:18px;letter-spacing:.18em;font-family:var(--body);font-weight:900;margin-bottom:4px}
.brand p{margin:0;color:var(--muted);font-size:12.5px;max-width:150px;text-align:right}
[hidden]{display:none!important}
.staffbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.staffbar a{color:var(--paper);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;text-decoration:none;font-weight:900;letter-spacing:.06em}
.tel{display:flex;gap:8px}
.cc{position:relative;flex:0 0 108px}
.cc-flag{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:18px;pointer-events:none}
.field .cc input{padding-left:38px;letter-spacing:.02em}
.cc-list{position:absolute;z-index:20;left:0;top:calc(100% + 6px);width:min(300px,80vw);max-height:260px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.45);padding:4px}
.cc-list button{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;color:var(--paper);font:inherit;font-size:14px;text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer}
.cc-list button:hover,.cc-list button:focus{background:var(--carbon)}
.cc-list b{min-width:46px}
.tel input{flex:1 1 auto;min-width:0;letter-spacing:.06em}
.lvl-badge{display:inline-block;background:var(--butter);color:var(--carbon);font-family:'Lilita One',sans-serif;font-size:18px;letter-spacing:.03em;border-radius:999px;padding:6px 14px}
.level .note{margin-top:8px}
.lb{list-style:none;margin:10px 0 4px;padding:0;display:flex;flex-direction:column;gap:6px}
.lb li{display:flex;gap:10px;align-items:center;background:var(--carbon);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.lb li span:nth-child(2){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb li.you{border-color:var(--butter)}
.lb .rk{width:26px;text-align:center;font-weight:900}
.lb b{font-family:'Lilita One',sans-serif;font-size:18px;color:var(--butter)}
.linkbtn{background:none;border:0;color:var(--muted);font:inherit;font-size:12px;font-weight:900;letter-spacing:.06em;cursor:pointer;padding:8px 0}
.crewlink{display:block;margin:10px auto 0;background:none;border:0;color:var(--line);font:inherit;font-size:11px;letter-spacing:.08em;cursor:pointer;padding:4px 10px}
.staffbar .linkbtn{margin-left:auto;background:none;border:0;color:var(--muted);font:inherit;font-weight:900;letter-spacing:.06em;cursor:pointer;padding:6px 4px}
.staffbar a[aria-current="page"]{background:var(--butter);color:var(--carbon);border-color:var(--butter)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.lbl{font-size:11.5px;font-weight:900;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field input,.field textarea,.field select{background:var(--carbon);color:var(--paper);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-width:0}
.field textarea{min-height:84px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--muted)}
.check input{margin-top:3px;accent-color:var(--butter);width:18px;height:18px;flex:none}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;font-size:14px}
.btn[disabled]{opacity:.5}
.pri{background:var(--butter);color:var(--carbon)}
.red{background:var(--ketchup);color:var(--paper)}
.ghost{background:transparent;color:var(--paper);border:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
.err{color:var(--bad);font-size:13.5px;font-weight:700;margin:0}
.note{color:var(--muted);font-size:12.5px;margin:0}
.note a{color:var(--butter)}
.hello{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hello h2{font-size:26px}
.card{border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card.burger{background:var(--butter);color:var(--carbon)}
.card.dessert{background:var(--ketchup);color:var(--paper)}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card-h h3{font-size:28px;line-height:1}
.card-h b{font-weight:900;font-size:13px;letter-spacing:.08em}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.st{aspect-ratio:1;max-width:100%;border-radius:50%;border:2.5px dashed currentColor;opacity:.55;display:grid;place-items:center;font-family:var(--display);font-size:13px}
.st.on{opacity:1;border-style:solid;background:var(--carbon);color:var(--butter)}
.dessert .st.on{color:var(--paper)}
.st.free{opacity:1;border-style:solid;font-size:12px}
.st.free.ready{background:var(--carbon);color:var(--butter);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.st.free.ready{animation:none}}
.card .meta{font-weight:700;font-size:13px}
.ready-banner{background:var(--carbon);color:var(--butter);border-radius:12px;padding:8px 12px;font-weight:900;letter-spacing:.06em;font-size:13px;text-align:center}
.qrbox{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.qr{background:#fff;padding:6px;border-radius:12px;flex:none;width:150px;height:150px}
.qr img{display:block;width:138px;height:138px}
.big{font-family:var(--display);font-size:22px;color:var(--butter);margin:0}
.dots{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.dots button{background:var(--carbon);color:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 0;font-family:var(--display);font-size:18px}
.dots button[aria-pressed="true"],.pick button[aria-pressed="true"]{background:var(--butter);color:var(--carbon);border-color:var(--butter)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick button{border-radius:12px;padding:12px;font-weight:900;border:2px solid var(--line);background:var(--carbon);color:var(--paper)}
.items{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.items button{background:var(--carbon);color:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.items button b{font-size:14px}
.items button small{color:var(--muted);font-size:12px;font-weight:700}
.bl{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:14px}
.bl button{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kpi{background:var(--carbon);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--display);font-size:26px;color:var(--butter);font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--muted);font-weight:700}
.tw{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th{text-align:left;color:var(--muted);font-size:11px;letter-spacing:.12em;font-weight:900;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.r{text-align:right}
.cm{display:flex;flex-direction:column;gap:8px}
.cm div{background:var(--carbon);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
.cm small{display:block;color:var(--muted);font-weight:700;font-size:12px;margin-top:4px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--paper);color:var(--carbon);font-weight:900;padding:11px 18px;border-radius:999px;max-width:90vw;z-index:9;font-size:14px}
details summary{cursor:pointer;color:var(--muted);font-size:13px;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <header class="brand" id="brand">
    <h1><span>SMASH &amp; PASS</span>THE PASS CARD</h1>
    <p>Buy 9, the 10th is on us. Pass the payment this time.</p>
  </header>
  <nav class="staffbar" id="staffbar" hidden></nav>
  <main id="app" class="wrap" aria-live="polite"><div class="panel"><p class="note">Loading your card…</p></div></main>
</div>
<div id="toast" class="toast" hidden></div>
<script>
(function () {
  var app = document.getElementById("app");
  var S = { customer: null, staff: null, need: 9, menu: [] };
  var welcomeP = null, lb = null;
  var screen = "home", basket = {}, found = null, rv = { food: 0, vibe: 0, card: "burger" }, redeemFor = null, owner = null;
  var MENU = {};

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function toast(t) { var el = document.getElementById("toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function () { el.hidden = true; }, 2800); }
  function niceDate(iso) { return new Date(iso).toLocaleDateString("en-GB", { day: "numeric", month: "short" }); }
  function fmtPhone(p) {
    p = String(p || "");
    if (p.indexOf("00") === 0) { var c = (S.countries || []).filter(function (x) { return p.slice(2).indexOf(x[2]) === 0; })[0];
      return c ? "+" + c[2] + " " + p.slice(2 + c[2].length) : "+" + p.slice(2); }
    return p.replace(/(\d{3})(\d{3})(\d{4})/, "$1 $2 $3");
  }
  /* Phone = country picker (flag + dial code) + the number after it, exact length per country */
  function flag(iso) { return iso.replace(/./g, function (ch) { return String.fromCodePoint(127397 + ch.charCodeAt(0)); }); }
  function country(iso) { var l = S.countries || []; return l.filter(function (x) { return x[0] === iso; })[0] || l[0] || ["AE", "UAE", "971", 9, 9]; }
  function lenText(c) { return c[3] === c[4] ? c[3] + " digits" : c[3] + " to " + c[4] + " digits"; }
  function phoneField(id, label) {
    var c = country(phoneField.iso || "AE");
    return '<div class="field"><label for="' + id + '">' + label + '</label><div class="tel">' +
      '<div class="cc"><span class="cc-flag" id="' + id + '-flag">' + flag(c[0]) + '</span>' +
      '<input id="' + id + '-cc" data-iso="' + c[0] + '" value="+' + c[2] + '" inputmode="tel" autocomplete="off" aria-label="Country code" role="combobox" aria-expanded="false" aria-controls="' + id + '-list">' +
      '<div class="cc-list" id="' + id + '-list" role="listbox" hidden></div></div>' +
      '<input id="' + id + '" inputmode="numeric" autocomplete="tel-national" data-max="' + c[4] + '" placeholder="' + (c[0] === "AE" ? "561234567" : "") + '"></div>' +
      '<p class="note" id="' + id + '-hint">' + lenText(c) + " after +" + c[2] + ", without the first 0</p></div>";
  }
  function readPhone(id, errId) {
    var ccEl = document.getElementById(id + "-cc");
    if (!ccEl.getAttribute("data-iso")) { showErr(errId, "Pick your country code from the list."); return null; }
    var c = country(ccEl.getAttribute("data-iso")), n = document.getElementById(id).value.replace(/\D/g, "").replace(/^0/, "");
    if (n.length < c[3] || n.length > c[4]) { showErr(errId, c[1] + " numbers are " + lenText(c) + " after +" + c[2] + "."); return null; }
    return "+" + c[2] + n;
  }
  function api(path, body) {
    return fetch(path, body ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body), credentials: "same-origin" } : { credentials: "same-origin" })
      .then(function (r) { return r.json().catch(function () { return { ok: false, error: "Something went wrong. Try again." }; }); })
      .catch(function () { return { ok: false, error: "No connection. Check your internet and try again." }; });
  }
  function route() {
    var p = location.pathname.replace(/\/+$/, "");
    if (p.indexOf("/pass/s/") === 0) return { name: "scan", code: decodeURIComponent(p.slice(8)) };
    if (p === "/pass/truck") return { name: "truck" };
    if (p === "/pass/owner") return { name: "owner" };
    return { name: "card" };
  }
  function go(path) { history.pushState(null, "", path); load(); }
  window.addEventListener("popstate", load);

  /* ---------------- shared pieces ---------------- */
  function stamps(n) {
    var h = '<div class="stamps" aria-label="' + Math.min(n, S.need) + " of " + S.need + ' stamps">';
    for (var i = 0; i < S.need; i++) h += '<div class="st' + (i < n ? " on" : "") + '">' + (i < n ? "✓" : i + 1) + "</div>";
    return h + '<div class="st free' + (n >= S.need ? " ready" : "") + '">FREE</div></div>';
  }
  /* a full card renews by itself: the free item is banked and a fresh card starts */
  function freeOf(c, k) { return Math.floor((c[k] || 0) / S.need); }
  function cardHtml(c, k) {
    var n = (c[k] || 0) % S.need, free = freeOf(c, k), left = S.need - n, word = k === "burger" ? "burger" : "dessert";
    var done = c.done ? c.done[k] : 0;
    return '<section class="card ' + k + '"><div class="card-h"><h3>' + (k === "burger" ? "Burgers" : "Dee'serts") + "</h3><b>" + n + " / " + S.need + "</b></div>" + stamps(n) +
      (free ? '<div class="ready-banner">' + (k === "burger" ? "🍔 " : "🍰 ") + free + " FREE " + word.toUpperCase() + (free > 1 ? "S" : "") + " WAITING · ANY ONE YOU LIKE</div>" : "") +
      '<div class="meta">' + left + " more " + (left === 1 ? "stamp" : "stamps") + " and " + (free ? "another" : "your next") + " " + word + " is free." +
      (done ? " · <b>" + done + "</b> card" + (done > 1 ? "s" : "") + " done" : "") + "</div></section>";
  }
  /* fan level from every card ever finished (both cards together) */
  var LEVELS = [[10, "Smash Legend", "👑"], [5, "Loyal Fan", "🔥"], [3, "Regular", "⭐"], [1, "Smasher", "🍔"]];
  function levelOf(c) {
    var t = c.done ? c.done.burger + c.done.dessert : 0, cur = null, next = null;
    LEVELS.forEach(function (l) { if (t >= l[0] && !cur) cur = l; });
    for (var i = LEVELS.length - 1; i >= 0; i--) if (t < LEVELS[i][0]) { next = LEVELS[i]; break; }
    return { total: t, cur: cur, next: next };
  }
  function monthName(m) { return new Date(m + "-15T12:00:00Z").toLocaleDateString("en-GB", { month: "long" }); }
  function boardHtml(B, mine) {
    if (!B) return '<div class="panel"><div class="lbl">🏆 Top Smashers</div><p class="note">Loading…</p></div>';
    var h = '<div class="panel board"><div class="lbl">🏆 Top Smashers · ' + monthName(B.month) + "</div>" +
      '<p class="note">Most cards finished this month. <b style="color:var(--butter)">#1 wins a free meal on us</b> (at least ' + B.prizeMin + " cards to qualify).</p>";
    h += B.top.length ? '<ol class="lb">' + B.top.map(function (r) {
      return '<li' + (r.you ? ' class="you"' : "") + '><span class="rk">' + (r.rank === 1 ? "🥇" : r.rank === 2 ? "🥈" : r.rank === 3 ? "🥉" : r.rank) + "</span><span>" + esc(r.name) + (r.you ? " (you)" : "") +
        '</span><b>' + r.n + "</b></li>"; }).join("") + "</ol>" : '<p class="note">Nobody has finished a card this month yet. Be the first.</p>';
    if (mine) {
      if (mine.boardHide) h += '<p class="note">You\'re hidden from Top Smashers.</p>';
      else if (B.me && B.me.rank > 10) h += '<p class="note">You\'re #' + B.me.rank + " with " + B.me.n + " this month.</p>";
      h += '<button type="button" class="linkbtn" id="lb-hide">' + (mine.boardHide ? "SHOW ME ON TOP SMASHERS" : "HIDE MY NAME FROM TOP SMASHERS") + "</button>";
    }
    return h + "</div>";
  }
  function itemsText(items) { return Object.keys(items || {}).map(function (k) { return items[k] + "× " + (MENU[k] ? MENU[k].name : k); }).join(", "); }
  function showErr(id, t) { var el = document.getElementById(id); if (el) { el.textContent = t; el.hidden = false; } }

  /* ---------------- customer ---------------- */
  function viewCard() {
    var c = S.customer;
    if (!c) return screen === "join" ? joinForm() : screen === "crew" ? needStaff() + '<button class="btn ghost" type="button" id="to-login">BACK</button>' : loginForm();
    if (screen === "review" && c.pending) return reviewForm(c);
    var h = '<div class="hello"><h2>Hey ' + esc(c.first) + '</h2><button type="button" class="btn ghost" id="logout" style="flex:none;padding:8px 12px">LOG OUT</button></div>';
    if (c.pending) h += '<div class="panel"><div class="lbl">How was your visit on ' + niceDate(c.pending.at) + "?</div>" +
      '<p class="note">Two quick ratings and an optional comment.' + (c.bonus ? "" : ' Your first review earns a <b style="color:var(--butter)">bonus stamp</b>.') + "</p>" +
      '<button type="button" class="btn pri" id="go-review">RATE MY VISIT</button></div>';
    if (c.surprise) {
      var sp = c.surprise.indexOf("dessert:") === 0 ? "a free " + (MENU[c.surprise.slice(8)] ? MENU[c.surprise.slice(8)].name.replace(/ \(.*\)$/, "") : "dessert") : "10% off your first order";
      if (c.visits.length <= 1) h += '<div class="panel" style="border-color:var(--butter)"><div class="lbl" style="color:var(--butter)">🎁 Your welcome surprise</div><p class="big">' + esc(sp) + '</p><p class="note">Thanks for joining the Pass Card.</p></div>';
    } else if (!c.visits.length) {
      h += '<div class="panel" style="border-color:var(--butter)"><div class="lbl" style="color:var(--butter)">🎁 A surprise is waiting</div><p class="note">Show your code with your first order and see what you get. A free dessert or 10% off the whole order.</p></div>';
    }
    var lv = levelOf(c);
    h += '<div class="panel level"><div><span class="lvl-badge">' + (lv.cur ? lv.cur[2] + " " + lv.cur[1].toUpperCase() : "NEW ON THE CARD") + "</span></div>" +
      '<p class="note"><b>' + lv.total + "</b> card" + (lv.total === 1 ? "" : "s") + " finished" + (c.doneMonth ? " · <b>" + c.doneMonth + "</b> this month" : "") +
      (lv.next ? " · " + (lv.next[0] - lv.total) + " more to " + lv.next[2] + " " + lv.next[1] : " · top level") + "</p></div>";
    h += cardHtml(c, "burger") + cardHtml(c, "dessert");
    h += boardHtml(lb, c);
    h += '<div class="panel"><div class="lbl">Show this at the window</div><div class="qrbox"><div class="qr"><img src="/api/pass/qr.svg" alt="Your Pass Card QR code"></div>' +
      '<div style="flex:1 1 160px"><p class="big">' + esc(fmtPhone(c.phone)) + '</p><p class="note">This code is yours only. The truck scans it to add your stamps. Every burger and dessert is a stamp; a Brownie Bag counts as 2.</p></div></div></div>';
    if (c.visits.length) {
      h += '<div class="panel"><div class="lbl">Your visits</div>';
      c.visits.forEach(function (v) { h += '<div class="bl"><span>' + niceDate(v.at) + " · " + esc(itemsText(v.items)) + '</span><span style="color:var(--muted);flex:none">' + (v.food ? "★ " + v.food + "/" + v.vibe : "") + "</span></div>"; });
      h += "</div>";
    }
    h += '<details class="panel"><summary>Delete my Pass Card</summary><p class="note">This removes your card, your stamps and your reviews for good.</p>' +
      '<form id="f-del" class="row" novalidate><div class="field"><label for="del-pin">Your PIN</label><input id="del-pin" inputmode="numeric" maxlength="4" type="password" autocomplete="current-password"></div>' +
      '<button class="btn red" type="submit" style="align-self:flex-end">DELETE FOR GOOD</button></form><p class="err" id="del-err" hidden></p></details>';
    return h;
  }
  function loginForm() {
    return '<form class="panel" id="f-login" novalidate><div class="lbl">Log in</div>' +
      phoneField("l-phone", "Mobile number") +
      '<div class="field"><label for="l-pin">4-digit PIN</label><input id="l-pin" inputmode="numeric" maxlength="4" type="password" autocomplete="current-password"></div>' +

        (lb.lastWinner ? '<p class="note">🥇 ' + monthName(lb.lastWinner.month) + " winner: <b>" + esc(lb.lastWinner.name) + "</b> · " + esc(fmtPhone(lb.lastWinner.phone)) + " · " + lb.lastWinner.n + " cards. Give them their free meal.</p>" : "") +
        "</div>" + boardHtml(lb, null);
    }
    if (Object.keys(items).length) h += '<div class="panel"><div class="lbl">What people buy</div><div class="tw"><table><thead><tr><th>ITEM</th><th class="r">BOUGHT</th></tr></thead><tbody>' +
      O.menu.filter(function (m) { return items[m.id]; }).sort(function (a, b) { return items[b.id] - items[a.id]; }).map(function (m) { return "<tr><td>" + esc(m.name) + '</td><td class="r">' + items[m.id] + "</td></tr>"; }).join("") + "</tbody></table></div></div>";
    var cms = revs.filter(function (v) { return v.comment; });
    var byPhone = {}; O.customers.forEach(function (c) { byPhone[c.phone] = c; });
    h += '<div class="panel"><div class="lbl">Comments</div><div class="cm">' + (cms.map(function (v) { var c = byPhone[v.phone];
      return "<div>" + esc(v.comment) + "<small>" + esc(c ? c.first + " " + c.last : "") + " · " + niceDate(v.at) + " · food " + v.food + "/5 · atmosphere " + v.vibe + "/5</small></div>"; }).join("") || '<p class="note">No comments yet.</p>') + "</div></div>";
    h += '<div class="panel"><div class="lbl">Customers</div><div class="tw"><table><thead><tr><th>FIRST</th><th>LAST</th><th>MOBILE</th><th>EMAIL</th><th class="r">VISITS</th><th class="r">🍔</th><th class="r">🍰</th><th>OFFERS</th><th>JOINED</th></tr></thead><tbody>' +
      O.customers.map(function (c) { return "<tr><td>" + esc(c.first) + "</td><td>" + esc(c.last) + "</td><td>" + esc(c.phone) + "</td><td>" + esc(c.email) + '</td><td class="r">' + (per[c.phone] || 0) +
        '</td><td class="r">' + c.burger + '</td><td class="r">' + c.dessert + "</td><td>" + (c.offers ? "yes" : "no") + "</td><td>" + niceDate(c.joined) + "</td></tr>"; }).join("") +

  /* ---------------- render + load ---------------- */
  /* one link for everyone: on /pass a crew login goes straight to its dashboard */
  function crewHome() { return S.staff && (S.staff.role === "admin" || S.staff.role === "dees") ? "/pass/owner" : "/pass/truck"; }
  function render() {
    var r = route();
    var bar = document.getElementById("staffbar");
    /* the customer page never shows anything staff-side; truck + owner are their own pages */
    var crew = r.name === "truck" || r.name === "owner" || r.name === "scan" && S.staff;
    document.getElementById("brand").innerHTML = crew
      ? "<h1><span>SMASH &amp; PASS</span>TRUCK CREW</h1><p>Staff only. Stamp orders and see the numbers.</p>"
      : "<h1><span>SMASH &amp; PASS</span>THE PASS CARD</h1><p>Buy 9, the 10th is on us. Pass the payment this time.</p>";
    document.title = crew ? "Truck crew · Pass Card" : "The Pass Card · Smash & Pass";
    if (crew && S.staff) {
      bar.hidden = false;
      bar.innerHTML = "<span>" + esc(S.staff.name) + " ·</span>" + [["/pass/truck", "TRUCK"], ["/pass/owner", "OWNER"]].map(function (l) {
        var cur = (r.name === "truck" || r.name === "scan") && l[0] === "/pass/truck" || r.name === "owner" && l[0] === "/pass/owner";
        return '<a href="' + l[0] + '" data-nav' + (cur ? ' aria-current="page"' : "") + ">" + l[1] + "</a>"; }).join("") +
        '<button type="button" class="linkbtn" id="st-out">LOG OUT</button>';
    } else { bar.hidden = true; bar.innerHTML = ""; }
    if (r.name === "card") app.innerHTML = viewCard();
    else if (r.name === "owner") app.innerHTML = viewOwner();
    else if (r.name === "scan" && !S.staff) app.innerHTML = '<div class="panel"><div class="lbl">A Pass Card</div><p class="note">This is a customer\'s Pass Card code. Show it at the Smash &amp; Pass window to collect stamps.</p><a class="btn pri" href="/pass" data-nav style="text-align:center;text-decoration:none">OPEN MY OWN CARD</a></div>';
    else app.innerHTML = viewTruck();
  }
  function load() {
    var r = route();
    api("/api/pass/session").then(function (res) {
      if (!res.ok) { app.innerHTML = '<div class="panel"><p class="err">Couldn\'t load the Pass Card. Pull down to refresh.</p></div>'; return; }
      S = res; MENU = {}; (res.menu || []).forEach(function (m) { MENU[m.id] = m; });
      if (r.name === "card" && S.staff) { history.replaceState(null, "", crewHome()); screen = "home"; return load(); }
      if (r.name === "scan" && S.staff) {
        return api("/api/pass/staff/find?q=" + encodeURIComponent(r.code)).then(function (f) {
          found = f.ok ? f.customer : null; welcomeP = f.ok ? f.welcome : null; basket = {}; render();
          if (!f.ok) showErr("s-err", f.error || "That code isn't a Pass Card.");
        });
      }
      if (r.name === "owner" && S.staff) {
        owner = null; render();
        return Promise.all([api("/api/pass/owner"), api("/api/pass/board")]).then(function (o) { owner = o[0].ok ? o[0] : null; lb = o[1].ok ? o[1] : null; render(); });
      }
      render();
      if (r.name === "card" && S.customer) api("/api/pass/board").then(function (b) { if (b.ok) { lb = b; if (route().name === "card") keepText(); } });
    });
  }

  document.addEventListener("click", function (e) {
    var a = e.target.closest("a[data-nav]");
    if (a) { e.preventDefault(); found = null; redeemFor = null; go(a.getAttribute("href")); return; }
    var t = e.target.closest("button"); if (!t) return;
    if (t.id === "st-out") { api("/api/logout", {}).then(function () { found = null; owner = null; screen = "home"; go("/pass"); }); return; }
    if (t.id === "to-join") { screen = "join"; render(); }
    else if (t.id === "to-login") { screen = "home"; render(); }
    else if (t.id === "to-crew") { screen = "crew"; render(); }
    else if (t.id === "go-review") { screen = "review"; render(); }
    else if (t.id === "r-back") { screen = "home"; render(); }
    else if (t.id === "lb-hide" && S.customer) { t.disabled = true; api("/api/pass/board/hide", { hide: !S.customer.boardHide }).then(function (r) {
      if (r.ok) { S.customer = Object.assign(S.customer, r.customer); } return api("/api/pass/board"); }).then(function (b) { lb = b && b.ok ? b : lb; render(); }); }
    else if (t.id === "logout") api("/api/pass/logout", {}).then(function () { S.customer = null; screen = "home"; render(); });
    else if (t.hasAttribute("data-rate")) { rv[t.getAttribute("data-rate")] = +t.getAttribute("data-v"); keepText(); }
    else if (t.hasAttribute("data-card")) { rv.card = t.getAttribute("data-card"); keepText(); }
    else if (t.hasAttribute("data-add")) { var k = t.getAttribute("data-add"); basket[k] = (basket[k] || 0) + 1; render(); }
    else if (t.hasAttribute("data-less")) { var k2 = t.getAttribute("data-less"); if (--basket[k2] <= 0) delete basket[k2]; render(); }
    else if (t.id === "stamp") {
      t.disabled = true;
      api("/api/pass/staff/stamp", { phone: found.phone, items: basket }).then(function (res) {
        if (!res.ok) { t.disabled = false; toast(res.error || "Couldn't stamp. Try again."); return; }
        found = res.customer; basket = {}; welcomeP = null; render();
        toast(res.welcome ? "Stamped. Welcome surprise: " + res.welcome.label + (res.welcome.kind === "dessert" ? " (logged as a giveaway)" : "")
          : (res.completed && res.completed.length ? "🎉 Card complete! Free " + res.completed.join(" + ") + " banked, new card started"
            : "Stamped: +" + res.added.burger + " burger, +" + res.added.dessert + " dessert"));
      });
    }
    else if (t.hasAttribute("data-redeem")) { redeemFor = t.getAttribute("data-redeem"); render(); }
    else if (t.id === "free-cancel") { redeemFor = null; render(); }
    else if (t.hasAttribute("data-free")) {
      t.disabled = true;
      var item = t.getAttribute("data-free");
      api("/api/pass/staff/redeem", { phone: found.phone, card: redeemFor, item: item }).then(function (res) {
        if (!res.ok) { t.disabled = false; toast(res.error || "Couldn't redeem. Try again."); return; }
        found = res.customer; redeemFor = null; render();
        toast("Free " + MENU[item].name + " given." + (res.stock === "not_found" ? " Not found in stock: log it as GAVE AWAY by hand." : ""));
      });
    }
    else if (t.id === "copy-csv" && owner) {
      var rows = [["first", "last", "mobile", "email", "burger stamps", "dessert stamps", "offers", "joined"]].concat(owner.customers.map(function (c) {
        return [c.first, c.last, c.phone, c.email, c.burger, c.dessert, c.offers ? "yes" : "no", c.joined.slice(0, 10)].map(function (x) { return '"' + String(x).replace(/"/g, '""') + '"'; }); }));
      var csv = rows.map(function (r) { return r.join(","); }).join("\n");
      (navigator.clipboard ? navigator.clipboard.writeText(csv) : Promise.reject()).then(function () { toast("Copied. Paste into Excel."); }, function () { toast("Couldn't copy on this phone."); });
    }
  });
  function keepText() { var ta = document.getElementById("r-text"), v = ta ? ta.value : ""; render(); var n = document.getElementById("r-text"); if (n) n.value = v; }

  /* country code box: type a code (or a name) and the list narrows; a full code picks itself */
  function pickCountry(id, iso, focusNumber) {
    var c = country(iso), cc = document.getElementById(id + "-cc"), inp = document.getElementById(id);
    phoneField.iso = c[0]; cc.setAttribute("data-iso", c[0]); cc.value = "+" + c[2];
    document.getElementById(id + "-flag").textContent = flag(c[0]);
    inp.setAttribute("data-max", c[4]); inp.placeholder = c[0] === "AE" ? "561234567" : ""; inp.value = inp.value.slice(0, c[4]);
    document.getElementById(id + "-hint").textContent = lenText(c) + " after +" + c[2] + ", without the first 0";
    ccList(id, null); if (focusNumber) inp.focus();
  }
  function ccList(id, q) {
    var box = document.getElementById(id + "-list"), cc = document.getElementById(id + "-cc");
    if (q == null) { box.hidden = true; cc.setAttribute("aria-expanded", "false"); return; }
    var dig = q.replace(/\D/g, ""), word = q.replace(/[^a-z ]/gi, "").trim().toLowerCase();
    var hits = (S.countries || []).filter(function (x) {
      return word ? x[1].toLowerCase().indexOf(word) >= 0 : !dig || x[2].indexOf(dig) === 0; });
    box.innerHTML = hits.length ? hits.map(function (x) {
      return '<button type="button" role="option" data-cc="' + id + '" data-iso="' + x[0] + '"><span>' + flag(x[0]) + '</span><b>+' + x[2] + "</b>" + esc(x[1]) + "</button>"; }).join("")
      : '<p class="note" style="margin:8px">No country with that code.</p>';
    box.hidden = false; cc.setAttribute("aria-expanded", "true");
  }
  document.addEventListener("focusin", function (e) {
    var t = e.target; if (t.id && /-cc$/.test(t.id)) { t.select(); ccList(t.id.slice(0, -3), ""); }
  });
  document.addEventListener("mousedown", function (e) {
    var o = e.target.closest("[data-cc]");
    if (o) { e.preventDefault(); pickCountry(o.getAttribute("data-cc"), o.getAttribute("data-iso"), true); return; }
    if (!e.target.closest(".cc")) document.querySelectorAll(".cc-list").forEach(function (l) { l.hidden = true; });
  });
  document.addEventListener("focusout", function (e) {
    var t = e.target; if (!t.id || !/-cc$/.test(t.id)) return;
    var id = t.id.slice(0, -3);
    setTimeout(function () { var cc = document.getElementById(id + "-cc"); if (!cc || document.activeElement === cc) return;
      ccList(id, null); var iso = cc.getAttribute("data-iso"); if (iso) pickCountry(id, iso, false); }, 150);
  });
  document.addEventListener("input", function (e) {
    var t = e.target;
    if (t.id && /-cc$/.test(t.id)) {
      var id = t.id.slice(0, -3), dig = t.value.replace(/\D/g, "");
      var exact = /[a-z]/i.test(t.value) ? null : (S.countries || []).filter(function (x) { return x[2] === dig; })[0];
      if (exact) return pickCountry(id, exact[0], true);
      t.setAttribute("data-iso", ""); document.getElementById(id + "-flag").textContent = "🌐";
      return ccList(id, t.value);
    }
    if (!t.id || !document.getElementById(t.id + "-cc")) return;
    /* a full number pasted or autofilled (+966…, 00966…) moves its code to the country box */
    var raw = t.value.trim(), dd = raw.replace(/\D/g, "");
    if (raw.charAt(0) === "+" || dd.indexOf("00") === 0) {
      if (dd.indexOf("00") === 0) dd = dd.slice(2);
      var hit = (S.countries || []).filter(function (x) { return dd.indexOf(x[2]) === 0; })[0];
      if (hit) { t.value = dd.slice(hit[2].length); pickCountry(t.id, hit[0], false); }
    }
    var v = t.value.replace(/\D/g, "").replace(/^0/, "").slice(0, +t.getAttribute("data-max") || 15); if (v !== t.value) t.value = v;
  });
  document.addEventListener("submit", function (e) {
    e.preventDefault();
    var f = e.target, val = function (id) { var el = document.getElementById(id); return el ? el.value.trim() : ""; };
    var btn = f.querySelector('button[type="submit"]'); if (btn) btn.disabled = true;
    var done = function () { if (btn) btn.disabled = false; };
    if (f.id === "f-login" || f.id === "f-join") {
      var ph = readPhone(f.id === "f-login" ? "l-phone" : "j-phone", f.id === "f-login" ? "l-err" : "j-err");
      if (!ph) return done();
      if (f.id === "f-join" && !val("j-email")) { showErr("j-err", "Add your email."); return done(); }
    }
    if (f.id === "f-login") api("/api/pass/login", { phone: ph, pin: val("l-pin") }).then(function (r) { done(); if (!r.ok) return showErr("l-err", r.error); load(); });
    if (f.id === "f-join") api("/api/pass/join", { first: val("j-first"), last: val("j-last"), phone: ph, email: val("j-email"), pin: val("j-pin"),
      consent: document.getElementById("j-ok").checked, offers: document.getElementById("j-offers").checked }).then(function (r) { done(); if (!r.ok) return showErr("j-err", r.error); screen = "home"; load(); toast("Your Pass Card is ready"); });
    if (f.id === "f-review") {
      if (!rv.food || !rv.vibe) { done(); return showErr("r-err", "Pick a number for both food and atmosphere."); }
      api("/api/pass/review", { food: rv.food, vibe: rv.vibe, comment: val("r-text"), card: rv.card }).then(function (r) {
        done(); if (!r.ok) return showErr("r-err", r.error);
        screen = "home"; rv = { food: 0, vibe: 0, card: "burger" }; load();
        toast(r.bonus ? "Thanks! Bonus stamp added to your " + r.bonus + " card" : "Thanks for the review");
      });
    }
    if (f.id === "f-staff") api("/api/login", { user: val("st-user"), pin: val("st-pin") }).then(function (r) { done(); if (!r.ok) return showErr("st-err", r.error); load(); });
    if (f.id === "f-find") api("/api/pass/staff/find?q=" + encodeURIComponent(val("s-q"))).then(function (r) { done(); if (!r.ok) return showErr("s-err", r.error); found = r.customer; welcomeP = r.welcome; basket = {}; render(); });
    if (f.id === "f-reset") api("/api/pass/staff/resetpin", { phone: found.phone, pin: val("rp-pin") }).then(function (r) { done(); if (!r.ok) return showErr("rp-err", r.error); toast("New PIN set. Tell the customer."); render(); });
    if (f.id === "f-del") api("/api/pass/delete", { pin: val("del-pin") }).then(function (r) { done(); if (!r.ok) return showErr("del-err", r.error); S.customer = null; render(); toast("Your Pass Card was deleted."); });
  });

  load();
})();
</script>
</body>
</html>
