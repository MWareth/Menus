<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101010">
<title>The Pass Card · Smash &amp; Pass</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Cairo:wght@500;700;900&display=swap">
<style>
:root{
  --carbon:#101010; --panel:#1B1B19; --line:#2E2E2A; --paper:#FFF9EE; --muted:#B3AEA3;
  --butter:#FFD21C; --ketchup:#F02820; --ok:#5BD08A; --bad:#FF8A80;
  --display:'Lilita One','Arial Black',sans-serif; --body:Cairo,'Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--carbon);color:var(--paper);margin:0}
body{font-family:var(--body);font-size:15px;line-height:1.45;padding:env(safe-area-inset-top,0px) 16px calc(40px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-width:0;width:100%}
.wrap>*,.panel>*{min-width:0}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;letter-spacing:.01em;text-wrap:balance}
button,input,textarea{font-family:inherit;font-size:15px}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--butter);outline-offset:2px}
.brand{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:18px}
.brand h1{font-size:44px;line-height:.9;color:var(--butter)}
.brand h1 span{display:block;color:var(--paper);font-size:18px;letter-spacing:.18em;font-family:var(--body);font-weight:900;margin-bottom:4px}
.brand p{margin:0;color:var(--muted);font-size:12.5px;max-width:150px;text-align:right}
[hidden]{display:none!important}
.staffbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.staffbar a{color:var(--paper);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;text-decoration:none;font-weight:900;letter-spacing:.06em}
.tel{display:flex;gap:8px}
.cc{position:relative;flex:0 0 108px}
.cc-flag{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:18px;pointer-events:none}
.field .cc input{padding-left:38px;letter-spacing:.02em}
.cc-list{position:absolute;z-index:20;left:0;top:calc(100% + 6px);width:min(300px,80vw);max-height:260px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.45);padding:4px}
.cc-list button{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;color:var(--paper);font:inherit;font-size:14px;text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer}
.cc-list button:hover,.cc-list button:focus{background:var(--carbon)}
.cc-list b{min-width:46px}
.tel input{flex:1 1 auto;min-width:0;letter-spacing:.06em}
.lvl-badge{display:inline-block;background:var(--butter);color:var(--carbon);font-family:'Lilita One',sans-serif;font-size:18px;letter-spacing:.03em;border-radius:999px;padding:6px 14px}
.level .note{margin-top:8px}
.lb{list-style:none;margin:10px 0 4px;padding:0;display:flex;flex-direction:column;gap:6px}
.lb li{display:flex;gap:10px;align-items:center;background:var(--carbon);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.lb li span:nth-child(2){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb li.you{border-color:var(--butter)}
.lb .rk{width:26px;text-align:center;font-weight:900}
.lb b{font-family:'Lilita One',sans-serif;font-size:18px;color:var(--butter)}
.linkbtn{background:none;border:0;color:var(--muted);font:inherit;font-size:12px;font-weight:900;letter-spacing:.06em;cursor:pointer;padding:8px 0}
.pts-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.pts-n{font-family:'Lilita One',sans-serif;font-size:44px;line-height:1;color:var(--butter);margin:4px 0 0}
.rw{margin-top:12px}.rw-h{display:flex;justify-content:space-between;gap:8px;font-size:14px}.rw-h span{color:var(--muted);font-size:12px;font-weight:800}
.bar{height:10px;background:var(--carbon);border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--butter);border-radius:999px}
.rw small{color:var(--muted);font-size:11px}
.scratch{position:relative;width:100%;max-width:300px;aspect-ratio:300/140;margin:10px auto 0;border-radius:14px;overflow:hidden;background:var(--butter)}
.scr-prize{position:absolute;inset:0;display:grid;place-items:center;align-content:center;font-family:'Lilita One',sans-serif;font-size:46px;color:var(--carbon)}
.scr-prize small{display:block;font-size:14px;letter-spacing:.1em;text-align:center}
.scratch canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
.games{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.games button{background:var(--carbon);border:1px solid var(--line);border-radius:14px;color:var(--paper);padding:12px 10px;text-align:left;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.games button span{font-size:26px}.games button b{font-family:'Lilita One',sans-serif;font-weight:400;font-size:16px}.games button small{color:var(--muted);font-size:11.5px;line-height:1.3}
.games button:active{border-color:var(--butter)}
.ach{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.ach .a{background:var(--carbon);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px;opacity:.55}
.ach .a.on{opacity:1;border-color:var(--butter)}.ach span{font-size:22px}.ach b{font-size:13px}.ach small{color:var(--muted);font-size:11px;line-height:1.3}
.game{position:fixed;inset:0;z-index:50;background:#101010;display:flex;flex-direction:column;align-items:center;padding:14px 12px;gap:10px}
.g-top{width:100%;max-width:420px;display:flex;justify-content:space-between;align-items:center;font-family:'Lilita One',sans-serif;font-size:18px;color:var(--butter)}
.g-top span{color:var(--paper);font-family:inherit}
.game canvas{border-radius:16px;touch-action:none;background:#1E1E1E}
.g-help{color:var(--muted);font-size:13px;text-align:center;max-width:380px;margin:0}
.g-end{margin:auto;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;width:100%;max-width:340px}
.g-score{font-family:'Lilita One',sans-serif;font-size:72px;line-height:1;color:var(--butter);margin:0}.g-score small{font-size:24px;color:var(--muted)}
.qbar{position:fixed;left:12px;right:12px;bottom:12px;z-index:40;background:var(--butter);color:var(--carbon);border-radius:14px;padding:12px 14px;font-weight:800;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.lives{margin:0;font-size:18px;letter-spacing:.04em}.lives b{font-size:14px;letter-spacing:.06em;color:var(--butter);margin-left:4px}
.g-lives{margin:0;font-size:14px;font-weight:800;color:var(--paper);letter-spacing:.04em}
.g-end .btn{width:100%}
.crewlink{display:block;margin:10px auto 0;background:none;border:0;color:var(--line);font:inherit;font-size:11px;letter-spacing:.08em;cursor:pointer;padding:4px 10px}
.staffbar .linkbtn{margin-left:auto;background:none;border:0;color:var(--muted);font:inherit;font-weight:900;letter-spacing:.06em;cursor:pointer;padding:6px 4px}
.staffbar a[aria-current="page"]{background:var(--butter);color:var(--carbon);border-color:var(--butter)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.lbl{font-size:11.5px;font-weight:900;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field input,.field textarea,.field select{background:var(--carbon);color:var(--paper);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-width:0}
.field textarea{min-height:84px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--muted)}
.check input{margin-top:3px;accent-color:var(--butter);width:18px;height:18px;flex:none}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;font-size:14px}
.btn[disabled]{opacity:.5}
.pri{background:var(--butter);color:var(--carbon)}
.red{background:var(--ketchup);color:var(--paper)}
.ghost{background:transparent;color:var(--paper);border:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
.err{color:var(--bad);font-size:13.5px;font-weight:700;margin:0}
.note{color:var(--muted);font-size:12.5px;margin:0}
.note a{color:var(--butter)}
.hello{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hello h2{font-size:26px}
.card{border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card.burger{background:var(--butter);color:var(--carbon)}
.card.dessert{background:var(--ketchup);color:var(--paper)}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card-h h3{font-size:28px;line-height:1}
.card-h b{font-weight:900;font-size:13px;letter-spacing:.08em}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.st{aspect-ratio:1;max-width:100%;border-radius:50%;border:2.5px dashed currentColor;opacity:.55;display:grid;place-items:center;font-family:var(--display);font-size:13px}
.st.on{opacity:1;border-style:solid;background:var(--carbon);color:var(--butter)}
.dessert .st.on{color:var(--paper)}
.st.free{opacity:1;border-style:solid;font-size:12px}
.st.free.ready{background:var(--carbon);color:var(--butter);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.st.free.ready{animation:none}}
.card .meta{font-weight:700;font-size:13px}
.ready-banner{background:var(--carbon);color:var(--butter);border-radius:12px;padding:8px 12px;font-weight:900;letter-spacing:.06em;font-size:13px;text-align:center}
.qrbox{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.panel.qr-top{display:flex;flex-direction:row;gap:14px;align-items:center;width:100%;text-align:left;color:var(--paper);font:inherit;cursor:pointer;border-color:var(--butter)}
.qr-thumb{flex:none;width:78px;height:78px;background:#fff;border-radius:12px;padding:5px}
.qr-thumb img{display:block;width:100%;height:100%}
.qr-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.qr-txt b{font-size:18px;color:var(--butter)}
.qr-txt small{color:var(--muted);font-size:12.5px;line-height:1.35}
.qr-go{flex:none;font-size:22px;color:var(--butter)}
.qrbig{position:fixed;inset:0;z-index:60;background:#fff;display:grid;place-items:center;padding:20px;overflow:auto}
.qrbig-in{width:100%;max-width:420px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--carbon)}
.qrbig-in img{width:min(86vw,380px);height:auto;aspect-ratio:1;display:block}
.qrbig-name{font-size:22px;font-weight:900;margin:6px 0 0}
.qrbig-num{font-size:18px;font-weight:700;margin:0;letter-spacing:.04em}
.qrbig .btn{width:100%;margin-top:8px}
.qr{background:#fff;padding:6px;border-radius:12px;flex:none;width:150px;height:150px}
.qr img{display:block;width:138px;height:138px}
.big{font-family:var(--display);font-size:22px;color:var(--butter);margin:0}
.dots{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.dots button{background:var(--carbon);color:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 0;font-family:var(--display);font-size:18px}
.dots button[aria-pressed="true"],.pick button[aria-pressed="true"]{background:var(--butter);color:var(--carbon);border-color:var(--butter)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick button{border-radius:12px;padding:12px;font-weight:900;border:2px solid var(--line);background:var(--carbon);color:var(--paper)}
.items{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.items button{background:var(--carbon);color:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.items button b{font-size:14px}
.items button small{color:var(--muted);font-size:12px;font-weight:700}
.bl{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:14px}
.bl button{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kpi{background:var(--carbon);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--display);font-size:26px;color:var(--butter);font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--muted);font-weight:700}
.tw{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th{text-align:left;color:var(--muted);font-size:11px;letter-spacing:.12em;font-weight:900;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.r{text-align:right}
.cm{display:flex;flex-direction:column;gap:8px}
.cm div{background:var(--carbon);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
.cm small{display:block;color:var(--muted);font-weight:700;font-size:12px;margin-top:4px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--paper);color:var(--carbon);font-weight:900;padding:11px 18px;border-radius:999px;max-width:90vw;z-index:9;font-size:14px}
details summary{cursor:pointer;color:var(--muted);font-size:13px;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <header class="brand" id="brand">
    <h1><span>SMASH &amp; PASS</span>THE PASS CARD</h1>
    <p>Buy 9, the 10th is on us. Pass the payment this time.</p>
  </header>
  <nav class="staffbar" id="staffbar" hidden></nav>
  <main id="app" class="wrap" aria-live="polite"><div class="panel"><p class="note">Loading your card…</p></div></main>
</div>
<div id="qbar" class="qbar" hidden role="status"></div>
<div id="game" class="game" hidden role="dialog" aria-label="Game"></div>
<div id="qrbig" class="qrbig" hidden role="dialog" aria-modal="true" aria-label="Your Pass Card QR code"></div>
<div id="toast" class="toast" hidden></div>
<script>
(function () {
  var app = document.getElementById("app");
  var S = { customer: null, staff: null, need: 9, menu: [] };
  var welcomeP = null, lb = null;
  var screen = "home", basket = {}, found = null, rv = { food: 0, vibe: 0, card: "burger" }, redeemFor = null, owner = null;
  var MENU = {};

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function toast(t) { var el = document.getElementById("toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function () { el.hidden = true; }, 2800); }
  function niceDate(iso) { return new Date(iso).toLocaleDateString("en-GB", { day: "numeric", month: "short" }); }
  function fmtPhone(p) {
    p = String(p || "");
    if (p.indexOf("00") === 0) { var c = (S.countries || []).filter(function (x) { return p.slice(2).indexOf(x[2]) === 0; })[0];
      return c ? "+" + c[2] + " " + p.slice(2 + c[2].length) : "+" + p.slice(2); }
    return p.replace(/(\d{3})(\d{3})(\d{4})/, "$1 $2 $3");
  }
  /* Phone = country picker (flag + dial code) + the number after it, exact length per country */
  function flag(iso) { return iso.replace(/./g, function (ch) { return String.fromCodePoint(127397 + ch.charCodeAt(0)); }); }
  function country(iso) { var l = S.countries || []; return l.filter(function (x) { return x[0] === iso; })[0] || l[0] || ["AE", "UAE", "971", 9, 9]; }
  function lenText(c) { return c[3] === c[4] ? c[3] + " digits" : c[3] + " to " + c[4] + " digits"; }
  function phoneField(id, label) {
    var c = country(phoneField.iso || "AE");
    return '<div class="field"><label for="' + id + '">' + label + '</label><div class="tel">' +
      '<div class="cc"><span class="cc-flag" id="' + id + '-flag">' + flag(c[0]) + '</span>' +
      '<input id="' + id + '-cc" data-iso="' + c[0] + '" value="+' + c[2] + '" inputmode="tel" autocomplete="off" aria-label="Country code" role="combobox" aria-expanded="false" aria-controls="' + id + '-list">' +
      '<div class="cc-list" id="' + id + '-list" role="listbox" hidden></div></div>' +
      '<input id="' + id + '" inputmode="numeric" autocomplete="tel-national" data-max="' + c[4] + '" placeholder="' + (c[0] === "AE" ? "561234567" : "") + '"></div>' +
      '<p class="note" id="' + id + '-hint">' + lenText(c) + " after +" + c[2] + ", without the first 0</p></div>";
  }
  function readPhone(id, errId) {
    var ccEl = document.getElementById(id + "-cc");
    if (!ccEl.getAttribute("data-iso")) { showErr(errId, "Pick your country code from the list."); return null; }
    var c = country(ccEl.getAttribute("data-iso")), n = document.getElementById(id).value.replace(/\D/g, "").replace(/^0/, "");
    if (n.length < c[3] || n.length > c[4]) { showErr(errId, c[1] + " numbers are " + lenText(c) + " after +" + c[2] + "."); return null; }
    return "+" + c[2] + n;
  }
  /* net: true = the internet or the server failed (not a "no" from the server) */
  function api(path, body) {
    return fetch(path, body ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body), credentials: "same-origin" } : { credentials: "same-origin" })
      .then(function (r) { return r.json().then(function (j) { if (r.status >= 500) j.net = true; return j; },
        function () { return { ok: false, net: r.status >= 500, error: "Something went wrong. Try again." }; }); })
      .catch(function () { return { ok: false, net: true, error: "No connection. Check your internet and try again." }; });
  }
  /* ---- backup plan: this phone remembers things so the truck never stops ---- */
  function store(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* private mode */ } }
  function recall(k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } }
  var offline = false;
  /* stamps that couldn't reach the server wait here and send themselves later */
  function qrSrc() { return offline && recall("pc_qr") ? recall("pc_qr") : "/api/pass/qr.svg"; }
  function queue() { return recall("pc_queue") || []; }
  function queueStamp(phone, items) {
    var q = queue(); q.push({ qid: Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10), phone: phone, items: items, at: new Date().toISOString() });
    store("pc_queue", q); paintQueue();
  }
  var syncing = false;
  function syncQueue() {
    var q = queue(); if (!q.length || syncing) return; syncing = true;
    var item = q[0];
    api("/api/pass/staff/stamp", { phone: item.phone, items: item.items, offline: true, qid: item.qid }).then(function (res) {
      syncing = false;
      if (res.net || res.error === "staff_only") { paintQueue(); return; }      /* still offline / logged out: try later */
      offline = false;
      store("pc_queue", queue().filter(function (x) { return x.qid !== item.qid; }));
      if (!res.ok) toast("A saved stamp for " + fmtPhone(item.phone) + " couldn't be added: " + res.error);
      else if (!queue().length) toast("✅ Saved stamps sent");
      paintQueue(); syncQueue();
    });
  }
  function paintQueue() {
    var el = document.getElementById("qbar"); if (!el) return; var n = queue().length;
    el.hidden = !n && !offline;
    el.textContent = n ? "⏳ " + n + " stamp" + (n > 1 ? "s" : "") + " saved on this phone. They send by themselves when the internet is back."
      : "📴 Offline. Stamps you add are saved on this phone and sent later.";
  }
  /* a finished game whose score couldn't be sent */
  function syncFinish() {
    var p = recall("pc_finish"); if (!p) return;
    api("/api/pass/game/finish", p).then(function (f) {
      if (f.net) return;
      store("pc_finish", null);
      if (f.ok) { toast("+" + f.points + " Smash Points added from your last game"); if (S.customer && f.customer) { S.customer = Object.assign(S.customer, f.customer); keepText(); } }
    });
  }
  setInterval(syncFinish, 20000);
  window.addEventListener("online", syncFinish);
  setInterval(syncQueue, 20000);
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(function () {});
  window.addEventListener("online", syncQueue);
  function route() {
    var p = location.pathname.replace(/\/+$/, "");
    if (p.indexOf("/pass/s/") === 0) return { name: "scan", code: decodeURIComponent(p.slice(8)) };
    if (p === "/pass/truck") return { name: "truck" };
    if (p === "/pass/owner") return { name: "owner" };
    return { name: "card" };
  }
  function go(path) { history.pushState(null, "", path); load(); }
  window.addEventListener("popstate", load);

  /* ---------------- shared pieces ---------------- */
  function stamps(n) {
    var h = '<div class="stamps" aria-label="' + Math.min(n, S.need) + " of " + S.need + ' stamps">';
    for (var i = 0; i < S.need; i++) h += '<div class="st' + (i < n ? " on" : "") + '">' + (i < n ? "✓" : i + 1) + "</div>";
    return h + '<div class="st free' + (n >= S.need ? " ready" : "") + '">FREE</div></div>';
  }
  /* a full card renews by itself: the free item is banked and a fresh card starts */
  function freeOf(c, k) { return Math.floor((c[k] || 0) / S.need); }
  function cardHtml(c, k) {
    var n = (c[k] || 0) % S.need, free = freeOf(c, k), left = S.need - n, word = k === "burger" ? "burger" : "dessert";
    var done = c.done ? c.done[k] : 0;
    return '<section class="card ' + k + '"><div class="card-h"><h3>' + (k === "burger" ? "Burgers" : "Dee'serts") + "</h3><b>" + n + " / " + S.need + "</b></div>" + stamps(n) +
      (free ? '<div class="ready-banner">' + (k === "burger" ? "🍔 " : "🍰 ") + free + " FREE " + word.toUpperCase() + (free > 1 ? "S" : "") + " WAITING · ANY ONE YOU LIKE</div>" : "") +
      '<div class="meta">' + left + " more " + (left === 1 ? "stamp" : "stamps") + " and " + (free ? "another" : "your next") + " " + word + " is free." +
      (done ? " · <b>" + done + "</b> card" + (done > 1 ? "s" : "") + " done" : "") + "</div></section>";
  }
  /* fan level from every card ever finished (both cards together) */
  var LEVELS = [[10, "Smash Legend", "👑"], [5, "Loyal Fan", "🔥"], [3, "Regular", "⭐"], [1, "Smasher", "🍔"]];
  function levelOf(c) {
    var t = c.done ? c.done.burger + c.done.dessert : 0, cur = null, next = null;
    LEVELS.forEach(function (l) { if (t >= l[0] && !cur) cur = l; });
    for (var i = LEVELS.length - 1; i >= 0; i--) if (t < LEVELS[i][0]) { next = LEVELS[i]; break; }
    return { total: t, cur: cur, next: next };
  }
  function monthName(m) { return new Date(m + "-15T12:00:00Z").toLocaleDateString("en-GB", { month: "long" }); }
  function boardHtml(B, mine) {
    if (!B) return '<div class="panel"><div class="lbl">🏆 Top Smashers</div><p class="note">Loading…</p></div>';
    var h = '<div class="panel board"><div class="lbl">🏆 Top Smashers · ' + monthName(B.month) + "</div>" +
      '<p class="note">Most cards finished this month. <b style="color:var(--butter)">#1 wins a free meal on us</b> (at least ' + B.prizeMin + " cards to qualify).</p>";
    h += B.top.length ? '<ol class="lb">' + B.top.map(function (r) {
      return '<li' + (r.you ? ' class="you"' : "") + '><span class="rk">' + (r.rank === 1 ? "🥇" : r.rank === 2 ? "🥈" : r.rank === 3 ? "🥉" : r.rank) + "</span><span>" + esc(r.name) + (r.you ? " (you)" : "") +
        '</span><b>' + r.n + "</b></li>"; }).join("") + "</ol>" : '<p class="note">Nobody has finished a card this month yet. Be the first.</p>';
    if (mine) {
      if (mine.boardHide) h += '<p class="note">You\'re hidden from Top Smashers.</p>';
      else if (B.me && B.me.rank > 10) h += '<p class="note">You\'re #' + B.me.rank + " with " + B.me.n + " this month.</p>";
      h += '<button type="button" class="linkbtn" id="lb-hide">' + (mine.boardHide ? "SHOW ME ON TOP SMASHERS" : "HIDE MY NAME FROM TOP SMASHERS") + "</button>";
    }
    return h + "</div>";
  }
  function itemsText(items) { return Object.keys(items || {}).map(function (k) { return items[k] + "× " + (MENU[k] ? MENU[k].name : k); }).join(", "); }
  function showErr(id, t) { var el = document.getElementById(id); if (el) { el.textContent = t; el.hidden = false; } }

  /* ---------------- customer ---------------- */
  function viewCard() {
    var c = S.customer;
    if (!c) return screen === "join" ? joinForm() : screen === "crew" ? needStaff() + '<button class="btn ghost" type="button" id="to-login">BACK</button>' : loginForm();
    if (screen === "review" && c.pending) return reviewForm(c);
    var h = '<div class="hello"><h2>Hey ' + esc(c.first) + '</h2><button type="button" class="btn ghost" id="logout" style="flex:none;padding:8px 12px">LOG OUT</button></div>';
    if (offline) h += '<div class="panel" style="border-color:var(--butter)"><p class="note" style="margin:0">📴 <b>No internet.</b> This is your saved card, and your QR still works at the window. Stamps and points update when you\'re back online.</p></div>';
    /* the QR sits on top as a thumbnail; tapping it fills the screen for the truck to scan */
    h += '<button type="button" class="panel qr-top" id="qr-open" aria-label="Show my QR code full screen">' +
      '<span class="qr-thumb"><img src="' + qrSrc() + '" alt=""></span>' +
      '<span class="qr-txt"><span class="lbl">Show your QR code</span><b>' + esc(fmtPhone(c.phone)) + "</b>" +
      '<small>A unique QR code made for your phone number. Tap to make it big.</small></span><span class="qr-go" aria-hidden="true">⤢</span></button>';
    if (c.pending) h += '<div class="panel"><div class="lbl">How was your visit on ' + niceDate(c.pending.at) + "?</div>" +
      '<p class="note">Two quick ratings and an optional comment.' + (c.bonus ? "" : ' Your first review earns a <b style="color:var(--butter)">bonus stamp</b>.') + "</p>" +
      '<button type="button" class="btn pri" id="go-review">RATE MY VISIT</button></div>';
    if (c.surprise) {
      var sp = c.surprise.indexOf("dessert:") === 0 ? "a free " + (MENU[c.surprise.slice(8)] ? MENU[c.surprise.slice(8)].name.replace(/ \(.*\)$/, "") : "dessert") : "10% off your first order";
      if (c.visits.length <= 1) h += '<div class="panel" style="border-color:var(--butter)"><div class="lbl" style="color:var(--butter)">🎁 Your welcome surprise</div><p class="big">' + esc(sp) + '</p><p class="note">Thanks for joining the Pass Card.</p></div>';
    }
    h += pointsHtml(c);
    var lv = levelOf(c);
    h += '<div class="panel level"><div><span class="lvl-badge">' + (lv.cur ? lv.cur[2] + " " + lv.cur[1].toUpperCase() : "NEW ON THE CARD") + "</span></div>" +
      '<p class="note"><b>' + lv.total + "</b> card" + (lv.total === 1 ? "" : "s") + " finished" + (c.doneMonth ? " · <b>" + c.doneMonth + "</b> this month" : "") +
      (lv.next ? " · " + (lv.next[0] - lv.total) + " more to " + lv.next[2] + " " + lv.next[1] : " · top level") + "</p></div>";
    h += cardHtml(c, "burger") + cardHtml(c, "dessert");
    h += boardHtml(lb, c) + achHtml(c);
    if (c.visits.length) {
      h += '<div class="panel"><div class="lbl">Your visits</div>';
      c.visits.forEach(function (v) { h += '<div class="bl"><span>' + niceDate(v.at) + " · " + esc(itemsText(v.items)) + '</span><span style="color:var(--muted);flex:none">' + (v.food ? "★ " + v.food + "/" + v.vibe : "") + "</span></div>"; });
      h += "</div>";
    }
    h += '<details class="panel"><summary>Delete my Pass Card</summary><p class="note">This removes your card, your stamps and your reviews for good.</p>' +
      '<form id="f-del" class="row" novalidate><div class="field"><label for="del-pin">Your PIN</label><input id="del-pin" inputmode="numeric" maxlength="4" type="password" autocomplete="current-password"></div>' +
      '<button class="btn red" type="submit" style="align-self:flex-end">DELETE FOR GOOD</button></form><p class="err" id="del-err" hidden></p></details>';
    return h;
  }
  function loginForm() {
    return '<form class="panel" id="f-login" novalidate><div class="lbl">Log in</div>' +
      phoneField("l-phone", "Mobile number") +
      '<div class="field"><label for="l-pin">4-digit PIN</label><input id="l-pin" inputmode="numeric" maxlength="4" type="password" autocomplete="current-password"></div>' +
      '<p class="err" id="l-err" hidden></p><button class="btn pri" type="submit">OPEN MY CARD</button>' +
      '<button class="btn ghost" type="button" id="to-join">NEW HERE? GET A PASS CARD</button>' +
      '<p class="note">Forgot your PIN? Ask at the truck window and they\'ll reset it.</p>' +
      '<button type="button" class="crewlink" id="to-crew">crew</button></form>';
  }
  function joinForm() {
    return '<form class="panel" id="f-join" novalidate><div class="lbl">Get your Pass Card</div>' +
      '<div class="row"><div class="field"><label for="j-first">First name</label><input id="j-first" autocomplete="given-name"></div>' +
      '<div class="field"><label for="j-last">Last name</label><input id="j-last" autocomplete="family-name"></div></div>' +
      phoneField("j-phone", "Mobile number") +
      '<div class="field"><label for="j-email">Email</label><input id="j-email" type="email" autocomplete="email" required></div>' +
      '<div class="field"><label for="j-pin">Choose a 4-digit PIN</label><input id="j-pin" inputmode="numeric" maxlength="4" type="password" autocomplete="new-password"></div>' +
      '<label class="check"><input type="checkbox" id="j-ok"><span>I agree that Smash &amp; Pass keeps my name, number, email, what I buy and my reviews to run the Pass Card. I can delete my card at any time.</span></label>' +
      '<label class="check"><input type="checkbox" id="j-offers"><span>Send me offers on WhatsApp or email (optional).</span></label>' +
      '<p class="err" id="j-err" hidden></p><button class="btn pri" type="submit">CREATE MY CARD</button>' +
      '<button class="btn ghost" type="button" id="to-login">I ALREADY HAVE ONE</button></form>';
  }
  function reviewForm(c) {
    var dots = function (k) { var h = '<div class="dots" role="group">'; for (var i = 1; i <= 5; i++) h += '<button type="button" data-rate="' + k + '" data-v="' + i + '" aria-pressed="' + (rv[k] === i) + '">' + i + "</button>"; return h + "</div>"; };
    return '<form class="panel" id="f-review" novalidate><div class="lbl">Your visit · ' + niceDate(c.pending.at) + "</div>" +
      "<b>Food quality</b>" + dots("food") + "<b>The atmosphere</b>" + dots("vibe") +
      '<div class="field"><label for="r-text">Anything else? Ideas, wishes, complaints</label><textarea id="r-text" maxlength="500"></textarea></div>' +
      (c.bonus ? "" : '<div class="lbl">Your bonus stamp goes on</div><div class="pick"><button type="button" data-card="burger" aria-pressed="' + (rv.card === "burger") + '">🍔 Burgers</button><button type="button" data-card="dessert" aria-pressed="' + (rv.card === "dessert") + '">🍰 Dee\'serts</button></div>') +
      '<p class="err" id="r-err" hidden></p><button class="btn pri" type="submit">SEND REVIEW</button><button class="btn ghost" type="button" id="r-back">LATER</button></form>';
  }

  /* ---------------- truck ---------------- */
  function needStaff() {
    return '<form class="panel" id="f-staff" novalidate><div class="lbl">Truck crew login</div><p class="note">Same username and PIN as Dee\'s Stock.</p>' +
      '<div class="field"><label for="st-user">Username</label><input id="st-user" autocomplete="username" autocapitalize="none"></div>' +
      '<div class="field"><label for="st-pin">PIN</label><input id="st-pin" type="password" inputmode="numeric" autocomplete="current-password"></div>' +
      '<p class="err" id="st-err" hidden></p><button class="btn pri" type="submit">LOG IN</button></form>';
  }
  function viewTruck() {
    if (!S.staff) return needStaff();
    if (redeemFor && found) return redeemPanel();
    var h = '<form class="panel" id="f-find" novalidate><div class="lbl">Find the customer</div>' +
      '<div class="row"><div class="field" style="flex:2 1 180px"><label for="s-q">Mobile number</label><input id="s-q" inputmode="tel" placeholder="05X XXX XXXX or +966…"></div>' +
      '<button class="btn pri" type="submit" style="align-self:flex-end;flex:1 1 90px">FIND</button></div>' +
      '<p class="note">Faster: open the phone camera and scan the customer\'s QR. It opens their card here.</p><p class="err" id="s-err" hidden></p></form>';
    if (!found) return h + practiceHtml();
    var c = found;
    if (c.offline) {
      h += '<div class="panel"><div class="hello"><h2>' + esc(fmtPhone(c.phone)) + '</h2><span class="note">offline</span></div>' +
        '<p class="note">No internet, so their card can\'t load. Add the order anyway: it\'s saved on this phone and lands on their card when you\'re back online. Free items and points wait until then.</p></div>';
    } else {
    h += '<div class="panel"><div class="hello"><h2>' + esc(c.first + " " + c.last) + '</h2><span class="note">' + esc(fmtPhone(c.phone)) + "</span></div>" +
      (c.offline ? "" : '<div class="kpis"><div class="kpi"><b>' + (c.burger % S.need) + "/" + S.need + '</b><span>Burger card</span></div><div class="kpi"><b>' + (c.dessert % S.need) + "/" + S.need + "</b><span>Dee'sert card</span></div>" +
      '<div class="kpi"><b>' + (levelOf(c).cur ? levelOf(c).cur[2] : "–") + " " + levelOf(c).total + "</b><span>cards finished</span></div></div>");
    ["burger", "dessert"].forEach(function (k) { var f = freeOf(c, k); if (f) h += '<button type="button" class="btn red" data-redeem="' + k + '">GIVE FREE ' + k.toUpperCase() + (f > 1 ? " · " + f + " WAITING" : "") + "</button>"; });
    h += '<p class="note" style="margin-top:10px">⚡ <b style="color:var(--butter)">' + (c.points || 0) + "</b> Smash Points</p>";
    (S.rewards || []).forEach(function (rw) { if ((c.points || 0) >= rw.cost) h += '<button type="button" class="btn ghost" data-redeem="pts:' + rw.id + '">SPEND ' + rw.cost + " PTS · " + esc(rw.name).toUpperCase() + "</button>"; });
    h += "</div>";
    }
    if (welcomeP) h += '<div class="panel" style="background:var(--butter);color:var(--carbon);border-color:var(--butter)"><div class="lbl" style="color:var(--carbon)">🎁 First visit · welcome surprise</div>' +
      (welcomeP.kind === "dessert"
        ? '<p class="big" style="color:var(--carbon)">Give a free ' + esc(welcomeP.stock) + '</p><p style="margin:0;font-weight:700">Take it from the lot that expires ' + esc(niceDate(welcomeP.expires + "T12:00:00Z")) + '. It comes off the stock as a giveaway when you stamp the order.</p>'
        : '<p class="big" style="color:var(--carbon)">10% off the whole order</p><p style="margin:0;font-weight:700">Take 10% off the total before they pay, then stamp the order.</p>') + "</div>";
    var btn = function (m) { return '<button type="button" data-add="' + m.id + '"><b>' + esc(m.name) + "</b><small>+" + m.stamps + " stamp" + (m.stamps > 1 ? "s" : "") + (basket[m.id] ? " · " + basket[m.id] + " added" : "") + "</small></button>"; };
    h += '<div class="panel"><div class="lbl">What did they buy?</div><div class="lbl" style="color:var(--butter)">Burgers</div><div class="items">' +
      S.menu.filter(function (m) { return m.card === "burger"; }).map(btn).join("") + '</div><div class="lbl" style="color:var(--bad)">Dee\'serts</div><div class="items">' +
      S.menu.filter(function (m) { return m.card === "dessert"; }).map(btn).join("") + "</div>";
    var keys = Object.keys(basket);
    if (keys.length) {
      h += keys.map(function (k) { return '<div class="bl"><span>' + basket[k] + "× " + esc(MENU[k].name) + '</span><button type="button" data-less="' + k + '">remove one</button></div>'; }).join("") +
        '<button type="button" class="btn pri" id="stamp">STAMP THIS ORDER</button>';
    }
    h += '</div><details class="panel"><summary>Customer forgot their PIN</summary><form id="f-reset" class="row" novalidate>' +
      '<div class="field"><label for="rp-pin">New 4-digit PIN</label><input id="rp-pin" inputmode="numeric" maxlength="4"></div>' +
      '<button class="btn ghost" type="submit" style="align-self:flex-end">SET NEW PIN</button></form><p class="err" id="rp-err" hidden></p></details>';
    return h;
  }
  function redeemPanel() {
    var k = redeemFor;
    if (k.indexOf("pts:") === 0) {
      var rw = (S.rewards || []).filter(function (x) { return x.id === k.slice(4); })[0];
      return '<div class="panel"><div class="lbl">' + esc(rw.name) + " for " + esc(found.first) + " · " + rw.cost + ' points</div><p class="note">Which one are they taking?' +
        (rw.card === "dessert" ? " It comes off the stock as a giveaway automatically." : "") + '</p><div class="items">' +
        S.menu.filter(function (m) { return m.card === rw.card; }).map(function (m) { return '<button type="button" data-reward="' + rw.id + '" data-item="' + m.id + '"><b>' + esc(m.name) + "</b><small>" + rw.cost + " pts</small></button>"; }).join("") +
        '</div><button type="button" class="btn ghost" id="free-cancel">CANCEL</button></div>';
    }
    return '<div class="panel"><div class="lbl">Free ' + k + " for " + esc(found.first) + '</div><p class="note">Which one are they taking?' +
      (k === "dessert" ? " It comes off the stock as a giveaway automatically." : "") + '</p><div class="items">' +
      S.menu.filter(function (m) { return m.card === k; }).map(function (m) { return '<button type="button" data-free="' + m.id + '"><b>' + esc(m.name) + "</b><small>free</small></button>"; }).join("") +
      '</div><button type="button" class="btn ghost" id="free-cancel">CANCEL</button></div>';

  /* ---------------- owner ---------------- */
  function viewOwner() {
    if (!S.staff) return needStaff();
    if (!owner) return '<div class="panel"><p class="note">Loading…</p></div>';
    var O = owner, revs = O.visits.filter(function (v) { return v.food; });
    var avg = function (k) { return revs.length ? (revs.reduce(function (a, v) { return a + v[k]; }, 0) / revs.length).toFixed(1) + "★" : "–"; };
    var per = {}; O.visits.forEach(function (v) { per[v.phone] = (per[v.phone] || 0) + 1; });
    var back = Object.keys(per).filter(function (p) { return per[p] > 1; }).length;
    var scans = O.scans.filter(function (s) { return s.src === "truck"; });
    var scanTotal = scans.reduce(function (a, s) { return a + s.n; }, 0);
    var today = new Date(Date.now() + 4 * 3600e3).toISOString().slice(0, 10);
    var scanToday = scans.filter(function (s) { return s.day === today; }).reduce(function (a, s) { return a + s.n; }, 0);
    var conv = scanTotal ? Math.round((O.customers.length / scanTotal) * 100) + "%" : "–";
    var items = {}; O.visits.forEach(function (v) { Object.keys(v.items).forEach(function (k) { items[k] = (items[k] || 0) + v.items[k]; }); });
    var freeB = O.redeems.filter(function (r) { return r.card === "burger"; }).length;
    var kpi = function (v, l) { return '<div class="kpi"><b>' + v + "</b><span>" + esc(l) + "</span></div>"; };
    var h = (S.staff.role === "admin" ? '<div class="panel"><div class="lbl">🛟 Backup</div><p class="note">A copy of everything (customers, stamps, points and the stock) is saved automatically every night at 2am. You can also download one any time and keep it on your phone or Google Drive.</p>' +
      '<a class="btn ghost" href="/api/pass/backup" download style="text-align:center;text-decoration:none">DOWNLOAD BACKUP</a></div>' : "") + practiceHtml() +
      '<div class="panel"><div class="lbl">The truck QR</div><div class="kpis">' + kpi(scanTotal, "scans of the truck QR") + kpi(scanToday, "scans today") +
      kpi(O.customers.length, "signed up") + kpi(conv, "of scans signed up") + "</div></div>";
    h += '<div class="panel"><div class="lbl">Customers and reviews</div><div class="kpis">' + kpi(back, "came back more than once") + kpi(O.visits.length, "stamped orders") +
      kpi(avg("food"), "food quality, " + revs.length + " reviews") + kpi(avg("vibe"), "atmosphere") + kpi(freeB, "free burgers given") + kpi(O.redeems.length - freeB, "free desserts given") +
      kpi(O.customers.filter(function (c) { return c.surprise && c.surprise.indexOf("dessert:") === 0; }).length, "welcome desserts (giveaways)") +
      kpi(O.customers.filter(function (c) { return c.surprise === "discount10"; }).length, "welcome 10% discounts") + "</div></div>";
    if (O.points) {
      var pk = {}; O.points.forEach(function (p) { var k = p.kind.indexOf("ach:") === 0 ? "ach" : p.kind; pk[k] = pk[k] || { n: 0, pts: 0 }; pk[k].n += p.n; pk[k].pts += p.pts; });
      var gp = {}; (O.plays || []).forEach(function (p) { gp[p.kind === "scratch" ? "scratch" : p.game] = p; });
      var g = function (k) { return pk[k] || { n: 0, pts: 0 }; };
      h += '<div class="panel"><div class="lbl">⚡ Smash Points & games</div><div class="kpis">' +
        kpi(g("order").pts + g("game").pts + g("scratch").pts + g("ach").pts, "points given") + kpi(-g("reward").pts, "points spent") + kpi(g("reward").n, "rewards taken") +
        kpi((gp.scratch || { n: 0 }).n, "scratch cards") + Object.keys(GAME_INFO).map(function (k) { var p = gp[k] || { n: 0, avg: 0 };
          return kpi(p.n, GAME_INFO[k][1] + " plays" + (p.n ? " · avg " + Math.round(p.avg) : "")); }).join("") + "</div></div>";
    }
    if (lb) {
      h += '<div class="panel"><div class="lbl">🏆 Prize · free meal for the month\'s #1 (min. ' + lb.prizeMin + " cards)</div>" +
        (lb.leader ? '<p class="note">Leading ' + monthName(lb.month) + ": <b>" + esc(lb.leader.name) + "</b> · " + esc(fmtPhone(lb.leader.phone)) + " · " + lb.leader.n + " cards</p>"
          : '<p class="note">Nobody has ' + lb.prizeMin + " cards yet in " + monthName(lb.month) + ".</p>") +
        (lb.lastWinner ? '<p class="note">🥇 ' + monthName(lb.lastWinner.month) + " winner: <b>" + esc(lb.lastWinner.name) + "</b> · " + esc(fmtPhone(lb.lastWinner.phone)) + " · " + lb.lastWinner.n + " cards. Give them their free meal.</p>" : "") +
        "</div>" + boardHtml(lb, null);
    }
    if (Object.keys(items).length) h += '<div class="panel"><div class="lbl">What people buy</div><div class="tw"><table><thead><tr><th>ITEM</th><th class="r">BOUGHT</th></tr></thead><tbody>' +
      O.menu.filter(function (m) { return items[m.id]; }).sort(function (a, b) { return items[b.id] - items[a.id]; }).map(function (m) { return "<tr><td>" + esc(m.name) + '</td><td class="r">' + items[m.id] + "</td></tr>"; }).join("") + "</tbody></table></div></div>";
    var cms = revs.filter(function (v) { return v.comment; });
    var byPhone = {}; O.customers.forEach(function (c) { byPhone[c.phone] = c; });

            (lives ? '<button type="button" class="btn pri" data-' + (practice ? "practice" : "game") + '="' + id + '">🔁 PLAY AGAIN</button>' +
              '<button type="button" class="btn ghost" id="g-switch">🎮 CHANGE GAME</button>' : "") +
            '<button type="button" class="btn ' + (lives ? "ghost" : "pri") + '" id="g-close">' + (practice ? "BACK" : "BACK TO MY CARD") + "</button>");
          end.setAttribute("data-practice-mode", practice ? "1" : "");
        });
      };
      GAME[id](ctx, W, H, cv, hud, finish);
    });
  }
  function ptr(cv, e) { var r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
  function rr(ctx, x, y, w, h, rad, fill) { ctx.fillStyle = fill; ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, rad); else ctx.rect(x, y, w, h); ctx.fill(); }
  var GAME = {
    /* Burger Stack: a layer slides across; tap to drop it. Whatever hangs over is cut off. */
    stack: function (ctx, W, H, cv, hud, finish) {
      var LAY = [["#E9A23B", "bun"], ["#6B3218", "patty"], ["#FFC21A", "cheese"], ["#4CB548", "lettuce"], ["#E5432D", "tomato"], ["#6B3218", "patty"], ["#FFC21A", "cheese"],
        ["#4CB548", "lettuce"], ["#6B3218", "patty"], ["#FFC21A", "cheese"], ["#E5432D", "tomato"], ["#E9A23B", "bun"]];
      var LH = 26, base = { x: W / 2 - 80, w: 160 }, stack = [base], cur = 1, x = 0, dir = 1, speed = 2.2, over = false, fits = [], perfect = 0;
      function draw() {
        ctx.clearRect(0, 0, W, H); ctx.fillStyle = "#1E1E1E"; ctx.fillRect(0, 0, W, H);
        var off = Math.max(0, (stack.length + 2) * LH - (H - 60));
        rr(ctx, W / 2 - 110, H - 18 + off, 220, 10, 5, "#3A3A3A");
        stack.forEach(function (s, i) { var y = H - 30 - i * LH + off; rr(ctx, s.x, y - LH + 4, s.w, LH - 4, i === 0 || i === LAY.length - 1 ? 12 : 5, LAY[i][0]); });
        if (!over && cur < LAY.length) { var y2 = H - 30 - cur * LH + off; rr(ctx, x, y2 - LH + 4, stack[cur - 1].w, LH - 4, cur === LAY.length - 1 ? 12 : 5, LAY[cur][0]); }
        hud.textContent = (cur - 1) + " / " + (LAY.length - 1);
      }
      function loop() { if (over) return; var w = stack[cur - 1].w; x += dir * speed; if (x < 0 || x + w > W) { dir *= -1; x = Math.max(0, Math.min(W - w, x)); } draw(); requestAnimationFrame(loop); }
      function drop() {
        if (over) return;
        var prev = stack[cur - 1], w = prev.w, l = Math.max(x, prev.x), r = Math.min(x + w, prev.x + prev.w);
        if (Math.abs(x - prev.x) < 4) { l = prev.x; r = prev.x + prev.w; perfect++; }
        if (r - l <= 6) { over = true; draw(); return setTimeout(function () { finish(scoreOf()); }, 700); }
        stack.push({ x: l, w: r - l }); fits.push((r - l) / w); cur++; speed += 0.35; x = dir > 0 ? 0 : W - (r - l);
        if (cur >= LAY.length) { over = true; draw(); setTimeout(function () { finish(scoreOf()); }, 800); }
      }
      function scoreOf() { var placed = fits.length, avg = placed ? fits.reduce(function (a, b) { return a + b; }, 0) / placed : 0;
        return placed / (LAY.length - 1) * 70 + avg * 25 + Math.min(5, perfect); }
      cv.addEventListener("pointerdown", drop); loop();
    },
    /* Catch the Dee'sert: 20 seconds, desserts +1, ketchup bombs -2 */
    "catch": function (ctx, W, H, cv, hud, finish) {
      var trayX = W / 2, items = [], t0 = performance.now(), last = 0, score = 0, over = false, GOOD = ["🍰", "🍮", "🍫"];
      cv.addEventListener("pointermove", function (e) { trayX = ptr(cv, e)[0]; });
      cv.addEventListener("pointerdown", function (e) { trayX = ptr(cv, e)[0]; });
      function loop(now) {
        if (over) return;
        var el = (now - t0) / 1000, left = Math.max(0, 20 - el);
        if (now - last > Math.max(320, 700 - el * 18)) { last = now; var bad = Math.random() < 0.22;
          items.push({ x: 20 + Math.random() * (W - 40), y: -20, v: 2.2 + el * 0.12 + Math.random(), e: bad ? "💥" : GOOD[Math.floor(Math.random() * 3)], bad: bad }); }
        ctx.fillStyle = "#1E1E1E"; ctx.fillRect(0, 0, W, H);
        ctx.font = "30px sans-serif"; ctx.textAlign = "center";
        items.forEach(function (it) { it.y += it.v; ctx.fillText(it.e, it.x, it.y);
          if (!it.gone && it.y > H - 46 && it.y < H - 14 && Math.abs(it.x - trayX) < 46) { it.gone = true; score += it.bad ? -2 : 1; if (navigator.vibrate) navigator.vibrate(it.bad ? 80 : 15); } });
        items = items.filter(function (it) { return !it.gone && it.y < H + 30; });
        rr(ctx, trayX - 46, H - 30, 92, 14, 7, "#FFD21C");
        hud.textContent = "🍰 " + Math.max(0, score) + " · ⏱ " + Math.ceil(left);
        if (left <= 0) { over = true; return finish(Math.max(0, score) * 4); }
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    },
    /* Crack the Brûlée: taps in 10 seconds, 70 taps = 100 */
    /* Crack the Brûlée: 3 rounds of 15 seconds, each tap = 10 points (1000 max a round);
       the best round counts and is the customer's record to beat */
    crack: function (ctx, W, H, cv, hud, finish) {
      var ROUNDS = 3, SECS = 15, round = 0, taps = 0, t0 = null, state = "ready", best = 0, scores = [], cracks = [], readyAt = 0;
      var rec = (S.customer && S.customer.records && S.customer.records.crack) || 0;
      function draw() {
        ctx.fillStyle = "#1E1E1E"; ctx.fillRect(0, 0, W, H);
        var cx = W / 2, cy = H / 2 - 20, R = Math.min(W, H) * 0.36;
        rr(ctx, cx - R, cy, R * 2, R * 0.75, 18, "#FFF9EE");
        ctx.fillStyle = "#FFF9EE"; ctx.beginPath(); ctx.ellipse(cx, cy, R, R * 0.32, 0, 0, 7); ctx.fill();
        ctx.fillStyle = "#E3A23B"; ctx.beginPath(); ctx.ellipse(cx, cy, R * 0.86, R * 0.25, 0, 0, 7); ctx.fill();
        ctx.strokeStyle = "#5A2E0E"; ctx.lineWidth = 2;
        cracks.forEach(function (c) { ctx.beginPath(); ctx.moveTo(cx + c[0], cy + c[1]); ctx.lineTo(cx + c[2], cy + c[3]); ctx.stroke(); });
        ctx.textAlign = "center"; ctx.fillStyle = "#FFD21C"; ctx.font = "bold 30px sans-serif";
        var y = cy + R * 0.75 + 50;
        if (state === "play") ctx.fillText(Math.min(1000, taps * 10) + " / 1000", cx, y);
        else if (state === "ready") { ctx.fillText("ROUND " + (round + 1) + " OF " + ROUNDS, cx, y); ctx.font = "bold 17px sans-serif"; ctx.fillStyle = "#B3AEA3"; ctx.fillText("TAP THE RAMEKIN TO START", cx, y + 30); }
        else if (state === "between") { ctx.fillText("ROUND " + round + ": " + scores[round - 1] + " / 1000", cx, y); ctx.font = "bold 17px sans-serif"; ctx.fillStyle = "#B3AEA3"; ctx.fillText("TAP FOR ROUND " + (round + 1), cx, y + 30); }
        ctx.font = "bold 15px sans-serif"; ctx.fillStyle = "#B3AEA3";
        ctx.fillText((rec ? "YOUR RECORD " + rec : "NO RECORD YET") + (best ? "  ·  BEST TODAY " + best : ""), cx, 34);
      }
      function hudText() { hud.textContent = "R" + Math.min(ROUNDS, round + 1) + "/" + ROUNDS + " · ⏱ " + (state === "play" ? Math.max(0, SECS - (performance.now() - t0) / 1000).toFixed(1) : SECS + ".0"); }
      cv.addEventListener("pointerdown", function () {
        var now = performance.now();
        if (state === "done" || now < readyAt) return;
        if (state === "ready" || state === "between") { state = "play"; taps = 0; cracks = []; t0 = now; tick(); }
        taps++; var R = Math.min(W, H) * 0.3, a = Math.random() * 7;
        cracks.push([Math.cos(a) * R * 0.2, Math.sin(a) * R * 0.06, Math.cos(a) * R * (0.4 + Math.random() * 0.5), Math.sin(a) * R * 0.2]);
        if (cracks.length > 80) cracks.shift();
        draw(); if (navigator.vibrate) navigator.vibrate(8);
      });
      function tick() {
        if (state !== "play") return; hudText();
        if (performance.now() - t0 >= SECS * 1000) {
          var sc = Math.min(1000, taps * 10); scores.push(sc); best = Math.max(best, sc); round++;
          readyAt = performance.now() + 1200;               /* a short pause so a late tap doesn't start the next round */
          if (round >= ROUNDS) { state = "done"; draw(); return setTimeout(function () { finish(best / 10, best, scores); }, 900); }
          state = "between"; draw(); hudText(); return;
        }
        requestAnimationFrame(tick);
      }
      draw(); hudText();
    },
    /* Perfect Smash: 5 rounds, hit near the middle of the bar */
    smash: function (ctx, W, H, cv, hud, finish) {
      var round = 0, total = 0, t0 = performance.now(), over = false, msg = "", msgT = 0, speed = 1.6;
      function pos(now) { return (Math.sin((now - t0) / 1000 * speed * 2.2) + 1) / 2; }
      function loop(now) {
        if (over) return;
        ctx.fillStyle = "#1E1E1E"; ctx.fillRect(0, 0, W, H);
        var bx = 24, bw = W - 48, by = H / 2 - 16;
        rr(ctx, bx, by, bw, 32, 16, "#3A3A3A"); rr(ctx, bx + bw * 0.42, by, bw * 0.16, 32, 6, "#4CB548"); rr(ctx, bx + bw * 0.47, by, bw * 0.06, 32, 4, "#FFD21C");
        var p = pos(now); rr(ctx, bx + bw * p - 5, by - 14, 10, 60, 5, "#FFF9EE");
        ctx.font = "60px sans-serif"; ctx.textAlign = "center"; ctx.fillText("🥩", W / 2, by - 50);
        ctx.fillStyle = "#FFD21C"; ctx.font = "bold 26px sans-serif";
        if (now - msgT < 700) ctx.fillText(msg, W / 2, by + 100);
        ctx.fillStyle = "#B3AEA3"; ctx.font = "bold 16px sans-serif"; ctx.fillText("TAP ANYWHERE TO SMASH", W / 2, H - 30);
        hud.textContent = "Round " + Math.min(5, round + 1) + " / 5 · " + Math.round(total);
        requestAnimationFrame(loop);
      }
      cv.addEventListener("pointerdown", function () {
        if (over) return; var d = Math.abs(pos(performance.now()) - 0.5), pts = Math.max(0, 20 * (1 - d * 3.2));
        total += pts; round++; msg = d < 0.03 ? "PERFECT!" : d < 0.08 ? "GREAT" : d < 0.15 ? "OK" : "MISS"; msgT = performance.now(); speed += 0.35;
        if (navigator.vibrate) navigator.vibrate(40);
        if (round >= 5) { over = true; setTimeout(function () { finish(total); }, 600); }
      });
      requestAnimationFrame(loop);
    }
  };

  function keepText() { var ta = document.getElementById("r-text"), v = ta ? ta.value : ""; render(); var n = document.getElementById("r-text"); if (n) n.value = v; }

  /* country code box: type a code (or a name) and the list narrows; a full code picks itself */
  function pickCountry(id, iso, focusNumber) {
    var c = country(iso), cc = document.getElementById(id + "-cc"), inp = document.getElementById(id);
    phoneField.iso = c[0]; cc.setAttribute("data-iso", c[0]); cc.value = "+" + c[2];
    document.getElementById(id + "-flag").textContent = flag(c[0]);
    inp.setAttribute("data-max", c[4]); inp.placeholder = c[0] === "AE" ? "561234567" : ""; inp.value = inp.value.slice(0, c[4]);
    document.getElementById(id + "-hint").textContent = lenText(c) + " after +" + c[2] + ", without the first 0";
    ccList(id, null); if (focusNumber) inp.focus();
  }
  function ccList(id, q) {
    var box = document.getElementById(id + "-list"), cc = document.getElementById(id + "-cc");
    if (q == null) { box.hidden = true; cc.setAttribute("aria-expanded", "false"); return; }
    var dig = q.replace(/\D/g, ""), word = q.replace(/[^a-z ]/gi, "").trim().toLowerCase();
    var hits = (S.countries || []).filter(function (x) {
      return word ? x[1].toLowerCase().indexOf(word) >= 0 : !dig || x[2].indexOf(dig) === 0; });
    box.innerHTML = hits.length ? hits.map(function (x) {
      return '<button type="button" role="option" data-cc="' + id + '" data-iso="' + x[0] + '"><span>' + flag(x[0]) + '</span><b>+' + x[2] + "</b>" + esc(x[1]) + "</button>"; }).join("")
      : '<p class="note" style="margin:8px">No country with that code.</p>';
    box.hidden = false; cc.setAttribute("aria-expanded", "true");
  }
  document.addEventListener("focusin", function (e) {
    var t = e.target; if (t.id && /-cc$/.test(t.id)) { t.select(); ccList(t.id.slice(0, -3), ""); }
  });
  document.addEventListener("mousedown", function (e) {
    var o = e.target.closest("[data-cc]");
    if (o) { e.preventDefault(); pickCountry(o.getAttribute("data-cc"), o.getAttribute("data-iso"), true); return; }
    if (!e.target.closest(".cc")) document.querySelectorAll(".cc-list").forEach(function (l) { l.hidden = true; });
  });
  document.addEventListener("focusout", function (e) {
    var t = e.target; if (!t.id || !/-cc$/.test(t.id)) return;
    var id = t.id.slice(0, -3);
    setTimeout(function () { var cc = document.getElementById(id + "-cc"); if (!cc || document.activeElement === cc) return;
      ccList(id, null); var iso = cc.getAttribute("data-iso"); if (iso) pickCountry(id, iso, false); }, 150);
  });
  document.addEventListener("input", function (e) {
    var t = e.target;
    if (t.id && /-cc$/.test(t.id)) {
      var id = t.id.slice(0, -3), dig = t.value.replace(/\D/g, "");
      var exact = /[a-z]/i.test(t.value) ? null : (S.countries || []).filter(function (x) { return x[2] === dig; })[0];
      if (exact) return pickCountry(id, exact[0], true);
      t.setAttribute("data-iso", ""); document.getElementById(id + "-flag").textContent = "🌐";
      return ccList(id, t.value);
    }
    if (!t.id || !document.getElementById(t.id + "-cc")) return;
    /* a full number pasted or autofilled (+966…, 00966…) moves its code to the country box */
    var raw = t.value.trim(), dd = raw.replace(/\D/g, "");
    if (raw.charAt(0) === "+" || dd.indexOf("00") === 0) {
      if (dd.indexOf("00") === 0) dd = dd.slice(2);
      var hit = (S.countries || []).filter(function (x) { return dd.indexOf(x[2]) === 0; })[0];
      if (hit) { t.value = dd.slice(hit[2].length); pickCountry(t.id, hit[0], false); }
    }
    var v = t.value.replace(/\D/g, "").replace(/^0/, "").slice(0, +t.getAttribute("data-max") || 15); if (v !== t.value) t.value = v;
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !document.getElementById("qrbig").hidden) document.getElementById("qr-close").click();
  });
  document.addEventListener("submit", function (e) {
    e.preventDefault();
    var f = e.target, val = function (id) { var el = document.getElementById(id); return el ? el.value.trim() : ""; };
    var btn = f.querySelector('button[type="submit"]'); if (btn) btn.disabled = true;
    var done = function () { if (btn) btn.disabled = false; };
    if (f.id === "f-login" || f.id === "f-join") {
      var ph = readPhone(f.id === "f-login" ? "l-phone" : "j-phone", f.id === "f-login" ? "l-err" : "j-err");
      if (!ph) return done();
      if (f.id === "f-join" && !val("j-email")) { showErr("j-err", "Add your email."); return done(); }
    }
    if (f.id === "f-login") api("/api/pass/login", { phone: ph, pin: val("l-pin") }).then(function (r) { done(); if (!r.ok) return showErr("l-err", r.error); load(); });
    if (f.id === "f-join") api("/api/pass/join", { first: val("j-first"), last: val("j-last"), phone: ph, email: val("j-email"), pin: val("j-pin"),
      consent: document.getElementById("j-ok").checked, offers: document.getElementById("j-offers").checked }).then(function (r) { done(); if (!r.ok) return showErr("j-err", r.error); screen = "home"; load(); toast("Your Pass Card is ready"); });
    if (f.id === "f-review") {
      if (!rv.food || !rv.vibe) { done(); return showErr("r-err", "Pick a number for both food and atmosphere."); }
      api("/api/pass/review", { food: rv.food, vibe: rv.vibe, comment: val("r-text"), card: rv.card }).then(function (r) {
        done(); if (!r.ok) return showErr("r-err", r.error);
        screen = "home"; rv = { food: 0, vibe: 0, card: "burger" }; load();
        toast(r.bonus ? "Thanks! Bonus stamp added to your " + r.bonus + " card" : "Thanks for the review");
      });
    }
    if (f.id === "f-staff") api("/api/login", { user: val("st-user"), pin: val("st-pin") }).then(function (r) { done(); if (!r.ok) return showErr("st-err", r.error); load(); });
    if (f.id === "f-find") api("/api/pass/staff/find?q=" + encodeURIComponent(val("s-q"))).then(function (r) {
      done();
      if (!r.ok && r.net && val("s-q").replace(/\D/g, "").length >= 8) { offline = true; paintQueue(); found = { offline: true, phone: val("s-q"), first: "", last: "" }; welcomeP = null; basket = {}; return render(); }
      if (!r.ok) return showErr("s-err", r.error); found = r.customer; welcomeP = r.welcome; basket = {}; render(); });
    if (f.id === "f-reset") api("/api/pass/staff/resetpin", { phone: found.phone, pin: val("rp-pin") }).then(function (r) { done(); if (!r.ok) return showErr("rp-err", r.error); toast("New PIN set. Tell the customer."); render(); });
    if (f.id === "f-del") api("/api/pass/delete", { pin: val("del-pin") }).then(function (r) { done(); if (!r.ok) return showErr("del-err", r.error); S.customer = null; store("pc_card", null); store("pc_qr", null); render(); toast("Your Pass Card was deleted."); });
  });

  load();
})();
</script>
