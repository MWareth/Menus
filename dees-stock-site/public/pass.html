<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101010">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/pass.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pass Card">
<title>The Pass Card · Smash &amp; Pass</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Cairo:wght@500;700;900&display=swap">
<style>
:root{
  --carbon:#101010; --panel:#1B1B19; --line:#2E2E2A; --paper:#FFF9EE; --muted:#B3AEA3;
  --butter:#FFD21C; --ketchup:#F02820; --ok:#5BD08A; --bad:#FF8A80;
  --display:'Lilita One','Arial Black',sans-serif; --body:Cairo,'Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--carbon);color:var(--paper);margin:0}
body{font-family:var(--body);font-size:15px;line-height:1.45;padding:env(safe-area-inset-top,0px) 16px calc(40px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-width:0;width:100%}
.wrap>*,.panel>*{min-width:0}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;letter-spacing:.01em;text-wrap:balance}
button,input,textarea{font-family:inherit;font-size:15px}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--butter);outline-offset:2px}
.brand{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:18px}
.brand h1{font-size:44px;line-height:.9;color:var(--butter)}
.brand h1 span{display:block;color:var(--paper);font-size:18px;letter-spacing:.18em;font-family:var(--body);font-weight:900;margin-bottom:4px}
.brand p{margin:0;color:var(--muted);font-size:12.5px;max-width:150px;text-align:right}
[hidden]{display:none!important}
.staffbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.staffbar a{color:var(--paper);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;text-decoration:none;font-weight:900;letter-spacing:.06em}
.tel{display:flex;gap:8px}
.cc{position:relative;flex:0 0 108px}
.cc-flag{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:18px;pointer-events:none}
.field .cc input{padding-left:38px;letter-spacing:.02em}
.cc-list{position:absolute;z-index:20;left:0;top:calc(100% + 6px);width:min(300px,80vw);max-height:260px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.45);padding:4px}
.cc-list button{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;color:var(--paper);font:inherit;font-size:14px;text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer}
.cc-list button:hover,.cc-list button:focus{background:var(--carbon)}
.cc-list b{min-width:46px}
.tel input{flex:1 1 auto;min-width:0;letter-spacing:.06em}
.lvl-badge{display:inline-block;background:var(--butter);color:var(--carbon);font-family:'Lilita One',sans-serif;font-size:18px;letter-spacing:.03em;border-radius:999px;padding:6px 14px}
.level .note{margin-top:8px}
.lb{list-style:none;margin:10px 0 4px;padding:0;display:flex;flex-direction:column;gap:6px}
.lb li{display:flex;gap:10px;align-items:center;background:var(--carbon);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.lb li span:nth-child(2){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb li.you{border-color:var(--butter)}
.lb .rk{width:26px;text-align:center;font-weight:900}
.lb b{font-family:'Lilita One',sans-serif;font-size:18px;color:var(--butter)}
.linkbtn{background:none;border:0;color:var(--muted);font:inherit;font-size:12px;font-weight:900;letter-spacing:.06em;cursor:pointer;padding:8px 0}
.pts-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.pts-n{font-family:'Lilita One',sans-serif;font-size:44px;line-height:1;color:var(--butter);margin:4px 0 0}
.rw{margin-top:12px}.rw-h{display:flex;justify-content:space-between;gap:8px;font-size:14px}.rw-h span{color:var(--muted);font-size:12px;font-weight:800}
.bar{height:10px;background:var(--carbon);border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--butter);border-radius:999px}
.rw small{color:var(--muted);font-size:11px}
.scratch{position:relative;width:100%;max-width:300px;aspect-ratio:300/140;margin:10px auto 0;border-radius:14px;overflow:hidden;background:var(--butter)}
.scr-prize{position:absolute;inset:0;display:grid;place-items:center;align-content:center;font-family:'Lilita One',sans-serif;font-size:46px;color:var(--carbon)}
.scr-prize small{display:block;font-size:14px;letter-spacing:.1em;text-align:center}
.scratch canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
.games{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.games button{background:var(--carbon);border:1px solid var(--line);border-radius:14px;color:var(--paper);padding:12px 10px;text-align:left;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.games button span{font-size:26px}.games button b{font-family:'Lilita One',sans-serif;font-weight:400;font-size:16px}.games button small{color:var(--muted);font-size:11.5px;line-height:1.3}
.games button:active{border-color:var(--butter)}
.ach{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.ach .a{background:var(--carbon);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px;opacity:.55}
.ach .a.on{opacity:1;border-color:var(--butter)}.ach span{font-size:22px}.ach b{font-size:13px}.ach small{color:var(--muted);font-size:11px;line-height:1.3}
.game{position:fixed;inset:0;z-index:50;background:#101010;display:flex;flex-direction:column;align-items:center;padding:14px 12px;gap:10px}
.g-top{width:100%;max-width:420px;display:flex;justify-content:space-between;align-items:center;font-family:'Lilita One',sans-serif;font-size:18px;color:var(--butter)}
.g-top span{color:var(--paper);font-family:inherit}
.game canvas{border-radius:16px;touch-action:none;background:#1E1E1E}
.g-help{color:var(--muted);font-size:13px;text-align:center;max-width:380px;margin:0}
.g-end{margin:auto;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;width:100%;max-width:340px}
.g-score{font-family:'Lilita One',sans-serif;font-size:72px;line-height:1;color:var(--butter);margin:0}.g-score small{font-size:24px;color:var(--muted)}
.qbar{position:fixed;left:12px;right:12px;bottom:12px;z-index:40;background:var(--butter);color:var(--carbon);border-radius:14px;padding:12px 14px;font-weight:800;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.lives{margin:0;font-size:18px;letter-spacing:.04em}.lives b{font-size:14px;letter-spacing:.06em;color:var(--butter);margin-left:4px}
.g-lives{margin:0;font-size:14px;font-weight:800;color:var(--paper);letter-spacing:.04em}
.g-end .btn{width:100%}
.gboards{display:grid;grid-template-columns:1fr;gap:10px;margin-top:8px}
.gb>b{font-size:14px}.gb .lb{margin-top:6px}.gb .lb li{padding:7px 10px}.gb .lb b{font-size:16px}
.brand{position:relative}
.lang{position:absolute;top:0;inset-inline-end:0;background:transparent;border:1px solid var(--line);color:var(--paper);border-radius:999px;padding:6px 14px;font:inherit;font-weight:800;font-size:14px;cursor:pointer}
.howto{border-color:var(--butter)}.howto p{margin:0;font-size:15px;line-height:1.45}
.howto-h{display:flex;justify-content:space-between;align-items:center}
.howto-x{background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer;padding:4px 8px}
details.more{margin:4px 0 12px;display:flex;flex-direction:column;gap:12px}
details.more>summary{list-style:none;cursor:pointer;text-align:center;font-weight:900;letter-spacing:.06em;font-size:13px;color:var(--paper);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:12px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:" ▾"}details.more[open]>summary::after{content:" ▴"}
details.more>.panel{margin-bottom:12px}
.rec{color:var(--butter);font-family:inherit;font-size:12px}
.pts-side{text-align:end}
[dir=rtl] .lb li span:nth-child(2),[dir=rtl] .note,[dir=rtl] .lbl{text-align:right}
.crewlink{display:block;margin:10px auto 0;background:none;border:0;color:var(--line);font:inherit;font-size:11px;letter-spacing:.08em;cursor:pointer;padding:4px 10px}
.staffbar .linkbtn{margin-left:auto;background:none;border:0;color:var(--muted);font:inherit;font-weight:900;letter-spacing:.06em;cursor:pointer;padding:6px 4px}
.staffbar a[aria-current="page"]{background:var(--butter);color:var(--carbon);border-color:var(--butter)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.lbl{font-size:11.5px;font-weight:900;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field input,.field textarea,.field select{background:var(--carbon);color:var(--paper);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-width:0}
.field textarea{min-height:84px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--muted)}
.check input{margin-top:3px;accent-color:var(--butter);width:18px;height:18px;flex:none}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;font-size:14px}
.btn[disabled]{opacity:.5}
.pri{background:var(--butter);color:var(--carbon)}
.red{background:var(--ketchup);color:var(--paper)}
.ghost{background:transparent;color:var(--paper);border:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
.err{color:var(--bad);font-size:13.5px;font-weight:700;margin:0}
.note{color:var(--muted);font-size:12.5px;margin:0}
.note a{color:var(--butter)}
.hello{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hello h2{font-size:26px}
.card{border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card.burger{background:var(--butter);color:var(--carbon)}
.card.dessert{background:var(--ketchup);color:var(--paper)}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card-h h3{font-size:28px;line-height:1}
.card-h b{font-weight:900;font-size:13px;letter-spacing:.08em}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.st{aspect-ratio:1;max-width:100%;border-radius:50%;border:2.5px dashed currentColor;opacity:.55;display:grid;place-items:center;font-family:var(--display);font-size:13px}
.st.on{opacity:1;border-style:solid;background:var(--carbon);color:var(--butter)}
.dessert .st.on{color:var(--paper)}
.st.free{opacity:1;border-style:solid;font-size:12px}
.st.free.ready{background:var(--carbon);color:var(--butter);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.st.free.ready{animation:none}}
.card .meta{font-weight:700;font-size:13px}
.ready-banner{background:var(--carbon);color:var(--butter);border-radius:12px;padding:8px 12px;font-weight:900;letter-spacing:.06em;font-size:13px;text-align:center}
.qrbox{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.panel.qr-top{display:flex;flex-direction:row;gap:14px;align-items:center;width:100%;text-align:left;color:var(--paper);font:inherit;cursor:pointer;border-color:var(--butter)}
.qr-thumb{flex:none;width:78px;height:78px;background:#FFD21C;border-radius:12px;padding:5px}
.qr-thumb img{display:block;width:100%;height:100%}
.qr-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.qr-txt b{font-size:18px;color:var(--butter)}
.qr-txt small{color:var(--muted);font-size:12.5px;line-height:1.35}
.qr-go{flex:none;font-size:22px;color:var(--butter)}
.qrbig{position:fixed;inset:0;z-index:60;background:#FFD21C;display:grid;place-items:center;padding:20px;overflow:auto}
.qrbig-in{width:100%;max-width:420px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--carbon)}
.qrbig-in img{width:min(86vw,380px);height:auto;aspect-ratio:1;display:block}
.qrbig-name{font-size:22px;font-weight:900;margin:6px 0 0}
.qrbig-num{font-size:18px;font-weight:700;margin:0;letter-spacing:.04em}
.qrbig .btn{width:100%;margin-top:8px}
.qr{background:#FFD21C;padding:6px;border-radius:12px;flex:none;width:150px;height:150px}
.qr img{display:block;width:138px;height:138px}
.big{font-family:var(--display);font-size:22px;color:var(--butter);margin:0}
.dots{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.dots button{background:var(--carbon);color:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 0;font-family:var(--display);font-size:18px}
.dots button[aria-pressed="true"],.pick button[aria-pressed="true"]{background:var(--butter);color:var(--carbon);border-color:var(--butter)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick button{border-radius:12px;padding:12px;font-weight:900;border:2px solid var(--line);background:var(--carbon);color:var(--paper)}
.items{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.items button{background:var(--carbon);color:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.items button b{font-size:14px}
.items button small{color:var(--muted);font-size:12px;font-weight:700}
.bl{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:14px}
.bl button{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kpi{background:var(--carbon);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--display);font-size:26px;color:var(--butter);font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--muted);font-weight:700}
.tw{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th{text-align:left;color:var(--muted);font-size:11px;letter-spacing:.12em;font-weight:900;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.r{text-align:right}
.cm{display:flex;flex-direction:column;gap:8px}
.cm div{background:var(--carbon);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
.cm small{display:block;color:var(--muted);font-weight:700;font-size:12px;margin-top:4px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--paper);color:var(--carbon);font-weight:900;padding:11px 18px;border-radius:999px;max-width:90vw;z-index:9;font-size:14px}
details summary{cursor:pointer;color:var(--muted);font-size:13px;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <header class="brand" id="brand">
    <h1><span>SMASH &amp; PASS</span>THE PASS CARD</h1>
    <p>Buy 9, the 10th is on us. Pass the payment this time.</p>
  </header>
  <nav class="staffbar" id="staffbar" hidden></nav>
  <main id="app" class="wrap" aria-live="polite"><div class="panel"><p class="note">Loading your card…</p></div></main>
</div>
<div id="qbar" class="qbar" hidden role="status"></div>
<div id="game" class="game" hidden role="dialog" aria-label="Game"></div>
<div id="qrbig" class="qrbig" hidden role="dialog" aria-modal="true" aria-label="Your Pass Card QR code"></div>
<div id="toast" class="toast" hidden></div>
<script src="/qrcode.js"></script>
<script>
(function () {
  var app = document.getElementById("app");
  var S = { customer: null, staff: null, need: 9, menu: [] };
  var welcomeP = null, lb = null;
  var shelf = null;   /* pieces left per stock item, from the last customer lookup; null offline */
  var screen = "home", basket = {}, found = null, rv = { food: 0, vibe: 0, card: "burger" }, redeemFor = null, owner = null;
  var MENU = {}, moreOpen = false;
  /* ---------------- English / عربي (customer pages only; the crew screens stay English) ---------------- */
  var AR = {
    "Buy 9, the 10th is on us. Burgers and dee'serts.": "اشتري 9 والعاشرة علينا. برجر وحلويات.",
    "Hey {n}": "أهلاً {n}", "LOG OUT": "خروج",
    "Show my QR code full screen": "اعرض رمز QR بملء الشاشة",
    "Show your QR code": "اعرض رمز QR الخاص بك",
    "A unique QR code made for your phone number. Tap to make it big.": "رمز QR خاص برقم هاتفك فقط. اضغط لتكبيره.",
    "Show this at the window": "اعرضه عند النافذة", "DONE": "تم",
    "The truck scans it to add your stamps. Each order earns 1 savory stamp if it has burgers and 1 dessert stamp if it has desserts.":
      "يمسحه فريق الشاحنة لإضافة أختامك. كل طلب يحصل على ختم مالح واحد إذا فيه برجر، وختم حلويات واحد إذا فيه حلويات.",
    "📴 <b>No internet.</b> This is your saved card, and your QR still works at the window. Stamps and points update when you're back online.":
      "📴 <b>لا يوجد إنترنت.</b> هذه بطاقتك المحفوظة، ورمز QR يعمل عند النافذة. الأختام والنقاط تتحدّث عند عودة الإنترنت.",
    "How it works": "كيف تعمل", "Close": "إغلاق",
    "🍔🍰 <b>Stamps:</b> every order gets 1 savory stamp and/or 1 dessert stamp. 9 stamps = a free one.":
      "🍔🍰 <b>الأختام:</b> كل طلب يحصل على ختم مالح و/أو ختم حلويات. 9 أختام = واحدة مجاناً.",
    "⚡ <b>Points:</b> earned from orders and games. Spend them at the window on free food.":
      "⚡ <b>النقاط:</b> تكسبها من الطلبات والألعاب. استبدلها عند النافذة بأكل مجاني.",
    "❤️ <b>Lives:</b> every order gives you 5 games to play while you wait.":
      "❤️ <b>المحاولات:</b> كل طلب يعطيك 5 ألعاب تلعبها وأنت تنتظر.",
    "How was your visit on {d}?": "كيف كانت زيارتك يوم {d}؟",
    "Two quick ratings and an optional comment.": "تقييمان سريعان وتعليق اختياري.",
    "Your first review earns a <b>bonus stamp</b>.": "أول تقييم لك يمنحك <b>ختماً إضافياً</b>.",
    "RATE MY VISIT": "قيّم زيارتي",
    "a free {item}": "{item} مجاناً", "dessert": "حلوى", "10% off your first order": "خصم 10% على طلبك الأول",
    "🎁 Your welcome surprise": "🎁 مفاجأة الترحيب", "Thanks for joining the Pass Card.": "شكراً لانضمامك إلى بطاقة باس.",
    "NEW ON THE CARD": "جديد في البطاقة", "<b>1</b> card finished": "أكملت <b>1</b> بطاقة", "<b>{n}</b> cards finished": "أكملت <b>{n}</b> بطاقات",
    "<b>{n}</b> this month": "<b>{n}</b> هذا الشهر", "{n} more to {lvl}": "باقي {n} للوصول إلى {lvl}", "top level": "أعلى مستوى",
    "Smash Legend": "أسطورة سماش", "Loyal Fan": "معجب وفي", "Regular": "زبون دائم", "Smasher": "سماشر",
    "Your visits": "زياراتك", "ℹ️ HOW IT WORKS": "ℹ️ كيف تعمل",
    "More: your level, leaderboards, achievements & visits": "المزيد: مستواك، المتصدرون، الإنجازات والزيارات",
    "Want your Pass Card and data deleted? Email {e} from the email on your card.": "تريد حذف بطاقتك وبياناتك؟ راسلنا على {e} من البريد المسجّل في بطاقتك.",

            (s.device ? " " + esc(s.device) + (s.browser && s.browser !== "Other" ? "/" + esc(s.browser) : "") : "") + (s.src === "scan" ? " (ad)" : "") + (s.joined ? " ✅" : ""); }).join(" · ") + "</p>"; }).join("") +
        '<p class="note">✅ = that scan signed up. iPhone/Instagram means the QR was opened inside the Instagram app.</p></div>';
    }

  function load() {
    var r = route();
    api("/api/pass/session").then(function (res) {
      if (!res.ok) {
        /* no internet / server down: fall back to what this phone remembers */
        var crewSaved = recall("pc_staff"), cardSaved = recall("pc_card");
        if (res.net && (r.name === "truck" || r.name === "scan") && crewSaved) {
          S = crewSaved; MENU = {}; (S.menu || []).forEach(function (m) { MENU[m.id] = m; }); offline = true; paintQueue();
          if (r.name === "scan") { found = { offline: true, phone: r.code.split("-")[0], first: "", last: "" }; basket = {}; welcomeP = null; shelf = null; }
          return render();
        }
        if (res.net && r.name === "card" && cardSaved) {
          S = cardSaved; MENU = {}; (S.menu || []).forEach(function (m) { MENU[m.id] = m; }); offline = true; return render();
        }
        app.innerHTML = '<div class="panel"><p class="err">' + L("Couldn't load the Pass Card. ") + (res.net ? L("No internet right now. ") : "") + L("Pull down to refresh.") + "</p></div>"; return;
      }
      offline = false; paintQueue();
      S = res; MENU = {}; (res.menu || []).forEach(function (m) { MENU[m.id] = m; });
      if (res.staff) { var keep = Object.assign({}, res); delete keep.customer; store("pc_staff", keep); syncQueue(); }
      if (res.customer) {
        syncFinish();
        store("pc_card", res);
        store("pc_qr", null);   /* old saved QR pictures are no longer used: the QR is drawn from the card itself */
      }
      if (r.name === "card" && S.staff) { history.replaceState(null, "", crewHome()); screen = "home"; return load(); }
      if (r.name === "scan" && S.staff) {
        return api("/api/pass/staff/find?q=" + encodeURIComponent(r.code)).then(function (f) {
          found = f.ok ? f.customer : null; welcomeP = f.ok ? f.welcome : null; shelf = f.ok && f.stock ? f.stock : null; basket = {}; render();
          if (!f.ok) showErr("s-err", f.error || "That code isn't a Pass Card.");
        });
      }
      if (r.name === "owner" && S.staff) {
        owner = null; render();
        return Promise.all([api("/api/pass/owner"), api("/api/pass/board")]).then(function (o) { owner = o[0].ok ? o[0] : null; lb = o[1].ok ? o[1] : null; render(); });
      }
      render();
      if (r.name === "card" && S.customer) api("/api/pass/board").then(function (b) { if (b.ok) { lb = b; if (route().name === "card") keepText(); } });
    });
  }

    ccList(id, null); if (focusNumber) inp.focus();
  }
  function ccList(id, q) {
    var box = document.getElementById(id + "-list"), cc = document.getElementById(id + "-cc");
    if (q == null) { box.hidden = true; cc.setAttribute("aria-expanded", "false"); return; }
    var dig = q.replace(/\D/g, ""), word = q.replace(/[^a-z ]/gi, "").trim().toLowerCase();
    var hits = (S.countries || []).filter(function (x) {
      return word ? x[1].toLowerCase().indexOf(word) >= 0 : !dig || x[2].indexOf(dig) === 0; });
    box.innerHTML = hits.length ? hits.map(function (x) {
      return '<button type="button" role="option" data-cc="' + id + '" data-iso="' + x[0] + '"><span>' + flag(x[0]) + '</span><b>+' + x[2] + "</b>" + esc(x[1]) + "</button>"; }).join("")
      : '<p class="note" style="margin:8px">' + L("No country with that code.") + "</p>";
    box.hidden = false; cc.setAttribute("aria-expanded", "true");
  }
  document.addEventListener("focusin", function (e) {
    var t = e.target; if (t.id && /-cc$/.test(t.id)) { t.select(); ccList(t.id.slice(0, -3), ""); }
  });
  document.addEventListener("mousedown", function (e) {
    var o = e.target.closest("[data-cc]");
    if (o) { e.preventDefault(); pickCountry(o.getAttribute("data-cc"), o.getAttribute("data-iso"), true); return; }
    if (!e.target.closest(".cc")) document.querySelectorAll(".cc-list").forEach(function (l) { l.hidden = true; });
  });
  document.addEventListener("focusout", function (e) {
    var t = e.target; if (!t.id || !/-cc$/.test(t.id)) return;
    var id = t.id.slice(0, -3);
    setTimeout(function () { var cc = document.getElementById(id + "-cc"); if (!cc || document.activeElement === cc) return;
      ccList(id, null); var iso = cc.getAttribute("data-iso"); if (iso) pickCountry(id, iso, false); }, 150);
  });
  document.addEventListener("input", function (e) {
    var t = e.target;
    if (t.id && /-cc$/.test(t.id)) {
      var id = t.id.slice(0, -3), dig = t.value.replace(/\D/g, "");
      var exact = /[a-z]/i.test(t.value) ? null : (S.countries || []).filter(function (x) { return x[2] === dig; })[0];
      if (exact) return pickCountry(id, exact[0], true);
      t.setAttribute("data-iso", ""); document.getElementById(id + "-flag").textContent = "🌐";
      return ccList(id, t.value);
    }
    if (!t.id || !document.getElementById(t.id + "-cc")) return;
    /* a full number pasted or autofilled (+966…, 00966…) moves its code to the country box */
    var raw = t.value.trim(), dd = raw.replace(/\D/g, "");
    if (raw.charAt(0) === "+" || dd.indexOf("00") === 0) {
      if (dd.indexOf("00") === 0) dd = dd.slice(2);
      var hit = (S.countries || []).filter(function (x) { return dd.indexOf(x[2]) === 0; })[0];
      if (hit) { t.value = dd.slice(hit[2].length); pickCountry(t.id, hit[0], false); }
    }
    var v = t.value.replace(/\D/g, "").replace(/^0/, "").slice(0, +t.getAttribute("data-max") || 15); if (v !== t.value) t.value = v;
  });
  document.addEventListener("toggle", function (e) { if (e.target && e.target.id === "more") moreOpen = e.target.open; }, true);

  setInterval(function () {
    if (route().name !== "card" || !S.customer || !S.customer.gamesUntil) return;
    [].forEach.call(document.querySelectorAll("[data-window]"), function (el) { el.textContent = windowText(); });
    if (!minsLeft() && document.getElementById("game").hidden && document.querySelector("[data-game]")) keepText();
  }, 15000);

  /* the customer's card keeps itself up to date: when the truck stamps, it shows within a few seconds */
  function sig(c) { return c ? [c.burger, c.dessert, c.points, c.gamesUntil, c.scratchLeft, (c.visits || []).length, c.pending ? c.pending.id : 0, (c.achievements || []).length].join("|") : ""; }
  setInterval(function () {
    if (route().name !== "card" || !S.customer || S.staff || document.hidden || offline || scratching || screen !== "home") return;
    if (!document.getElementById("game").hidden) return;
    var a = document.activeElement; if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
    api("/api/pass/session").then(function (res) {
      if (!res.ok || !res.customer || !S.customer || sig(res.customer) === sig(S.customer)) return;
      var stamped = (res.customer.visits || []).length > (S.customer.visits || []).length;
      S = res; MENU = {}; (res.menu || []).forEach(function (m) { MENU[m.id] = m; }); store("pc_card", res);
      var qb = document.getElementById("qrbig");
      if (stamped && !qb.hidden) { qb.hidden = true; document.body.style.overflow = ""; }
      render();
      if (stamped) { toast("✅ Stamped! Your card is updated."); api("/api/pass/board").then(function (b) { if (b.ok) { lb = b; if (route().name === "card") keepText(); } }); }
    });
  }, 5000);

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !document.getElementById("qrbig").hidden) document.getElementById("qr-close").click();
  });
  document.addEventListener("submit", function (e) {
    e.preventDefault();
    var f = e.target, val = function (id) { var el = document.getElementById(id); return el ? el.value.trim() : ""; };
    var btn = f.querySelector('button[type="submit"]'); if (btn) btn.disabled = true;
    var done = function () { if (btn) btn.disabled = false; };
    if (f.id === "f-login" || f.id === "f-join") {
      var ph = readPhone(f.id === "f-login" ? "l-phone" : "j-phone", f.id === "f-login" ? "l-err" : "j-err");
      if (!ph) return done();
      if (f.id === "f-join" && !val("j-email")) { showErr("j-err", "Add your email."); return done(); }
      if (f.id === "f-join" && !val("j-bday")) { showErr("j-err", L("Add your birth date.")); return done(); }
    }
    if (f.id === "f-login") api("/api/pass/login", { phone: ph, pin: val("l-pin") }).then(function (r) { done(); if (!r.ok) return showErr("l-err", r.error); load(); });
    if (f.id === "f-join") api("/api/pass/join", { first: val("j-first"), last: val("j-last"), phone: ph, email: val("j-email"), birthday: val("j-bday"), pin: val("j-pin"),
      consent: document.getElementById("j-ok").checked, offers: document.getElementById("j-offers").checked }).then(function (r) { done(); if (!r.ok) return showErr("j-err", r.error); screen = "home"; load(); toast("Your Pass Card is ready"); });
    if (f.id === "f-review") {
      if (!rv.food || !rv.vibe) { done(); return showErr("r-err", "Pick a number for both food and atmosphere."); }
      api("/api/pass/review", { food: rv.food, vibe: rv.vibe, comment: val("r-text"), card: rv.card }).then(function (r) {
        done(); if (!r.ok) return showErr("r-err", r.error);
        screen = "home"; rv = { food: 0, vibe: 0, card: "burger" }; load();
        toast(r.bonus ? "Thanks! Bonus stamp added to your " + (r.bonus === "burger" ? "savory" : r.bonus) + " card" : "Thanks for the review");   /* both lines are in AR */
      });
    }
    if (f.id === "f-staff") api("/api/login", { user: val("st-user"), pin: val("st-pin") }).then(function (r) { done(); if (!r.ok) return showErr("st-err", r.error); load(); });
    if (f.id === "f-find") api("/api/pass/staff/find?q=" + encodeURIComponent(val("s-q"))).then(function (r) {
      done();
      if (!r.ok && r.net && val("s-q").replace(/\D/g, "").length >= 8) { offline = true; paintQueue(); found = { offline: true, phone: val("s-q"), first: "", last: "" }; welcomeP = null; basket = {}; shelf = null; return render(); }
      if (!r.ok) return showErr("s-err", r.error); found = r.customer; welcomeP = r.welcome; shelf = r.stock || null; basket = {}; render(); });
    if (f.id === "f-reset") api("/api/pass/staff/resetpin", { phone: found.phone, pin: val("rp-pin") }).then(function (r) { done(); if (!r.ok) return showErr("rp-err", r.error); toast("New PIN set. Tell the customer."); render(); });
    if (f.id === "f-cdel") api("/api/pass/staff/delete", { phone: found.phone, confirm: val("cdel-confirm") }).then(function (r) {
      done(); if (!r.ok) return showErr("cdel-err", r.error); found = null; welcomeP = null; basket = {}; render(); toast("Pass Card deleted with all its stamps, points and history."); });
  });

  load();
})();
</script>
</body>
</html>
