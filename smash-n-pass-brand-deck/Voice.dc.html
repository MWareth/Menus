<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;family=Archivo:wght@400;500;700;900&amp;display=swap">
  <style>
    body { margin: 0; background: #101010; }
    a { color: #FFD21C; }
    a:hover { color: #e5bc17; }
  </style>
</helmet>
<div style="box-sizing: border-box; width: 1280px; height: 720px; display: flex; flex-direction: column; gap: 14px; padding: 72px; background: #101010; color: #FFF9EE; font-family: Archivo, 'Trebuchet MS', sans-serif;">
  <div style="font-size: 14px; font-weight: 900; letter-spacing: 0.22em; color: #FFD21C;">THE VOICE</div>

  <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 16px;">
    <div style="font-family: 'Lilita One', 'Arial Black', sans-serif; font-size: 54px; line-height: 1; color: #FFD21C;">SAY LESS, ADD FRIES.</div>
    <div style="font-family: 'Lilita One', 'Arial Black', sans-serif; font-size: 54px; line-height: 1; color: #FFF9EE;">NO THOUGHTS, JUST BURGERS.</div>
    <div style="font-family: 'Lilita One', 'Arial Black', sans-serif; font-size: 54px; line-height: 1; color: #FFD21C;">SMASH IT, PASS IT.</div>
    <div style="font-family: 'Lilita One', 'Arial Black', sans-serif; font-size: 54px; line-height: 1; color: #FF6A00;">DEE'SERTS ARE NOT OPTIONAL.</div>
  </div>

  <div style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px;">
    <div style="background: #F02820; color: #FFF9EE; font-size: 13px; font-weight: 900; letter-spacing: 0.08em; padding: 8px 16px; border-radius: 999px;">FAN FAVE</div>
    <div style="background: #FF6A00; color: #101010; font-size: 13px; font-weight: 900; letter-spacing: 0.08em; padding: 8px 16px; border-radius: 999px;">SPICY</div>
    <div style="background: #2452FF; color: #FFF9EE; font-size: 13px; font-weight: 900; letter-spacing: 0.08em; padding: 8px 16px; border-radius: 999px;">LOUD</div>
    <div style="background: #F02820; color: #FFF9EE; font-size: 13px; font-weight: 900; letter-spacing: 0.08em; padding: 8px 16px; border-radius: 999px;">VIRAL</div>
    <div style="background: #FFD21C; color: #101010; font-size: 13px; font-weight: 900; letter-spacing: 0.08em; padding: 8px 16px; border-radius: 999px;">CERTIFIED BANGER</div>
    <div style="background: transparent; color: #FFF9EE; border: 2px solid #FFF9EE; font-size: 13px; font-weight: 900; letter-spacing: 0.08em; padding: 6px 14px; border-radius: 999px;">NO CRUMBS</div>
  </div>

  <div style="margin-top: auto; display: flex; justify-content: space-between; align-items: baseline; gap: 24px;">
    <div style="font-size: 15px; line-height: 1.5; color: #b3aea3; max-width: 560px;">The stickers do the shouting on the board &#8212; the voice itself stays deadpan.</div>
    <div style="font-size: 14px; font-weight: 900; letter-spacing: 0.14em; color: #FFD21C;">LOWKEY HUNGRY &#8226; HIGHKEY OBSESSED</div>
  </div>
</div>
</x-dc>
</body>
</html>
