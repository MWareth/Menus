<!doctype html>

<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;family=Archivo:wght@400;500;700;900&amp;display=swap">
  <style>
    body { margin: 0; background: #FFF9EE; }
    a { color: #F02820; }
    a:hover { color: #c81f1a; }
  </style>
</helmet>
<div style="box-sizing: border-box; width: 1280px; height: 720px; display: flex; flex-direction: column; gap: 16px; padding: 72px; background: #FFF9EE; color: #101010; font-family: Archivo, 'Trebuchet MS', sans-serif;">

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; margin-top: 24px;">
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="height: 120px; border-radius: 12px; background: #FFD21C;"></div>
      <div style="font-size: 16px; font-weight: 900; letter-spacing: 0.06em;">BUTTER</div>
      <div style="font-size: 14px; color: #6b6659;">#FFD21C</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="height: 120px; border-radius: 12px; background: #F02820;"></div>
      <div style="font-size: 16px; font-weight: 900; letter-spacing: 0.06em;">KETCHUP</div>
      <div style="font-size: 14px; color: #6b6659;">#F02820</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="height: 120px; border-radius: 12px; background: #101010;"></div>

      <div style="font-size: 14px; color: #6b6659;">#101010</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="height: 120px; border-radius: 12px; background: #FFF9EE; border: 1px solid #e2d9c6;"></div>
      <div style="font-size: 16px; font-weight: 900; letter-spacing: 0.06em;">PAPER</div>
      <div style="font-size: 14px; color: #6b6659;">#FFF9EE</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="height: 120px; border-radius: 12px; background: #2452FF;"></div>

    </div>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="height: 120px; border-radius: 12px; background: #FF6A00;"></div>
      <div style="font-size: 16px; font-weight: 900; letter-spacing: 0.06em;">HEAT</div>
      <div style="font-size: 14px; color: #6b6659;">#FF6A00</div>
    </div>
  </div>

  <div style="margin-top: auto; font-size: 13px; font-weight: 500; color: #8a857a; line-height: 1.5;">CMYK builds, proportions, night + warmth layers and logo-on-color rules live in the Color Bible.</div>
