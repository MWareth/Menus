            L, 60, 8.5, false, GREY);
    pg.text("Generated from Dee's Stock on " + stamp(new Date().toISOString()) + ".",
            L, 48, 8.5, false, GREY);

    return { filename: no + ".pdf", bytes: pdfDoc(pg.ops.join("\n")) };
  }

  /* ============ notices ============
     A published artifact cannot reach a mail server — nothing here can post
     to the outside world. So the app writes the notice and hands it over:
     open it in the phone's mail app with everyone already in the To field,
     or copy it and paste it into the group chat. */
  function notifyList() {
    return (S.notify || "").split(/[,;\s]+/).filter(function (x) { return x.indexOf("@") > 0; });
  }
  function appLink() {
    var u = "";
    try { u = String(location.href); } catch (e) {}
    return u.indexOf("http") === 0 ? u : "";
  }
  function dropOf(b) { return b.drop || b.id; }
  function deliveryNotice(dropKey) {
    var list = S.batches.filter(function (b) { return dropOf(b) === dropKey; });
    if (!list.length) return null;
    var b0 = list[0], units = 0, cost = 0, unknown = false, lines = [];
    list.forEach(function (b) {
      var it = item(b.itemId);
      units += b.qty;
      if (b.unitCost == null) unknown = true; else cost += b.qty * b.unitCost;
      lines.push("- " + (it ? it.name : "Deleted item") + ": " + count(b.qty, bPortion(b)) +
        ", expires " + niceDate(expiresOn(b)));
    });
    var link = appLink();
    return {
      subject: "Dee's order " + niceDate(b0.madeOn) + " \u2014 " + units + " portions",
      body: "Logged by " + uname(b0.by) + " at " + stamp(b0.at) + ".\n\n" +
        lines.join("\n") + "\n\n" +
        "Out in total: " + units + " portions\n" +
        "Cost to Dee's: " + (unknown ? "part of it not costed yet" : cur() + " " + money(cost)) + "\n\n" +
        "Sell the earliest date first, and log every sale in the app." +
        (link ? "\n\n" + link : "")
    };
  }
  function stockNotice() {
    var open = live().filter(function (b) { return remaining(b) > 0; });
    var onHand = open.reduce(function (a, b) { return a + remaining(b); }, 0);
    var pick = function (st) { return open.filter(function (b) { return status(b) === st; }); };
    var line = function (b) {
      var it = item(b.itemId);
      return "- " + (it ? it.name : "Deleted item") + ": " + count(remaining(b), bPortion(b)) +
        " left, expires " + niceDate(expiresOn(b));
    };
    var expired = pick("expired"), lastDay = pick("today"), soon = pick("soon");
    var today = todayStr(), soldToday = {}, soldTotal = 0;
    live().forEach(function (b) {
      (b.sales || []).forEach(function (s) {
        if (saleOn(s) !== today) return;
        var k = s.ch || channels()[0];
        soldToday[k] = (soldToday[k] || 0) + s.qty;
        soldTotal += s.qty;
      });
    });
    var body = "Stock on the truck, " + niceDate(today) + "\n\n" +
      onHand + " portion" + (onHand === 1 ? "" : "s") + " on hand.\n";
    if (soldTotal) body += "Sold today: " + soldTotal + " (" + Object.keys(soldToday).map(function (k) {
      return k + " " + soldToday[k];
    }).join(", ") + ")\n";
    if (expired.length) body += "\nEXPIRED \u2014 take these off the counter:\n" + expired.map(line).join("\n") + "\n";
    if (lastDay.length) body += "\nLAST DAY \u2014 sell these first:\n" + lastDay.map(line).join("\n") + "\n";
    if (soon.length) body += "\nGone tomorrow:\n" + soon.map(line).join("\n") + "\n";
    if (open.length) {
      var byName = {};
      open.forEach(function (b) {
        var it = item(b.itemId), k = it ? it.name : "Deleted item";
        if (!byName[k]) byName[k] = { n: 0, w: bPortion(b) };
        byName[k].n += remaining(b);
      });
      body += "\nEverything on hand:\n" + Object.keys(byName).map(function (k) {
        return "- " + k + ": " + count(byName[k].n, byName[k].w);
      }).join("\n") + "\n";
    } else {
      body += "\nNothing in stock.\n";
    }
    var link = appLink();
    if (link) body += "\n" + link;
    return {
      subject: "Dee's stock " + niceDate(todayStr()) + " \u2014 " + onHand + " on hand" +
        (expired.length ? ", " + expired.length + " expired" : lastDay.length ? ", " + lastDay.length + " on last day" : ""),
      body: body
    };
  }
  function notice(title, n) {
    if (!n) { toast("Nothing to send.", true); return; }
    var to = notifyList();
    var back = document.createElement("div");
    back.className = "modal";
    back.innerHTML = '<div class="modalbox wide" role="dialog" aria-modal="true" aria-label="' + esc(title) + '">' +
      "<h3>" + esc(title) + "</h3>" +
      '<div class="msg">' +
      (to.length ? "Addressed to " + esc(to.join(", ")) + "."
                 : "No addresses saved yet \u2014 an admin adds them in Setup. You can still copy this and send it however you like.") +
      "</div>" +
      '<textarea id="n-body" rows="13" spellcheck="false"></textarea>' +
      '<div class="modalacts">' +
      '<button class="btn ghost" type="button" data-m="close">CLOSE</button>' +
      '<button class="btn dark" type="button" data-m="copy">COPY</button>' +
      '<button class="btn pri" type="button" data-m="mail">OPEN EMAIL</button>' +
      "</div></div>";
    document.body.appendChild(back);
    var ta = back.querySelector("#n-body");
    ta.value = n.subject + "\n\n" + n.body;

    function shut() { document.removeEventListener("keydown", onKey, true); back.remove(); }
    function onKey(e) { if (e.key === "Escape") { e.preventDefault(); shut(); } }
    document.addEventListener("keydown", onKey, true);
    back.onclick = function (e) { if (e.target === back) shut(); };
    back.querySelector('[data-m="close"]').onclick = shut;
    back.querySelector('[data-m="copy"]').onclick = function () {
      var txt = ta.value;
      var ok = function () { toast("Copied \u2014 paste it into the chat."); };
      var no = function () { ta.focus(); ta.select(); toast("Select it and copy by hand.", true); };
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(txt).then(ok, function () {
            ta.focus(); ta.select();
            try { document.execCommand("copy") ? ok() : no(); } catch (e) { no(); }
          });
          return;
        }
      } catch (e) {}
      ta.focus(); ta.select();
      try { document.execCommand("copy") ? ok() : no(); } catch (e) { no(); }
    };
    back.querySelector('[data-m="mail"]').onclick = function () {
      var url = "mailto:" + to.join(",") +
        "?subject=" + encodeURIComponent(n.subject) +
        "&body=" + encodeURIComponent(n.body);
      var w = null;
      try { w = window.open(url, "_blank"); } catch (e) {}
      if (!w) {
        try {
          var a2 = document.createElement("a");
          a2.href = url; a2.target = "_blank"; a2.rel = "noopener";
          document.body.appendChild(a2); a2.click(); a2.remove();
        } catch (e) {}
      }
      toast(to.length ? "Opening your mail app\u2026" : "No addresses saved \u2014 copy it instead.", !to.length);
    };
    ta.focus();
  }

  function saveInvoice(dropKey) {
    if (!dl) { toast("Saving files is not available in this view.", true); return; }
    var inv;
    try { inv = invoice(dropKey); } catch (e) { inv = null; }
    if (!inv) { toast("Could not build that invoice.", true); return; }
    dl.save({ filename: inv.filename, data: inv.bytes }).then(function () {
      toast(inv.filename + " saved.");
    }, function (err) {
      var code = err && err.code;
      if (code === "declined") return;                     /* they said no; leave it */
      if (code === "rate_limited") { toast("One at a time — try again in a moment.", true); return; }
      if (code === "too_large") { toast("That invoice is too big to save.", true); return; }
      toast("Could not save the invoice here.", true);
    });
  }

  var toastT = null;
  function toast(msg, bad) {
    var el = document.querySelector(".toast");
    if (el) el.remove();
    el = document.createElement("div");
    el.className = "toast" + (bad ? " bad" : "");
    el.setAttribute("role", "status");
    el.textContent = msg;
    document.body.appendChild(el);
    clearTimeout(toastT);
    toastT = setTimeout(function () { el.remove(); }, 3200);
  }

  /* ============ session ============ */
  function loadSession() {
    try {
      var uid = sessionStorage.getItem("deeserts.uid");
      if (uid && user(uid)) me = user(uid);
      var f = sessionStorage.getItem("deeserts.flash");
      if (f) { sessionStorage.removeItem("deeserts.flash"); setTimeout(function () { toast(f); }, 60); }
      var t = sessionStorage.getItem("deeserts.tab");
      if (t) tab = t;
      else if (me) tab = homeTab(me);
    } catch (e) {}
  }
  /* the truck is here to sell, so it opens on Orders rather than on the count */
  function homeTab(u) {
    var pm = ROLES[u.role] || ROLES.truck;
    return pm.canSell && !pm.canDeliver ? "out" : "stock";
  }
  function setTab(t) {
    tab = t;
    try { sessionStorage.setItem("deeserts.tab", t); } catch (e) {}
    render();
    window.scrollTo(0, 0);
  }
  function signOut() {
    me = null;
    try { sessionStorage.removeItem("deeserts.uid"); } catch (e) {}
    render();
  }

  /* ============ render ============ */
  function render() {
    if (!me) { renderLock(); return; }
    var perm = ROLES[me.role] || ROLES.truck;
    var alerts = live().filter(function (b) {
      var s = status(b);
      return s === "expired" || s === "today";
    }).length;

    var html = "";
    html += '<header class="bar"><div class="wrap">' +
      '<div class="logo" role="img" aria-label="Dee\'s Treats"></div>' +
      '<div class="brandline">Stock</div>' +
      '<div class="who"><span class="avatar">' + esc(initials(me.name)) + "</span>" +
      "<span>" + esc(me.name) + " &middot; " + perm.label + "</span>" +
      '<button class="out" type="button" data-act="signout">EXIT</button>' +
      "</div></div></header>";

    var tabs = [["stock", "STOCK", alerts], ["out", "ORDERS", 0], ["money", "MONEY", 0]];
    if (perm.canDeliver) tabs.push(["recipes", "RECIPES", 0]);
    if (perm.canSetup) tabs.push(["setup", "SETUP", 0]);
    tabs.push(["account", "MY PIN", 0]);
    html += '<nav class="tabs"><div class="wrap">';
    tabs.forEach(function (t) {
      html += '<button class="tab" type="button" data-tab="' + t[0] + '" aria-current="' + (tab === t[0]) + '">' +
        t[1] + (t[2] ? '<span class="dot">' + t[2] + "</span>" : "") + "</button>";
    });
    html += "</div></nav>";

    html += '<main><div class="wrap">';
    if (readOnly) html += '<div class="banner info"><b>View only.</b> You can see everything here but not record anything — you need edit access to this board.</div>';
    if (S.defaultPins) html += '<div class="banner warn"><b>Everyone still has PIN 1234.</b> Change them in Setup before you share this link.</div>';
    var noCost = S.items.filter(function (i) { return i.active && !costed(i); }).length;
    if (noCost && perm.canDeliver) html += '<div class="banner warn"><b>' + noCost + " item" + (noCost > 1 ? "s have" : " has") +
      " no recipe costed yet.</b> Add ingredients and yield on the Recipes tab — cost, profit and the split stay incomplete until you do.</div>";

    var allowed = {};
    tabs.forEach(function (t) { allowed[t[0]] = true; });
    if (tab === "sell") tab = "out";          /* sales moved into orders */
    if (!allowed[tab]) tab = "stock";
    if (tab === "stock") html += viewStock(perm);
    else if (tab === "out") html += viewOut(perm);
    else if (tab === "money") html += viewMoney();
    else if (tab === "recipes") html += viewRecipes(perm);
    else if (tab === "setup") html += viewSetup(perm);
    else if (tab === "account") html += viewAccount();
    else html += viewStock(perm);
    html += "</div></main>";

    app.innerHTML = html;
    wire();
  }

  /* ---------- lock ---------- */
  function failState() {
    try { return JSON.parse(sessionStorage.getItem("deeserts.fail") || "{}"); } catch (e) { return {}; }
  }
  function lockedFor() {
    var f = failState();
    return f.until && Date.now() < f.until ? Math.ceil((f.until - Date.now()) / 1000) : 0;
  }
  function noteFail() {
    var f = failState();
    f.n = (f.n || 0) + 1;
    if (f.n >= 5) { f.until = Date.now() + 30000; f.n = 0; }
    try { sessionStorage.setItem("deeserts.fail", JSON.stringify(f)); } catch (e) {}
  }
  function clearFail() { try { sessionStorage.removeItem("deeserts.fail"); } catch (e) {} }

  function renderLock() {
    var wait = lockedFor();
    var h = '<div class="lock"><form class="lockbox" id="loginform" autocomplete="on">' +
      '<div class="logo" role="img" aria-label="Dee\'s Treats"></div>' +
      "<h1>Stock</h1>" +
      "<p>Sign in with your own login.</p>" +
      '<div class="field"><label for="who">USERNAME</label>' +
      '<input id="who" type="text" name="username" autocomplete="username" autocapitalize="none" ' +
      'autocorrect="off" spellcheck="false" placeholder="your username"' + (wait ? " disabled" : "") + "></div>" +
      '<div class="field"><label for="pin">PIN</label>' +
      '<input id="pin" type="password" name="password" inputmode="numeric" autocomplete="current-password" ' +
      'placeholder="••••"' + (wait ? " disabled" : "") + "></div>" +
      '<button class="btn pri" type="submit" style="width:100%"' + (wait ? " disabled" : "") + ">SIGN IN</button>";
    if (wait) h += '<div class="err">Too many attempts. Try again in ' + wait + "s.</div>";
    else if (lockErr) h += '<div class="err">' + esc(lockErr) + "</div>";
    h += '<p class="hint" style="margin-top:16px">Ask an admin if you do not have a login yet.</p>';
    h += "</form></div>";
    app.innerHTML = h;
    var form = document.getElementById("loginform");
    form.onsubmit = function (e) { e.preventDefault(); doLogin(); };
    if (wait) { setTimeout(function () { if (!me) renderLock(); }, 1000); return; }
    var w = document.getElementById("who");
    if (w) w.focus();
  }

  function doLogin() {
    if (lockedFor()) { renderLock(); return; }
    var whoEl = document.getElementById("who"), pinEl = document.getElementById("pin");
    if (!whoEl || !pinEl) return;
    var who = (whoEl.value || "").trim().toLowerCase();
    var pin = (pinEl.value || "").trim();
    if (!who || !pin) { lockErr = "Enter your username and PIN."; renderLock(); return; }
    var found = null;
    for (var i = 0; i < S.team.length; i++) {
      var t = S.team[i];
      if ((t.user || "").toLowerCase() === who || (t.name || "").trim().toLowerCase() === who) { found = t; break; }
    }
    /* hash regardless of whether the name exists, so a wrong username and a
       wrong PIN take the same time and give the same message */
    hash(pin).then(function (hp) {
      if (found && hp === found.pin) {
        me = found; lockErr = ""; clearFail();
        var seen = "";
        try {
          sessionStorage.setItem("deeserts.uid", found.id);
          seen = sessionStorage.getItem("deeserts.tab") || "";
        } catch (e) {}
        if (!seen) tab = homeTab(found);
        render();
      } else {
        noteFail();
        lockErr = "That username and PIN don't match.";
        renderLock();
      }
    });
  }

  /* ---------- stock ---------- */
  function viewStock(perm) {
    var t = todayStr();
    var open = live().filter(function (b) { return remaining(b) > 0; });
    var expired = open.filter(function (b) { return status(b) === "expired"; });
    var expiredLeft = 0;
    var lastDay = open.filter(function (b) { return status(b) === "today"; });
    var leftIn = function (l) { return l.reduce(function (a, b) { return a + remaining(b); }, 0); };
    expiredLeft = leftIn(expired);
    var tomorrow = open.filter(function (b) { return status(b) === "soon"; });
    var onHand = 0, onHandCost = 0, onHandRetail = 0, noCost = 0;
    open.forEach(function (b) {
      var left = remaining(b);
      onHand += left;
      onHandRetail += left * (b.unitPrice || 0);
      if (b.unitCost == null) noCost += left; else onHandCost += left * b.unitCost;
    });
    var todaySold = 0;
    live().forEach(function (b) {
      (b.sales || []).forEach(function (s) { if (saleOn(s) === t) todaySold += s.qty; });
    });

    var h = '<h2 class="sec">In stock</h2><p class="sub">' + niceDate(t) +
      " \u00b7 everything sent out and not yet sold.</p>";
    h += '<div class="stats">' +
      stat("ON HAND", onHand, count(onHand, "portion") + " unsold, across every item", "") +
      stat("WHAT IT COST", cur() + " " + money(onHandCost),
           noCost ? count(noCost, "portion") + " of it not costed yet" : "ingredients and packaging, already paid", "") +
      stat("WORTH AT MENU", cur() + " " + money(onHandRetail), "if every one of them sells", "good") +
      stat("SOLD TODAY", todaySold, "logged by the truck", "good") +
      stat("LAST DAY", leftIn(lastDay), "sell these first", lastDay.length ? "warn" : "") +
      stat("EXPIRED", expiredLeft, "to write off, past their date", expiredLeft ? "bad" : "") +
      "</div>";

    if (expired.length) {
      h += '<div class="banner bad"><b>' + count(expiredLeft, "piece") +
        " past the date.</b> Pull them off the counter and write them off \u2014 they still count as cost.</div>";
    }
    if (lastDay.length) {
      h += '<div class="banner warn"><b>' + count(leftIn(lastDay), "piece") +
        " on the last day.</b> Anything unsold tonight becomes waste tomorrow.</div>";
    }

    if (open.length || expired.length) {
      h += '<div style="margin:14px 0 4px"><button class="btn ghost sm" type="button" data-act="notifystock">' +
        "EMAIL THE STOCK NOTE</button></div>";
    }

    h += orderForm(perm);

    var order = { expired: 0, today: 1, soon: 2, fresh: 3 };
    var sorted = open.slice().sort(function (a, b) {
      var d = order[status(a)] - order[status(b)];
      return d !== 0 ? d : (expiresOn(a) < expiresOn(b) ? -1 : 1);
    });
    if (open.length) {
      var byItem = {};
      open.forEach(function (b) {
        var k = b.itemId;
        if (!byItem[k]) byItem[k] = { n: 0, soonest: null, batches: 0, cost: 0, retail: 0, unknown: false };
        var left2 = remaining(b);
        byItem[k].n += left2;
        byItem[k].batches += 1;
        byItem[k].retail += left2 * (b.unitPrice || 0);
        if (b.unitCost == null) byItem[k].unknown = true;
        else byItem[k].cost += left2 * b.unitCost;
        var e = expiresOn(b);
        if (!byItem[k].soonest || e < byItem[k].soonest) byItem[k].soonest = e;
      });
      h += '<div class="subhead">BY ITEM</div><div class="tw"><table><thead><tr><th>ITEM</th>' +
        '<th class="r">ON HAND</th><th class="r">COST</th>' +
        '<th class="r">AT MENU</th><th class="r">ENTRIES</th><th>FIRST TO EXPIRE</th>' +
        "</tr></thead><tbody>";
      Object.keys(byItem).forEach(function (k) {
        var g = byItem[k], it = item(k);
        var d = daysBetween(t, g.soonest);
        var when = d < 0 ? "expired" : d === 0 ? "today" : d === 1 ? "tomorrow" : niceDate(g.soonest);
        var cls = d <= 0 ? "p-today" : d === 1 ? "p-soon" : "p-fresh";
        h += "<tr><td>" + esc(it ? it.name : "Deleted item") + '</td><td class="r num">' +
          esc(count(g.n, it ? portionWordOf(it) : "portion")) +
          '</td><td class="r num">' + money(g.cost) + (g.unknown ? "+" : "") +
          '</td><td class="r num">' + money(g.retail) +
          '</td><td class="r num">' + g.batches + '</td><td><span class="pill ' + cls + '">' +
          esc(when.toUpperCase()) + "</span></td></tr>";
      });
      h += "</tbody></table></div>";
    }

    h += '<div class="subhead">EVERYTHING ON THE TRUCK</div>';
    h += sorted.length ? rows(sorted, perm, false) :
      '<div class="empty">Nothing in stock. Add some above to start.</div>';
    if (sorted.length && perm.canSell && !readOnly) {
      h += '<p class="hint" style="margin-top:12px">This is the count, not the till \u2014 ' +
        "log what sells on <b>Orders</b>, where you also say whether it went out of the window " +
        "or through a delivery app.</p>";
    }
    if (tomorrow.length) h += '<p class="hint" style="margin-top:12px">' +
      count(leftIn(tomorrow), "piece") + " expire tomorrow.</p>";
    return h;
  }
  function stat(k, v, n, cls) {
    return '<div class="stat ' + cls + '"><div class="k">' + k + '</div><div class="v num">' + v +
      '</div><div class="n">' + esc(n) + "</div></div>";
  }

  /* one partner's earnings card: the headline they make, the two moves that
     get them there, and where that money actually is right now */
  function ecard(cls, who, makes, sub, rows, totLabel, note) {
    var h = '<div class="ecard ' + cls + '"><div class="who3">' + who + "</div>" +
      '<div class="make num">' + cur() + " " + money(makes) + "</div>" +
      '<div class="lab">' + sub + "</div>";
    rows.forEach(function (r) {
      h += '<div class="erow"><span>' + r[0] + '</span><span class="num">' +
        (r[1] < 0 ? "\u2212 " : "+ ") + cur() + " " + money(Math.abs(r[1])) + "</span></div>";
    });
    h += '<div class="erow top"><span>' + totLabel + '</span><span class="num">' +
      cur() + " " + money(makes) + "</span></div>";
    if (note) h += '<div class="enote">' + note + "</div>";
    return h + "</div>";
  }

  /* ---------- rows ---------- */
  function rows(list, perm, withSell, withVoid) {
    var h = '<div class="rows">';
    var seenDrop = {};                 /* one notice and one invoice per order */
    list.forEach(function (b) {
      var it = item(b.itemId);
      var st = status(b);
      var s = sold(b), left = remaining(b);
      var exp = expiresOn(b);
      var d = daysBetween(todayStr(), exp);
      h += '<div class="row s-' + st + '"><div class="stripe"></div><div class="in">' +
        '<div class="rt"><span class="nm">' + esc(it ? it.name : "Deleted item") + "</span>" +
        '<span class="qty num">' + left + " / " + b.qty + "</span>" +
        '<span class="unit">' + esc(plural(bPortion(b))) + "</span>" +
        '<span class="pill p-' + st + '">' + STATUS_LABEL[st] + "</span>" +
        (b.voided ? "" : '<span class="pill p-lock">LOCKED</span>') + "</div>";
      h += '<div class="meta">' + "Made <b>" + niceDate(b.madeOn) + "</b> · expires <b>" + niceDate(exp) + "</b>" +
        (st === "expired" ? " (" + Math.abs(d) + "d ago)" : d >= 0 && !b.voided && left > 0 ? " (" + (d === 0 ? "today" : d + "d") + ")" : "") +
        " · logged <b>" + esc(stamp(b.at)) + "</b> by <b>" + esc(uname(b.by)) + "</b></div>";
      var fixes = (b.sales || []).filter(function (x) { return x.fix; }).length;
      h += '<div class="meta">Sold <b>' + s + "</b>" + (fixes ? " <span class=\"pill p-soon\">CORRECTED</span>" : "") +
        " \u00b7 cost of the lot " +
        (b.unitCost == null ? "<b>not set</b>" : "<b>" + cur() + " " + money(b.qty * b.unitCost) + "</b>") +
        " \u00b7 sells at <b>" + cur() + " " + money(b.unitPrice) + "</b> each</div>";
      if (b.unitCost != null && left > 0 && !b.voided) {
        h += '<div class="meta">Still on the truck: <b>' + esc(count(left, bPortion(b))) +
          "</b> \u00b7 cost <b>" + cur() + " " + money(left * b.unitCost) +
          "</b> \u00b7 worth <b>" + cur() + " " + money(left * (b.unitPrice || 0)) + "</b> at menu price</div>";
      }
      if (b.voided) h += '<div class="meta">Voided by <b>' + esc(uname(b.voidedBy)) + "</b>" +
        (b.voidReason ? ": " + esc(b.voidReason) : "") + "</div>";
      var pct = b.qty ? Math.round((s / b.qty) * 100) : 0;
      h += '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div>';
      var acts = "";
      if (withSell && !b.voided && left > 0 && perm.canSell && !readOnly) {
        acts += '<button class="btn pri sm" type="button" data-sell="' + b.id + '" data-n="1">SOLD 1</button>' +
          '<button class="btn dark sm" type="button" data-sell="' + b.id + '" data-n="2">SOLD 2</button>' +
          '<button class="btn ghost sm" type="button" data-sellmany="' + b.id + '">OTHER…</button>';
      }
      if (withSell && !b.voided && s > 0 && perm.canSell && !readOnly) {
        acts += '<button class="btn ghost sm" type="button" data-fix="' + b.id + '">FIX COUNT</button>';
      }
      if (withVoid && !b.voided && perm.canDeliver && !readOnly) {
        acts += '<button class="btn danger sm" type="button" data-void="' + b.id + '">VOID</button>';
      }
      if (withVoid && b.voided && perm.canSetup && !readOnly) {
        acts += '<button class="btn ghost sm" type="button" data-unvoid="' + b.id + '">RESTORE</button>';
      }
      if (withVoid && !b.voided && !seenDrop[dropOf(b)]) {
        seenDrop[dropOf(b)] = true;
        acts += '<button class="btn ghost sm" type="button" data-notify="' + dropOf(b) + '">EMAIL NOTICE</button>';
        if (dl) acts += '<button class="btn dark sm" type="button" data-pdf="' + dropOf(b) + '">PDF INVOICE</button>';
      }
      if (acts) h += '<div class="acts">' + acts + "</div>";
      h += "</div></div>";
    });
    return h + "</div>";
  }

  /* ---------- orders ---------- */

  /* The one form that puts stock on the truck. It lives on both Stock and
     Orders because Dee's side thinks of it as adding stock and the truck
     thinks of it as an order arriving; only one tab renders at a time, so
     the ids never collide. */
  /* Everything is counted in the pieces that get sold — slices, bags,
     ramekins. The batch each item is baked in is still what the recipe is
     costed from, but it stays out of the way of whoever is counting. */
  function linePortions(L) { return L.n; }

  function orderForm(perm) {
    if (!perm.canDeliver || readOnly) return "";
    return '<div class="subhead">ADD STOCK</div><div class="card">' +
      '<div class="field" style="max-width:220px"><label for="d-date">MADE ON</label>' +
      '<input id="d-date" type="date" value="' + todayStr() + '"></div>' +
      '<div id="d-rows"></div>' +
      '<button class="btn ghost sm" type="button" data-act="addrow2">+ ADD ANOTHER ITEM</button>' +
      '<div id="d-preview" style="margin-top:14px"></div>' +
      '<button class="btn pri" type="button" data-act="deliver" style="margin-top:14px">SAVE ORDER &amp; LOCK</button>' +
      "</div>";
  }

  function viewOut(perm) {
    var h = '<h2 class="sec">Orders</h2>' +
      '<p class="sub">Everything about an order in one place \u2014 what Dee sends out, what sells, ' +
      'and where each sale came from. An order locks the moment it is saved, and sales are never edited ' +
      'or deleted: if a count is wrong, <b>FIX COUNT</b> logs the difference as a correction and both ' +
      'stay on the record.</p>';

    /* --- what Dee hands to the truck --- */
    var form = orderForm(perm);
    if (!form && !readOnly) {
      form = '<div class="banner info">Only Dee\'s side sends stock out. Your part here is logging what sells, and where it sold.</div>';
    }

    /* --- selling: what is on the truck, and where each sale came from.
           Anything past its date still needs accounting for: some of it sold
           before it turned, and only the rest is waste. --- */
    var unsold = live().filter(function (b) { return remaining(b) > 0; });
    var stale = unsold.filter(function (b) { return status(b) === "expired"; });
    var open = unsold.filter(function (b) { return status(b) !== "expired"; });
    var sell = "";
    if (!perm.canSell && !readOnly) {
      sell += '<div class="banner info">Only the truck side records sales. Everything sold shows below.</div>';
    }
    sell += channelBar(perm);
    if (stale.length) {
      var staleLeft = stale.reduce(function (a, b) { return a + remaining(b); }, 0);
      sell += '<div class="subhead">PAST ITS DATE \u2014 STILL TO ACCOUNT FOR</div>';
      sell += '<div class="banner warn"><b>' + esc(count(staleLeft, "piece")) +
        " is sitting past its date with nothing logged against it.</b> If it sold before it turned, " +
        "set <b>SOLD ON</b> to the day it went and log it. Whatever is genuinely left over stays as waste.</div>";
      sell += rows(stale, perm, true);
    }
    sell += '<div class="subhead">ON THE TRUCK NOW</div>';
    sell += open.length ? rows(open, perm, true) :
      '<div class="empty">Nothing in date on the truck.</div>';

    /* --- the sales log --- */
    var log = [];
    live().forEach(function (b) {
      (b.sales || []).forEach(function (s) {
        log.push({ at: s.at, on: saleOn(s), qty: s.qty, by: s.by, fix: s.fix,
                   ch: s.ch || channels()[0], item: (item(b.itemId) || {}).name || "\u2014" });
      });
    });
    log.sort(function (a, b) { return a.at < b.at ? 1 : -1; });
    if (log.length) {
      sell += '<div class="subhead">SALES LOGGED (' + log.length + ")</div><div class=\"tw\"><table><thead><tr>" +
        "<th>SOLD ON</th><th>ITEM</th><th class=\"r\">QTY</th><th>SOLD FROM</th><th>BY</th></tr></thead><tbody>";
      log.sort(function (a, b) { return a.on < b.on ? 1 : a.on > b.on ? -1 : (a.at < b.at ? 1 : -1); });
      log.slice(0, 25).forEach(function (r) {
        sell += "<tr><td>" + esc(niceDate(r.on)) +
          "</td><td>" + esc(r.item) + (r.fix ? ' <span class="pill p-soon">FIX</span>' : "") +
          '</td><td class="r num">' + (r.qty > 0 ? "+" + r.qty : r.qty) + "</td><td>" +
          esc(r.ch) + "</td><td>" + esc(uname(r.by)) + "</td></tr>";
      });
      sell += "</tbody></table></div>";
      if (log.length > 25) sell += '<p class="hint" style="margin-top:10px">Showing the last 25.</p>';
    }

    /* --- the full history --- */
    var all = S.batches.slice().sort(function (a, b) { return a.at < b.at ? 1 : -1; });
    var hist = '<div class="subhead">EVERY ORDER OUT (' + all.length + ")</div>";
    hist += all.length ? rows(all, perm, false, true) : '<div class="empty">No orders logged yet.</div>';

    /* the truck is here to sell, so it gets the sell buttons first;
       Dee's side is here to send stock out, so the form comes first */
    return perm.canSell && !perm.canDeliver ? h + sell + form + hist
                                            : h + form + sell + hist;
  }

  /* ---------- recipes ---------- */
  function viewRecipes(perm) {
    if (!perm.canDeliver) {
      return '<h2 class="sec">Recipes &amp; cost</h2>' +
        '<div class="banner info">Recipes are kept to Dee\'s side. The truck sees the cost totals on Money and on each order, not the ingredients behind them.</div>';
    }
    var editable = perm.canDeliver && !readOnly;
    var h = '<h2 class="sec">Recipes &amp; cost</h2>' +
      '<p class="sub">Cost is worked out for one whole recipe, from supermarket pack prices, ' +
      'then divided by how many pieces it makes. ' +
      'Numbers update as you type; nothing is saved until you press save.</p>';
    if (!editable) h += '<div class="banner info">Only Dee\'s side and admins can change recipes.</div>';

    S.items.forEach(function (it) {
      var ro = editable ? "" : " disabled";
      h += '<div class="card" data-recipe="' + it.id + '">';
      h += '<div class="recipe-h"><h3>' + esc(it.name) + "</h3>" +
        '<span class="pill ' + (costed(it) ? "p-fresh" : "p-today") + '">' +
        (costed(it) ? "COSTED" : "NEEDS RECIPE") + "</span></div>";

      h += '<div class="ing"><span><span class="lbl">INGREDIENT</span></span>' +
        '<span><span class="lbl">RECIPE QTY</span></span><span><span class="lbl">UNIT</span></span>' +
        '<span><span class="lbl">PACK PRICE</span></span><span><span class="lbl">PACK QTY</span></span>' +
        '<span><span class="lbl">COST USED</span></span><span></span></div>';
      (it.recipe || []).forEach(function (r, ix) {
        h += '<div class="ing" data-row="' + ix + '">' +
          '<input data-f="n" value="' + esc(r.n) + '" placeholder="ingredient"' + ro + ">" +
          '<input data-f="q" type="number" min="0" step="any" value="' + r.q + '"' + ro + ">" +
          '<input data-f="u" value="' + esc(r.u || "") + '" placeholder="g"' + ro + ">" +
          '<input data-f="pp" type="number" min="0" step="0.01" value="' + r.pp + '"' + ro + ">" +
          '<input data-f="pq" type="number" min="0" step="any" value="' + r.pq + '"' + ro + ">" +
          '<span class="out">0</span>' +
          (editable ? '<button class="x" type="button" data-delrow="' + it.id + ":" + ix + '" aria-label="Remove">×</button>' : "<span></span>") +
          "</div>";
      });
      if (!(it.recipe || []).length) h += '<p class="hint" style="margin:4px 0 10px">No ingredients yet.</p>';
      if (editable) h += '<button class="btn ghost sm" type="button" data-addrow="' + it.id + '">+ ADD INGREDIENT</button>';

      h += '<div class="grid2" style="margin-top:16px">' +
        '<div class="field"><label>PIECES THIS RECIPE MAKES</label>' +
        '<input data-f="yieldPieces" type="number" min="0" step="any" value="' + (it.yieldPieces || 0) + '"' + ro + "></div>" +
        '<div class="field"><label>PIECES IN ONE ' + esc(portionWordOf(it).toUpperCase()) + '</label>' +
        '<input data-f="perPortion" type="number" min="1" step="any" value="' + (it.perPortion || 1) + '"' + ro + "></div>" +
        '<div class="field"><label>PACKAGING PER ' + esc(portionWordOf(it).toUpperCase()) + ' (' + cur() + ')</label>' +
        '<input data-f="packaging" type="number" min="0" step="0.01" value="' + (it.packaging || 0) + '"' + ro + "></div>" +
        '<div class="field"><label>SELLING PRICE (' + cur() + ')</label>' +
        '<input data-f="price" type="number" min="0" step="0.01" value="' + it.price + '"' + ro + "></div>" +
        '<div class="field"><label>CALL ONE PIECE A…</label>' +
        '<input data-f="portionWord" value="' + esc(portionWordOf(it)) + '" placeholder="slice, bag"' + ro + "></div>" +
        "</div>";

      h += '<div class="costcard"><div class="grid">' +
        cc("batch", "RECIPE COST") + cc("yield", "YIELD") + cc("ing", "INGREDIENT / UNIT") +
        cc("pack", "PACKAGING") + cc("price", "SELLS AT") + cc("profit", "GROSS PROFIT") + cc("margin", "MARGIN") +
        "</div></div>";
      h += '<p class="hint" style="margin-top:10px" data-spare></p>';
      h += '<p class="hint" style="margin-top:6px">Direct cost only — excludes labour, utilities, delivery and wastage.</p>';
      if (editable) h += '<div class="acts"><button class="btn dark sm" type="button" data-saverecipe="' + it.id + '">SAVE RECIPE</button></div>';
      h += "</div>";
    });
    return h;
  }
  function cc(k, label) {
    return '<div class="cc"><div class="k">' + label + '</div><div class="v num" data-cc="' + k + '">—</div></div>';
  }

  /* ---------- money ---------- */
  function viewMoney() {
    var t = totals(null);
    var pct = S.split.deesPct;
    var basis = S.split.basis === "revenue" ? t.revenue : t.profit;
    var deesCut = basis * (pct / 100), truckCut = basis * (1 - pct / 100);
    var S1 = settlement();
    var out = S1.outstanding;
    var owes = out >= 0 ? "SMASH &amp; PASS owes DEE'S TREATS" : "DEE'S TREATS owes SMASH &amp; PASS";
    var h = '<h2 class="sec">Money</h2><p class="sub">Profit counts only what has actually sold. ' +
      "Stock still sitting on the truck is Dee's money, not a loss \u2014 it settles the day it sells.</p>";

    h += '<div class="settle' + (Math.abs(out) < 0.005 ? " clear" : "") + '">' +
      '<div class="k">OUTSTANDING RIGHT NOW</div>' +
      '<div class="big num">' + cur() + " " + money(Math.abs(out)) + "</div>" +
      '<div class="who2">' + (Math.abs(out) < 0.005 ? "All square — nothing owed either way." : owes) + "</div>";
    h += '<div class="calc">' +
      '<div class="crow"><span>Ingredients in what has sold' + (S1.waste ? " (and what spoiled)" : "") +
        '</span><span class="num">' + cur() + " " + money(S1.cost) + "</span></div>" +
      '<div class="crow"><span>Truck\'s ' + Math.round((1 - S1.d) * 100) + '% share of that</span><span class="num">+ ' +
        cur() + " " + money(S1.costShare) + "</span></div>" +
      '<div class="crow"><span>Truck collected in sales</span><span class="num">' +
        cur() + " " + money(S1.revenue) + "</span></div>" +
      '<div class="crow"><span>Dee\'s ' + Math.round(S1.d * 100) + '% share of those takings</span><span class="num">+ ' +
        cur() + " " + money(S1.revShare) + "</span></div>" +
      (S1.paid ? '<div class="crow"><span>Already paid across</span><span class="num">- ' +
        cur() + " " + money(S1.paid) + "</span></div>" : "") +
      '<div class="crow tot"><span>' + (out >= 0 ? "Truck pays Dee\'s" : "Dee\'s pays truck") +
        '</span><span class="num">' + cur() + " " + money(Math.abs(out)) + "</span></div>" +
      "</div></div>";
    if (S1.stock > 0.005) {
      h += '<p class="hint" style="margin:-4px 0 16px">Not in that figure: ' +
        esc(count(S1.stockUnits, "piece")) + " still on the truck, " + cur() + " " + money(S1.stock) +
        " of Dee's money. That settles the day they sell, not before.</p>";
    }
    if (t.unknownCost) h += '<div class="banner warn"><b>' + t.unknownCost +
      " pieces have no cost recorded.</b> Profit and waste are flattered until those items have an ingredient cost.</div>";
    var E = earnings();
    h += '<div class="subhead">WHAT EACH PARTNER MAKES</div>';
    h += '<div class="earn">' +
      ecard("d", "DEE'S TREATS", E.deesNow,
        Math.round(S1.d * 100) + "% of the profit made so far",
        [[S1.waste ? "Ingredients used up, sold and spoiled" : "Ingredients in what has sold", -S1.cost],
         ["Comes back from the truck", S1.owed]],
        "Dee's makes",
        S1.paid ? cur() + " " + money(S1.paid) + " already received · " + cur() + " " +
          money(S1.outstanding) + " still due."
                : "None of it is in hand until the truck settles.") +
      ecard("t", "SMASH &amp; PASS", E.truckNow,
        Math.round((1 - S1.d) * 100) + "% of the profit made so far",
        [["Taken at the window", S1.revenue],
         ["Goes across to Dee's", -S1.owed]],
        "The truck makes",
        S1.paid ? cur() + " " + money(S1.paid) + " already handed over · " + cur() + " " +
          money(S1.outstanding) + " still to pay."
                : "Hold back what is owed — the rest is yours.") +
      "</div>";
    if (E.up.units > 0) {
      h += '<div class="proj"><b>' + esc(count(E.up.units, "piece")) +
        " still on the truck</b>, worth " + cur() + " " + money(E.up.revenue) +
        " at menu price against " + cur() + " " + money(E.up.cost) +
        " of ingredients \u2014 " + cur() + " " + money(E.up.profit) + " of profit still in them. " +
        "Sell the lot and the two sides make " + cur() + " " + money(E.deesProj) +
        " (Dee's) and " + cur() + " " + money(E.truckProj) + " (the truck).</div>";
    }
    h += '<div class="stats">' +
      stat("REVENUE", cur() + " " + money(t.revenue), count(t.unitsSold, "piece") + " sold", "good") +
      stat("COST OF SALES", cur() + " " + money(t.costSold), "ingredients in the " + t.unitsSold + " sold", "") +
      stat("PROFIT", cur() + " " + money(t.profit), "on what has actually sold", t.profit >= 0 ? "good" : "bad") +
      stat("WASTE", cur() + " " + money(t.waste), count(t.unitsWasted, "piece") + " expired unsold", t.waste > 0 ? "bad" : "") +
      stat("STOCK ON THE TRUCK", cur() + " " + money(t.costStock),
           count(t.unitsLeft, "piece") + " not sold yet", "") +
      "</div>";

    if (S.split.basis === "revenue") {
      h += '<div class="subhead">SETUP SAYS SPLIT THE REVENUE</div>';
      h += '<div class="split">' +
        '<div class="sp d"><div class="k">DEE\'S TREATS</div><div class="v num">' + cur() + " " + money(deesCut) + "</div></div>" +
        '<div class="sp t"><div class="k">SMASH &amp; PASS</div><div class="v num">' + cur() + " " + money(truckCut) + "</div></div>" +
        "</div>";
      h += '<div class="banner warn"><b>The split is set on revenue, not profit.</b> Those are the raw ' +
        pct + "/" + (100 - pct) + " cuts of the takings, before the ingredients are paid for. " +
        "The settlement and the earnings above are worked on profit, which is what a 50/50 partnership normally means. " +
        "Change the basis in Setup if revenue really is what you agreed.</div>";
    } else {
      h += '<p class="hint" style="margin-top:12px">Split percentage and basis are set in Setup. ' +
        "These are direct-cost figures \u2014 they take no account of labour, gas, the truck itself or anyone's time.</p>";
    }

    var BC = byChannel();
    if (BC.order.length) {
      h += '<div class="subhead">WHERE THE SALES CAME FROM</div><div class="tw"><table><thead><tr>' +
        '<th>CHANNEL</th><th class="r">UNITS</th><th class="r">REVENUE</th><th class="r">SHARE</th>' +
        "</tr></thead><tbody>";
      BC.order.forEach(function (k) {
        var g = BC.map[k];
        var share = t.revenue ? Math.round((g.revenue / t.revenue) * 1000) / 10 : 0;
        h += "<tr><td>" + esc(k) + '</td><td class="r num">' + g.units +
          '</td><td class="r num">' + cur() + " " + money(g.revenue) +
          '</td><td class="r num">' + share + "%</td></tr>";
      });
      h += "</tbody></table></div>";
      h += '<p class="hint" style="margin-top:10px">Revenue here is the menu price. ' +
        "If a delivery app keeps a commission, what actually lands is less \u2014 tell me the rate and " +
        "I will take it off before the split.</p>";
    }

    var byWho = {};
    live().forEach(function (b) {
      if (b.unitCost == null) return;
      if (!byWho[b.by]) byWho[b.by] = { units: 0, cost: 0, stock: 0, drops: {} };
      byWho[b.by].units += b.qty;
      byWho[b.by].cost += b.qty * b.unitCost;
      if (status(b) !== "expired") byWho[b.by].stock += remaining(b) * b.unitCost;
      byWho[b.by].drops[b.drop || b.id] = 1;
    });
    var whoKeys = Object.keys(byWho);
    if (whoKeys.length) {
      h += '<div class="subhead">WHO PAID FOR THE STOCK</div><div class="tw"><table><thead><tr>' +
        '<th>MADE BY</th><th class="r">ORDERS</th><th class="r">PIECES</th><th class="r">SPENT</th>' +
        '<th class="r">STILL AS STOCK</th></tr></thead><tbody>';
      whoKeys.forEach(function (k) {
        var g = byWho[k];
        h += "<tr><td>" + esc(uname(k)) + '</td><td class="r num">' + Object.keys(g.drops).length +
          '</td><td class="r num">' + g.units + '</td><td class="r num">' + money(g.cost) +
          '</td><td class="r num">' + money(g.stock) + "</td></tr>";
      });
      h += "</tbody></table></div>";
    }

    if (ROLES[me.role].canDeliver && !readOnly) {
      h += '<div style="margin-top:12px"><button class="btn dark sm" type="button" data-act="pay">RECORD A PAYMENT</button></div>';
    }
    if (payments().length) {
      h += '<div class="subhead">PAYMENTS</div><div class="tw"><table><thead><tr>' +
        '<th>WHEN</th><th class="r">AMOUNT</th><th>NOTE</th><th>LOGGED BY</th></tr></thead><tbody>';
      payments().slice().reverse().forEach(function (pm) {
        h += "<tr><td>" + esc(stamp(pm.at)) + '</td><td class="r num">' + cur() + " " + money(pm.amount) +
          "</td><td>" + esc(pm.note || "—") + "</td><td>" + esc(uname(pm.by)) + "</td></tr>";
      });
      h += "</tbody></table></div>";
    }

    /* ---- the investment: what Dee's has put in, and where it is now ----
       Money, not ingredients. The truck sees every figure here; the names
       of what went into the mixing bowl stay on the Recipes tab. */
    var INV = { spent: 0, sold: 0, stock: 0, waste: 0, pieces: 0, unknown: 0 };
    var invItems = [];
    S.items.forEach(function (it) {
      var g = { name: it.name, w: portionWordOf(it), pieces: 0, spent: 0,
                sold: 0, stock: 0, waste: 0, each: null, any: false };
      live().forEach(function (b) {
        if (b.itemId !== it.id) return;
        g.any = true;
        var s = sold(b), left = remaining(b), gone = status(b) === "expired";
        g.pieces += b.qty;
        if (b.unitCost == null) { INV.unknown += b.qty; return; }
        if (g.each == null) g.each = b.unitCost;
        g.spent += b.qty * b.unitCost;
        g.sold += s * b.unitCost;
        if (gone) g.waste += left * b.unitCost; else g.stock += left * b.unitCost;
      });
      if (!g.any) return;
      INV.spent += g.spent; INV.sold += g.sold;
      INV.stock += g.stock; INV.waste += g.waste; INV.pieces += g.pieces;
      invItems.push(g);
    });
    if (invItems.length) {
      h += '<div class="subhead">THE INVESTMENT — WHAT DEE\'S HAS PUT IN</div>';
      h += '<div class="stats">' +
        stat("PUT IN", cur() + " " + money(INV.spent),
             count(INV.pieces, "piece") + " made and sent", "") +
        stat("SOLD THROUGH", cur() + " " + money(INV.sold),
             "the part that has earned", "good") +
        stat("STILL IN STOCK", cur() + " " + money(INV.stock),
             "on the truck, not sold yet", "") +
        stat("LOST TO WASTE", cur() + " " + money(INV.waste),
             "expired before it sold", INV.waste > 0.005 ? "bad" : "") +
        "</div>";
      h += '<div class="tw"><table><thead><tr><th>ITEM</th>' +
        '<th class="r">PIECES</th><th class="r">COST EACH</th><th class="r">PUT IN</th>' +
        '<th class="r">SOLD</th><th class="r">IN STOCK</th><th class="r">WASTE</th>' +
        "</tr></thead><tbody>";
      invItems.forEach(function (g) {
        h += "<tr><td>" + esc(g.name) + '</td><td class="r num">' + esc(count(g.pieces, g.w)) +
          '</td><td class="r num">' + (g.each == null ? "—" : money(g.each)) +
          '</td><td class="r num">' + money(g.spent) +
          '</td><td class="r num">' + money(g.sold) +
          '</td><td class="r num">' + money(g.stock) +
          '</td><td class="r num">' + money(g.waste) + "</td></tr>";
      });
      h += '<tr><td><b>Total</b></td><td class="r num"><b>' + INV.pieces +
        '</b></td><td class="r num">—</td><td class="r num"><b>' + money(INV.spent) +
        '</b></td><td class="r num"><b>' + money(INV.sold) +
        '</b></td><td class="r num"><b>' + money(INV.stock) +
        '</b></td><td class="r num"><b>' + money(INV.waste) + "</b></td></tr>";
      h += "</tbody></table></div>";
      h += '<p class="hint" style="margin-top:10px">Dee\'s pays this up front. ' +
        "SOLD is the part that has earned its keep, and the truck settles half of it. " +
        "IN STOCK is still Dee’s money sitting on the truck — it settles the day it sells. " +
        "WASTE is gone, and the two sides carry half of it each.</p>";
      if (INV.unknown) {
        h += '<p class="hint" style="margin-top:6px">' + INV.unknown +
          " pieces went out before their item had a recipe costed, so they are missing from these totals.</p>";
      }
      /* what one piece is built from — money only, no ingredient names */
      h += '<div class="subhead">WHAT ONE PIECE COSTS TO MAKE</div>';
      h += '<div class="tw"><table><thead><tr><th>ITEM</th>' +
        '<th class="r">MAKES</th><th class="r">INGREDIENTS</th><th class="r">PACKAGING</th>' +
        '<th class="r">COST EACH</th><th class="r">SELLS AT</th><th class="r">MARGIN</th>' +
        "</tr></thead><tbody>";
      S.items.forEach(function (it) {
        if (!costed(it)) return;
        var per = portionsPer(it), ing = batchCost(it) / per, pk = +it.packaging || 0;
        var u = ing + pk, m = it.price ? ((it.price - u) / it.price) * 100 : 0;
        h += "<tr><td>" + esc(it.name) + '</td><td class="r num">' +
          esc(count(per, portionWordOf(it))) + " a bake" +
          '</td><td class="r num">' + money(ing) +
          '</td><td class="r num">' + money(pk) +
          '</td><td class="r num"><b>' + money(u) +
          '</b></td><td class="r num">' + money(it.price) +
          '</td><td class="r num">' + (Math.round(m * 10) / 10) + "%</td></tr>";
      });
      h += "</tbody></table></div>";
      h += '<p class="hint" style="margin-top:10px">Today’s recipe prices. ' +
        "Stock already sent out keeps the cost it was locked in at, which is what every figure above uses." +
        (ROLES[me.role].canDeliver ? " The ingredients behind these numbers are on the Recipes tab." : "") +
        "</p>";
    }

    /* the split for one day's stock: what was made that day, what has sold
       off it, and where the two sides stand on it */
    var byDay = {};
    live().forEach(function (b) {
      var k = b.madeOn;
      if (!byDay[k]) byDay[k] = { made: 0, units: 0, sold: 0, left: 0, wasted: 0,
                                  revenue: 0, used: 0, unknown: false };
      var g = byDay[k], s = sold(b), left = remaining(b), gone = status(b) === "expired";
      g.units += b.qty;
      g.sold += s;
      g.revenue += s * (b.unitPrice || 0);
      if (gone) g.wasted += left; else g.left += left;
      if (b.unitCost == null) { g.unknown = true; return; }
      g.made += b.qty * b.unitCost;
      g.used += s * b.unitCost + (gone ? left * b.unitCost : 0);
    });
    var days = Object.keys(byDay).sort().reverse();
    if (days.length) {
      h += '<div class="subhead">DAY BY DAY — THE SPLIT ON EACH DAY\'S STOCK</div>';
      h += '<div class="tw"><table><thead><tr><th>MADE ON</th>' +
        '<th class="r">SOLD</th><th class="r">LEFT</th><th class="r">TAKEN</th>' +
        '<th class="r">COST USED</th><th class="r">PROFIT</th>' +
        '<th class="r">DEE\'S ' + Math.round(S1.d * 100) + '%</th>' +
        '<th class="r">TRUCK ' + Math.round((1 - S1.d) * 100) + '%</th>' +
        "</tr></thead><tbody>";
      days.forEach(function (k) {
        var g = byDay[k], pr = g.revenue - g.used;
        h += "<tr><td>" + esc(niceDate(k)) + '</td><td class="r num">' + g.sold + " / " + g.units +
          '</td><td class="r num">' + g.left + (g.wasted ? " (" + g.wasted + " lost)" : "") +
          '</td><td class="r num">' + money(g.revenue) +
          '</td><td class="r num">' + money(g.used) + (g.unknown ? "+" : "") +
          '</td><td class="r num">' + money(pr) +
          '</td><td class="r num">' + money(pr * S1.d) +
          '</td><td class="r num">' + money(pr * (1 - S1.d)) + "</td></tr>";
      });
      h += "</tbody></table></div>";
      h += '<p class="hint" style="margin-top:10px">Each row is the stock made that day. ' +
        "LEFT is still unsold, so nothing has been counted on it either way — " +
        "its share lands on the day it sells.</p>";
    }
    h += '<div class="subhead">BY ITEM</div><div class="tw"><table><thead><tr><th>ITEM</th>' +
      '<th class="r">OUT</th><th class="r">SOLD</th><th class="r">WASTED</th><th class="r">REVENUE</th><th class="r">COST USED</th><th class="r">PROFIT</th>' +
      "</tr></thead><tbody>";
    S.items.forEach(function (it) {
      var o = 0, s = 0, w = 0, rev = 0, cost = 0, any = false;
      live().forEach(function (b) {
        if (b.itemId !== it.id) return;
        any = true;
        var sd = sold(b), gone = status(b) === "expired";
        o += b.qty; s += sd; rev += sd * (b.unitPrice || 0);
        if (b.unitCost != null) {
          cost += sd * b.unitCost;
          if (gone) cost += remaining(b) * b.unitCost;
        }
        if (gone) w += remaining(b);
      });
      if (!any) return;
      h += "<tr><td>" + esc(it.name) + '</td><td class="r num">' + o + '</td><td class="r num">' + s +
        '</td><td class="r num">' + w + '</td><td class="r num">' + money(rev) +
        '</td><td class="r num">' + money(cost) + '</td><td class="r num">' + money(rev - cost) + "</td></tr>";
    });
    h += "</tbody></table></div>";
    return h;
  }

  function changePin() {
    var oldEl = document.getElementById("pw-old"),
        newEl = document.getElementById("pw-new"),
        twoEl = document.getElementById("pw-two");
    var oldPin = (oldEl.value || "").trim(),
        newPin = (newEl.value || "").trim(),
        twoPin = (twoEl.value || "").trim();
    if (!oldPin || !newPin) { toast("Fill in your current PIN and the new one.", true); return; }
    if (!/^\d{4,8}$/.test(newPin)) { toast("New PIN must be 4–8 digits.", true); return; }
    if (newPin !== twoPin) { toast("The two new PINs do not match.", true); return; }
    if (newPin === oldPin) { toast("That is already your PIN.", true); return; }
    var uid = me.id;
    hash(oldPin).then(function (ho) {
      if (ho !== me.pin) { toast("Your current PIN is not right.", true); return; }
      return hash(newPin).then(function (hn) {
        save(function (n) {
          var t = n.team.filter(function (u) { return u.id === uid; })[0];
          t.pin = hn;
          var DEF = "d4165ae679b414636d9b7ff6fb6e1ee8b4824dfee69e3b2fc47fdfc259d38117";
          n.defaultPins = n.team.some(function (u) { return u.pin === DEF; });
        }, "PIN changed.");
      });
    });
  }

  /* ============ actions ============ */
  function wire() {
    app.querySelectorAll("[data-tab]").forEach(function (b) {
      b.onclick = function () { setTab(b.getAttribute("data-tab")); };
    });
    app.querySelectorAll("[data-ch]").forEach(function (b) {
      b.onclick = function () { setChannel(b.getAttribute("data-ch")); };
    });
    app.querySelectorAll("[data-sdate]").forEach(function (b) {
      b.onclick = function () { setSaleDate(""); };
    });
    var sdEl = document.getElementById("s-date");
    if (sdEl) sdEl.onchange = function () { setSaleDate(sdEl.value); };
    app.querySelectorAll("[data-sell]").forEach(function (b) {
      b.onclick = function () { logSale(b.getAttribute("data-sell"), +b.getAttribute("data-n")); };
    });
    app.querySelectorAll("[data-sellmany]").forEach(function (b) {
      b.onclick = function () {
        var bid = b.getAttribute("data-sellmany");
        var bt = S.batches.filter(function (x) { return x.id === bid; })[0];
        ask({ title: "How many sold?", ok: "LOG SALE",
              input: { label: plural(bPortion(bt)).toUpperCase() + " (UP TO " + remaining(bt) + ")",
                       value: 1, min: 1, max: remaining(bt) } })
          .then(function (n) { if (n != null) logSale(bid, n); });
      };
    });
    app.querySelectorAll("[data-fix]").forEach(function (b) {
      b.onclick = function () {
        var bt = S.batches.filter(function (x) { return x.id === b.getAttribute("data-fix"); })[0];
        if (!bt) return;
        var now = sold(bt);
        ask({ title: "Fix the sold count",
              body: "This lot is recorded as " + now + " sold out of " + bt.qty +
                ". Enter what has actually sold — the difference is logged as a correction, " +
                "the original entries stay on the record.",
              ok: "SAVE CORRECTION",
              input: { label: "ACTUALLY SOLD", value: now, min: 0, max: bt.qty } })
          .then(function (target) {
            if (target == null || target === now) return;
            save(function (nx) {
              var t = nx.batches.filter(function (x) { return x.id === bt.id; })[0];
              t.sales = t.sales || [];
              t.sales.push({ qty: target - now, by: me.id, at: new Date().toISOString(),
                             on: saleDate(), fix: true, ch: curChannel() });
            }, "Count corrected to " + target + ".");
          });
      };
    });
    app.querySelectorAll("[data-void]").forEach(function (b) {
      b.onclick = function () {
        var bt = S.batches.filter(function (x) { return x.id === b.getAttribute("data-void"); })[0];
        if (!bt) return;
        var s0 = sold(bt);
        if (s0 > 0 && !ROLES[me.role].canSetup) {
          toast("This lot already has " + s0 + " sold. Fix the count to 0 first, or ask an admin.", true);
          return;
        }
        ask({ title: "Void this order?",
              body: (s0 > 0 ? "Warning: " + s0 + " already recorded as sold — those go too.\n\n" : "") +
                "It stays on the record marked voided, and drops out of stock, cost and the split.",
              ok: "VOID IT", danger: true,
              input: { type: "text", label: "REASON", placeholder: "logged twice, wrong item…" } })
          .then(function (reason) {
            if (!reason) return;
            save(function (nx) {
              var t = nx.batches.filter(function (x) { return x.id === bt.id; })[0];
              t.voided = true; t.voidedBy = me.id; t.voidReason = reason;
              t.voidedAt = new Date().toISOString();
            }, "Order voided.");
          });
      };
    });
    app.querySelectorAll("[data-pdf]").forEach(function (b) {
      b.onclick = function () { saveInvoice(b.getAttribute("data-pdf")); };
    });
    app.querySelectorAll("[data-notify]").forEach(function (b) {
      b.onclick = function () {
        notice("Order notice", deliveryNotice(b.getAttribute("data-notify")));
      };
    });
    app.querySelectorAll("[data-unvoid]").forEach(function (b) {
      b.onclick = function () {
        var bid = b.getAttribute("data-unvoid");
        ask({ title: "Restore this order?", body: "It counts towards stock and the split again.",
              ok: "RESTORE" }).then(function (go) {
          if (!go) return;
          save(function (nx) {
            var t = nx.batches.filter(function (x) { return x.id === bid; })[0];
            delete t.voided; delete t.voidedBy; delete t.voidReason; delete t.voidedAt;
          }, "Order restored.");
        });
      };
    });
    app.querySelectorAll("[data-saveitem]").forEach(function (b) {
      b.onclick = function () { saveItem(b.getAttribute("data-saveitem")); };
    });
    app.querySelectorAll("[data-delitem]").forEach(function (b) {
      b.onclick = function () {
        var iid = b.getAttribute("data-delitem");
        var used = S.batches.some(function (x) { return x.itemId === iid; });
        if (used) { toast("This item has orders against it — set it to 'not on the menu' instead.", true); return; }
        ask({ title: "Remove this item?", body: "It disappears from the menu and from future orders.",
              ok: "REMOVE", danger: true }).then(function (go) {
          if (!go) return;
          save(function (n) { n.items = n.items.filter(function (i) { return i.id !== iid; }); }, "Item removed.");
        });
      };
    });
    app.querySelectorAll("[data-saveuser]").forEach(function (b) {
      b.onclick = function () { saveUser(b.getAttribute("data-saveuser")); };
    });
    app.querySelectorAll("[data-deluser]").forEach(function (b) {
      b.onclick = function () {
        var uid = b.getAttribute("data-deluser");
        if (uid === me.id) { toast("You cannot remove yourself.", true); return; }
        ask({ title: "Remove this person?", body: "They lose their login. Everything they already logged stays on the board.",
              ok: "REMOVE", danger: true }).then(function (go) {
          if (!go) return;
          save(function (n) { n.team = n.team.filter(function (u) { return u.id !== uid; }); }, "Person removed.");
        });
      };
    });
    var acts = {
      signout: signOut,
      login: doLogin,
      changepin: changePin,
      pay: function () {
        var due = Math.max(0, Math.round(settlement().outstanding * 100) / 100);
        ask({ title: "Record a payment",
              body: "Money handed from the truck to Dee's. It comes off the outstanding balance.\n\n" +
                    "Outstanding right now: " + cur() + " " + money(due),
              ok: "RECORD IT",
              input: { label: "AMOUNT (" + cur() + ")", value: Math.round(due) || 0, min: 1 } })
          .then(function (amt) {
            if (amt == null) return;
            save(function (n) {
              n.payments = n.payments || [];
              n.payments.push({ id: id("p"), amount: amt, by: me.id, at: new Date().toISOString() });
            }, cur() + " " + money(amt) + " recorded.");
          });
      },
      addrow2: addDeliveryRow,
      deliver: addDelivery,
      notifystock: function () { notice("Stock note", stockNotice()); },
      savechannels: function () {
        var list = document.getElementById("ch-list").value.split(",").map(function (x) {
          return x.trim();
        }).filter(Boolean);
        if (!list.length) { toast("Keep at least one channel.", true); return; }
        if (list.length > 6) { toast("Six channels is plenty \u2014 the truck has to tap one every sale.", true); return; }
        save(function (n) { n.channels = list; }, list.join(", ") + " saved.");
      },
      savenotify: function () {
        var raw = document.getElementById("nt-mails").value;
        var list = raw.split(/[,;\s]+/).filter(Boolean);
        var bad = list.filter(function (x) { return !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x); });
        if (bad.length) { toast("Not an email address: " + bad[0], true); return; }
        save(function (n) { n.notify = list.join(", "); },
          list.length ? list.length + " address" + (list.length > 1 ? "es" : "") + " saved." : "Address list cleared.");
      },
      additem: function () {
        save(function (n) {
          n.items.push({ id: id("i"), name: "New item", note: "", price: 0, shelf: n.defaultShelf || 2,
            active: true, batchWord: "batch", portionWord: "portion",
            yieldPieces: 0, perPortion: 1, packaging: 0.25, recipe: [] });
        }, "Item added.");
      },
      adduser: function () {
        save(function (n) {
          var nid = id("u");
          n.team.push({ id: nid, name: "New person", user: nid, role: "truck",
            pin: "d4165ae679b414636d9b7ff6fb6e1ee8b4824dfee69e3b2fc47fdfc259d38117" });
          n.defaultPins = true;
        }, "Person added with PIN 1234 — change it.");
      },
      savesplit: function () {
        var pct = parseFloat(document.getElementById("sp-pct").value);
        var basis = document.getElementById("sp-basis").value;
        var c = document.getElementById("sp-cur").value.trim().slice(0, 6) || "AED";
        if (!(pct >= 0 && pct <= 100)) { toast("Share must be between 0 and 100.", true); return; }
        save(function (n) { n.split = { deesPct: pct, basis: basis }; n.currency = c; }, "Split saved.");
      },
      archive: function () {
        ask({ title: "Clear old stock?",
              body: "Anything that expired over 30 days ago is deleted permanently, and its totals go with it.",
              ok: "CLEAR", danger: true }).then(function (go) {
          if (!go) return;
          save(function (n) {
            n.batches = n.batches.filter(function (b) { return daysBetween(todayStr(), addDays(b.madeOn, b.shelf)) >= -30; });
          }, "Old stock cleared.");
        });
      }
    };
    app.querySelectorAll("[data-act]").forEach(function (b) {
      var fn = acts[b.getAttribute("data-act")];
      if (fn) b.onclick = fn;
      if (busy) b.disabled = true;
    });
    if (busy) app.querySelectorAll(".btn").forEach(function (b) { b.disabled = true; });

    var rowsBox = document.getElementById("d-rows");
    if (rowsBox) {
      if (!rowsBox.children.length) addDeliveryRow();
      refreshPreview();
    }

    app.querySelectorAll("[data-saverecipe]").forEach(function (b) {
      b.onclick = function () { saveRecipe(b.getAttribute("data-saverecipe")); };
    });
    app.querySelectorAll("[data-addrow]").forEach(function (b) {
      b.onclick = function () {
        var iid = b.getAttribute("data-addrow");
        save(function (n) {
          var t = n.items.filter(function (i) { return i.id === iid; })[0];
          t.recipe = t.recipe || [];
          t.recipe.push({ n: "", q: 0, u: "g", pp: 0, pq: 100 });
        }, "Ingredient row added.");
      };
    });
    app.querySelectorAll("[data-delrow]").forEach(function (b) {
      b.onclick = function () {
        var p = b.getAttribute("data-delrow").split(":");
        save(function (n) {
          var t = n.items.filter(function (i) { return i.id === p[0]; })[0];
          t.recipe.splice(+p[1], 1);
        }, "Ingredient removed.");
      };
    });
    app.querySelectorAll("[data-recipe]").forEach(function (card) {
      var recalc = function () { liveCost(card); };
      card.querySelectorAll("input").forEach(function (el) { el.oninput = recalc; });
      recalc();
    });
  }

  /* live recalculation inside a recipe card, no save */
  function liveCost(card) {
    var g = function (el) { var v = parseFloat(el.value); return isNaN(v) ? 0 : v; };
    var total = 0;
    card.querySelectorAll("[data-row]").forEach(function (row) {
      var q = g(row.querySelector('[data-f="q"]')),
          pp = g(row.querySelector('[data-f="pp"]')),
          pq = g(row.querySelector('[data-f="pq"]'));
      var c = pq > 0 ? (q / pq) * pp : 0;
      total += c;
      row.querySelector(".out").textContent = money(c);
    });
    var pieces = g(card.querySelector('[data-f="yieldPieces"]')),
        per = g(card.querySelector('[data-f="perPortion"]')),
        pack = g(card.querySelector('[data-f="packaging"]')),
        price = g(card.querySelector('[data-f="price"]'));
    var portions = per > 0 ? pieces / per : 0;
    var ing = portions > 0 ? total / portions : null;
    var unit = ing == null ? null : ing + pack;
    var profit = unit == null ? null : price - unit;
    var margin = profit == null || !price ? null : (profit / price) * 100;
    var set = function (k, v, cls) {
      var el = card.querySelector('[data-cc="' + k + '"]');
      if (!el) return;
      el.textContent = v;
      var box = el.closest(".cc");
      box.classList.remove("good", "bad", "hi");
      if (cls) box.classList.add(cls);
    };
    set("batch", money(total), "hi");
    var whole = per > 0 ? Math.floor(pieces / per) : 0;
    var spare = per > 0 ? pieces - whole * per : 0;
    portions = whole;
    ing = portions > 0 ? total / portions : null;
    unit = ing == null ? null : ing + pack;
    profit = unit == null ? null : price - unit;
    margin = profit == null || !price ? null : (profit / price) * 100;
    var pw = (card.querySelector('[data-f="portionWord"]').value || "").trim() || "portion";
    set("yield", portions ? (pieces + " pcs / " + count(portions, pw)) : "set yield", portions ? "" : "bad");
    var note = card.querySelector("[data-spare]");
    if (note) note.innerHTML = portions
      ? (spare
          ? "<b>" + count(spare, "piece") + " left over</b> \u2014 not enough for another " + pw +
            ", so their cost sits on the " + count(portions, pw) + " that are sellable."
          : pieces + " pcs \u00f7 " + per + " divides evenly — nothing wasted.")
      : "";
    set("ing", ing == null ? "—" : money(ing));
    set("pack", money(pack));
    set("price", money(price));
    set("profit", profit == null ? "—" : money(profit), profit == null ? "" : profit >= 0 ? "good" : "bad");
    set("margin", margin == null ? "—" : (Math.round(margin * 10) / 10) + "%", margin == null ? "" : margin >= 0 ? "good" : "bad");
  }

  function logSale(bid, n) {
    var b = S.batches.filter(function (x) { return x.id === bid; })[0];
    if (!b) return;
    if (n > remaining(b)) { toast("Only " + count(remaining(b), bPortion(b)) + " left in that lot.", true); return; }
    var ch = curChannel(), on = saleDate();
    save(function (nx) {
      var t = nx.batches.filter(function (x) { return x.id === bid; })[0];
      t.sales = t.sales || [];
      t.sales.push({ qty: n, by: me.id, at: new Date().toISOString(), on: on, ch: ch });
    }, n + " sold at " + ch.toLowerCase() + " on " + niceDate(on) + " — logged.");
  }

  function itemOptions(sel) {
    return S.items.filter(function (i) { return i.active; }).map(function (i) {
      return '<option value="' + i.id + '"' + (i.id === sel ? " selected" : "") + ">" +
        esc(i.name + (i.note ? " (" + i.note + ")" : "")) + "</option>";
    }).join("");
  }

  function addDeliveryRow() {
    var box = document.getElementById("d-rows");
    if (!box) return;
    var row = document.createElement("div");
    row.className = "drow";
    row.innerHTML = '<select data-d="item">' + itemOptions(null) + "</select>" +
      '<input data-d="n" type="number" min="1" step="1" value="1" aria-label="How many pieces">' +
      '<span class="w" data-d="word"></span>' +
      '<button class="x" type="button" data-d="rm" aria-label="Remove this line">&times;</button>';
    box.appendChild(row);
    row.querySelector('[data-d="rm"]').onclick = function () {
      row.remove();
      if (!box.children.length) addDeliveryRow();
      refreshPreview();
    };
    row.querySelectorAll("select,input").forEach(function (el) {
      el.oninput = refreshPreview; el.onchange = refreshPreview;
    });
    refreshPreview();
  }

  /* read the form into a list of lines */
  function readDeliveryRows() {
    var out = [];
    var box = document.getElementById("d-rows");
    if (!box) return out;
    Array.prototype.forEach.call(box.children, function (row) {
      var it = item(row.querySelector('[data-d="item"]').value);
      var n = parseInt(row.querySelector('[data-d="n"]').value, 10);
      out.push({ it: it, n: n > 0 ? n : 0, row: row });
    });
    return out;
  }

  function refreshPreview() {
    var box = document.getElementById("d-rows"), pv = document.getElementById("d-preview");
    if (!box || !pv) return;
    var lines = readDeliveryRows();
    var madeOn = (document.getElementById("d-date") || {}).value || todayStr();
    var only = box.children.length < 2;
    var html = "", total = 0, units = 0, anyUncosted = false, words = {};
    lines.forEach(function (L) {
      var w = L.row.querySelector('[data-d="word"]');
      if (L.it) {
        var pw2 = portionWordOf(L.it);
        w.textContent = L.n === 1 ? pw2 : plural(pw2);
      }
      L.row.querySelector('[data-d="rm"]').disabled = only;
      if (!L.it || !L.n) return;
      if (!costed(L.it)) {
        anyUncosted = true;
        html += '<div class="dline"><span>' + esc(L.it.name) + " — no recipe costed</span><span>no cost</span></div>";
        return;
      }
      var u = linePortions(L), c = u * unitCostOf(L.it);
      units += u; total += c;
      words[portionWordOf(L.it)] = 1;
      html += '<div class="dline"><span><b>' + esc(count(u, portionWordOf(L.it))) + "</b> " +
        esc(L.it.name) + ", expires " + niceDate(addDays(madeOn, L.it.shelf)) +
        "</span><span class=\"num\">" + cur() + " " + money(c) + "</span></div>";
    });
    var wk = Object.keys(words);
    if (html) html += '<div class="dline"><span>' + esc(count(units, wk.length === 1 ? wk[0] : "portion")) +
      " in total</span><span class=\"num\">" + cur() + " " + money(total) + "</span></div>";
    if (anyUncosted) html += '<p class="hint" style="margin-top:8px">Items without a recipe go in with no cost recorded.</p>';
    pv.innerHTML = html;
  }

  function addDelivery() {
    var madeOn = document.getElementById("d-date").value || todayStr();
    var lines = readDeliveryRows().filter(function (L) { return L.it && L.n > 0; });
    if (!lines.length) { toast("Add at least one item with a quantity.", true); return; }
    var summary = [], uncosted = [];
    lines.forEach(function (L) {
      if (costed(L.it)) {
        summary.push(count(linePortions(L), portionWordOf(L.it)) + " " + L.it.name);
      } else {
        summary.push(L.n + " " + L.it.name + " (no cost)");
        uncosted.push(L.it.name);
      }
    });
    var msg = summary.join("\n") + "\n\nQuantity, cost and date cannot be changed after this.";
    if (uncosted.length) msg = "No recipe costed for: " + uncosted.join(", ") + " — they go in with no cost.\n\n" + msg;
    ask({ title: "Lock this order?", body: msg, ok: "SAVE & LOCK" }).then(function (go) {
      if (!go) return;
      doSaveDelivery(lines, madeOn);
    });
  }

  function doSaveDelivery(lines, madeOn) {
    var at = new Date().toISOString();
    save(function (nx) {
      var drop = id("d");
      lines.forEach(function (L) {
        nx.batches.push({
          id: id("b"), drop: drop, itemId: L.it.id,
          qty: linePortions(L),
          unitCost: unitCostOf(L.it), unitPrice: L.it.price,
          batches: null,
          batchWord: batchWordOf(L.it), portionWord: portionWordOf(L.it),
          shelf: L.it.shelf, madeOn: madeOn,
          by: me.id, at: at, sales: []
        });
      });
    }, lines.length > 1 ? lines.length + " items locked in." : "Order locked in.");
  }

  function saveRecipe(iid) {
    var card = app.querySelector('[data-recipe="' + iid + '"]');
    var val = function (el) { var v = parseFloat(el.value); return isNaN(v) ? 0 : v; };
    var rows = [];
    var bad = false;
    card.querySelectorAll("[data-row]").forEach(function (row) {
      var nm = row.querySelector('[data-f="n"]').value.trim();
      var q = val(row.querySelector('[data-f="q"]'));
      var pp = val(row.querySelector('[data-f="pp"]'));
      var pq = val(row.querySelector('[data-f="pq"]'));
      var u = row.querySelector('[data-f="u"]').value.trim();
      if (!nm) return;
      if (pq <= 0) { bad = true; return; }
      rows.push({ n: nm, q: q, u: u, pp: pp, pq: pq });
    });
    if (bad) { toast("Pack quantity must be above zero — that is what the price divides by.", true); return; }
    var pieces = val(card.querySelector('[data-f="yieldPieces"]'));
    var per = val(card.querySelector('[data-f="perPortion"]'));
    var pack = val(card.querySelector('[data-f="packaging"]'));
    var price = val(card.querySelector('[data-f="price"]'));
    var pword = card.querySelector('[data-f="portionWord"]').value.trim() || "portion";
    if (per <= 0) { toast("Pieces in one of them must be above zero.", true); return; }
    if (pieces > 0 && per > pieces) { toast("One piece cannot take more than the whole recipe makes.", true); return; }
    save(function (nx) {
      var t = nx.items.filter(function (i) { return i.id === iid; })[0];
      t.recipe = rows; t.yieldPieces = pieces; t.perPortion = per;
      t.packaging = pack; t.price = price; t.portionWord = pword;
    }, "Recipe saved.");
  }

  function saveItem(iid) {
    var card = app.querySelector('[data-item="' + iid + '"]');
    var g = function (f) { return card.querySelector('[data-f="' + f + '"]').value; };
    var price = parseFloat(g("price")), shelf = parseInt(g("shelf"), 10);
    if (!g("name").trim()) { toast("Item needs a name.", true); return; }
    if (isNaN(price) || price < 0) { toast("Price must be zero or more.", true); return; }
    if (isNaN(shelf) || shelf < 0) { toast("Shelf life must be zero or more days.", true); return; }
    save(function (n) {
      var t = n.items.filter(function (i) { return i.id === iid; })[0];
      t.name = g("name").trim(); t.note = g("note").trim();
      t.price = price; t.shelf = shelf; t.active = g("active") === "1";
    }, "Item saved.");
  }

  function saveUser(uid) {
    var card = app.querySelector('[data-user="' + uid + '"]');
    var g = function (f) { return card.querySelector('[data-f="' + f + '"]').value; };
    var name = g("name").trim(), role = g("role"), pin = g("pin").trim();
    var handle = g("user").trim().toLowerCase();
    if (!name) { toast("Person needs a name.", true); return; }
    if (!/^[a-z0-9._-]{2,20}$/.test(handle)) {
      toast("Username: 2–20 characters, lowercase letters, digits, dot, dash or underscore.", true); return;
    }
    if (S.team.some(function (t) { return t.id !== uid && (t.user || "").toLowerCase() === handle; })) {
      toast("That username is already taken.", true); return;
    }
    if (pin && !/^\d{4,8}$/.test(pin)) { toast("PIN must be 4–8 digits.", true); return; }
    var apply = function (h) {
      save(function (n) {
        var t = n.team.filter(function (u) { return u.id === uid; })[0];
        t.name = name; t.role = role; t.user = handle;
        if (h) t.pin = h;
        var DEF = "d4165ae679b414636d9b7ff6fb6e1ee8b4824dfee69e3b2fc47fdfc259d38117";
        n.defaultPins = n.team.some(function (u) { return u.pin === DEF; });
      }, "Person saved.");
    };
    if (pin) hash(pin).then(apply); else apply(null);
  }

  /* ============ boot ============ */
  loadSession();
  render();
  claude.use("artifact").then(function (a) {
    artifact = a;
    if (!a) { readOnly = true; }
    render();
  }).catch(function () { readOnly = true; render(); });
  /* saving a file is a separate grant and may never arrive; the invoice
     button only appears once it does */
  claude.use("downloads").then(function (d) {
    if (d) { dl = d; render(); }
  }).catch(function () {});
})();
</script>
