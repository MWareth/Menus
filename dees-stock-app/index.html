<title>Dee's Stock</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Cairo:wght@400;600;700;900&display=swap">
<style id="app-style">
  :root{
    --brown:#4A2C2A; --cream:#FAF3E7; --gold:#C99334; --char:#1C1917;
    --butter:#FFD21C; --ketchup:#F02820; --paper:#FFF9EE;
    --ok:#2F7D4F; --warn:#C2650B; --bad:#C0271C;
    --ink:#2B1E1A; --ink-2:#6B584D; --ink-3:#9A8A7C;
    --line:#E6DBC8; --card:#FFFFFF; --shade:#F5EDDD;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--cream);color:var(--ink);
    font-family:Cairo,'Segoe UI',system-ui,sans-serif;font-size:16px;line-height:1.55}
  img{max-width:100%}
  [hidden]{display:none!important}
  button{font:inherit;cursor:pointer}
  input,select{font:inherit;color:inherit}
  .num{font-variant-numeric:tabular-nums}
  .disp{font-family:'Baloo 2',Cairo,sans-serif;font-weight:800}

  .wrap{max-width:880px;margin:0 auto;padding:0 16px}

  /* ---------- top bar ---------- */
  .bar{background:var(--paper);border-bottom:1px solid var(--line);padding:22px 0 16px}
  .bar .wrap{display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center}
  .logo{width:126px;height:51px;flex-shrink:0;

  .brandline{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:23px;line-height:1;
    color:var(--brown);letter-spacing:.01em}
  .who{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:700;color:var(--ink-2);
    flex-wrap:wrap;justify-content:center;margin-top:2px}
  .avatar{width:28px;height:28px;border-radius:50%;background:var(--gold);color:#2B1E1A;
    display:grid;place-items:center;font-weight:900;font-size:11px}
  .out{background:none;border:1.5px solid var(--line);color:var(--ink-3);border-radius:999px;
    padding:5px 11px;font-size:11px;font-weight:900;letter-spacing:.08em}
  .out:hover{border-color:var(--brown);color:var(--brown)}

  /* ---------- tabs ---------- */
  .tabs{background:var(--char);position:sticky;top:0;z-index:49;
    overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs .wrap{display:flex;gap:2px;padding:0 12px}
  .tab{background:none;border:0;color:#8C8279;padding:13px 14px;font-size:13px;font-weight:900;
    letter-spacing:.06em;white-space:nowrap;border-bottom:3px solid transparent;min-height:46px}
  .tab[aria-current="true"]{color:var(--butter);border-bottom-color:var(--butter)}
  .tab:focus-visible{outline:2px solid var(--butter);outline-offset:-4px}
  .tab .dot{display:inline-block;min-width:17px;height:17px;line-height:17px;border-radius:999px;
    background:var(--ketchup);color:#fff;font-size:10px;margin-left:6px;padding:0 4px}

  main{padding:20px 0 60px}
  h2.sec{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:22px;margin:0 0 4px}
  p.sub{margin:0 0 18px;color:var(--ink-2);font-size:15px}

  /* ---------- cards & banners ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
  .banner{border-radius:12px;padding:14px 16px;margin-bottom:14px;font-size:14.5px;line-height:1.5}
  .banner b{font-weight:900}
  .banner.warn{background:#FDF1DC;border:1px solid #EBC98A;color:#6A4708}
  .banner.bad{background:#FCE9E7;border:1px solid #F0B6B0;color:#7C1E16}
  .banner.info{background:var(--shade);border:1px solid var(--line);color:var(--ink-2)}

  /* ---------- stats ---------- */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .stat .k{font-size:11px;font-weight:900;letter-spacing:.14em;color:var(--ink-3)}
  .stat .v{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:26px;line-height:1.15;margin-top:4px}
  .stat .n{font-size:12.5px;color:var(--ink-2);margin-top:2px}
  .stat.good .v{color:var(--ok)} .stat.bad .v{color:var(--bad)} .stat.warn .v{color:var(--warn)}

  /* ---------- batch rows ---------- */
  .rows{display:flex;flex-direction:column;gap:10px}
  .row{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;
    display:grid;grid-template-columns:6px 1fr;align-items:stretch}
  .row .stripe{background:var(--line)}
  .row.s-fresh .stripe{background:var(--ok)}
  .row.s-soon .stripe{background:var(--warn)}
  .row.s-today .stripe{background:var(--ketchup)}
  .row.s-expired .stripe{background:var(--bad)}
  .row.s-done .stripe{background:var(--ink-3)}
  .row.s-void .stripe{background:var(--ink-3)}
  .row .in{padding:14px 16px;min-width:0}
  .rt{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .rt .nm{font-weight:900;font-size:17px}
  .rt .qty{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:17px;color:var(--brown)}
  .meta{font-size:13px;color:var(--ink-2);margin-top:4px}
  .meta b{color:var(--ink);font-weight:700}
  .pill{display:inline-block;font-size:10.5px;font-weight:900;letter-spacing:.07em;
    padding:3px 9px;border-radius:999px;vertical-align:middle}
  .p-fresh{background:#E4F1E8;color:#1F5D39}
  .p-soon{background:#FBEBD3;color:#8A4A06}
  .p-today{background:#FDE3E0;color:#93221A}
  .p-expired{background:var(--bad);color:#fff}
  .p-done{background:var(--shade);color:var(--ink-2)}
  .p-void{background:var(--shade);color:var(--ink-3)}
  .p-lock{background:var(--char);color:var(--butter)}

  .bar-track{height:7px;border-radius:4px;background:var(--shade);margin-top:10px;overflow:hidden}
  .bar-fill{height:100%;background:var(--gold);border-radius:4px}

  .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

  /* ---------- buttons ---------- */
  .btn{border:0;border-radius:10px;padding:11px 16px;font-size:14px;font-weight:900;
    min-height:44px;letter-spacing:.02em}
  .btn:focus-visible{outline:2px solid var(--char);outline-offset:2px}
  .btn.pri{background:var(--butter);color:var(--char)}
  .btn.pri:hover{background:#F0C316}
  .btn.dark{background:var(--char);color:var(--paper)}
  .btn.dark:hover{background:#332C28}
  .btn.ghost{background:transparent;color:var(--ink-2);border:1.5px solid var(--line)}
  .btn.ghost:hover{border-color:var(--ink-3);color:var(--ink)}
  .btn.danger{background:transparent;color:var(--bad);border:1.5px solid #F0B6B0}
  .btn.danger:hover{background:#FCE9E7}
  .btn.sm{padding:8px 12px;font-size:13px;min-height:38px}
  .btn:disabled{opacity:.45;cursor:not-allowed}

  /* ---------- forms ---------- */
  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
  .field label{font-size:12px;font-weight:900;letter-spacing:.1em;color:var(--ink-3)}
  .field input,.field select{border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;
    background:#fff;min-height:44px;width:100%}
  .field input:focus,.field select:focus{outline:2px solid var(--gold);outline-offset:-1px;border-color:var(--gold)}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 12px}
  .hint{font-size:12.5px;color:var(--ink-3)}

  /* ---------- table ---------- */
  .tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
  table{border-collapse:collapse;width:100%;min-width:520px}
  th,td{text-align:left;padding:11px 13px;border-bottom:1px solid var(--line);font-size:14.5px}
  th{font-size:11px;font-weight:900;letter-spacing:.1em;color:var(--ink-3);background:var(--shade)}
  tr:last-child td{border-bottom:0}
  td.r,th.r{text-align:right}

  /* ---------- lock screen ---------- */
  .lock{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--char)}
  .lockbox{background:var(--card);border-radius:18px;padding:30px 26px;width:100%;max-width:390px}
  .lockbox .logo{margin:0 auto 14px}
  .lockbox h1{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:26px;margin:0 0 4px;text-align:center}
  .lockbox p{margin:0 0 22px;color:var(--ink-2);font-size:14.5px;text-align:center}
  .err{color:var(--bad);font-size:13.5px;font-weight:700;margin-top:8px}

  /* ---------- dialog (native confirm/prompt are blocked in the sandbox) ---------- */
  .modal{position:fixed;inset:0;background:rgba(28,25,23,.6);display:grid;place-items:center;
    z-index:300;padding:18px}
  .modalbox{background:var(--card);border-radius:16px;padding:24px 22px;max-width:430px;width:100%;
    box-shadow:0 22px 60px rgba(0,0,0,.32);max-height:86vh;overflow-y:auto}

<script id="app-code">
(function () {
  "use strict";

  /* ============ state ============ */
  var S = JSON.parse(document.getElementById("app-state").textContent);
  var app = document.getElementById("app");
  var artifact = null;
  var readOnly = false;
  var busy = false;
  var tab = "stock";
  var me = null;
  var lockErr = "";

  var ROLES = {
    admin: { label: "ADMIN", canDeliver: true, canSell: true, canSetup: true },
    dees:  { label: "DEE'S", canDeliver: true, canSell: false, canSetup: false },
    truck: { label: "TRUCK", canDeliver: false, canSell: true, canSetup: false }
  };

  /* ============ helpers ============ */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function id(p) { S.seq = (S.seq || 1) + 1; return p + S.seq; }
  function money(n) {
    if (n == null || isNaN(n)) return "—";
    var v = Math.round(n * 100) / 100;
    return v.toLocaleString("en-US", { minimumFractionDigits: v % 1 ? 2 : 0, maximumFractionDigits: 2 });
  }
  function cur() { return esc(S.currency || "AED"); }
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function addDays(ds, n) {
    var p = ds.split("-");
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    d.setDate(d.getDate() + n);
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function daysBetween(a, b) {
    var pa = a.split("-"), pb = b.split("-");
    var da = Date.UTC(+pa[0], +pa[1] - 1, +pa[2]), db = Date.UTC(+pb[0], +pb[1] - 1, +pb[2]);
    return Math.round((db - da) / 86400000);
  }
  function stamp(iso) {
    if (!iso) return "—";
    var d = new Date(iso);
    if (isNaN(d)) return "—";
    return d.toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
  }
  function niceDate(ds) {
    var p = ds.split("-");
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    return d.toLocaleDateString("en-GB", { day: "numeric", month: "short" });
  }
  function item(iid) {
    for (var i = 0; i < S.items.length; i++) if (S.items[i].id === iid) return S.items[i];
    return null;
  }
  function user(uid) {
    for (var i = 0; i < S.team.length; i++) if (S.team[i].id === uid) return S.team[i];
    return null;
  }
  function uname(uid) { var u = user(uid); return u ? u.name : "—"; }
  function initials(n) {
    return n.trim().split(/\s+/).slice(0, 2).map(function (w) { return w[0]; }).join("").toUpperCase();
  }
  function hash(pin) {
    var data = new TextEncoder().encode("deeserts:" + pin);
    return crypto.subtle.digest("SHA-256", data).then(function (b) {
      return Array.prototype.map.call(new Uint8Array(b), function (x) {
        return x.toString(16).padStart(2, "0");
      }).join("");
    });
  }

  /* ============ recipe costing ============
     Costed per BATCH (one cake / tray), from supermarket pack prices.
     line cost = recipe qty / pack qty x pack price
     portions  = pieces per batch / pieces per portion
     unit cost = batch cost / portions + packaging                        */
  function lineCost(r) {
    var q = +r.q, pq = +r.pq, pp = +r.pp;
    if (!(pq > 0) || isNaN(q) || isNaN(pp)) return 0;
    return (q / pq) * pp;
  }
  function batchCost(it) {
    return (it.recipe || []).reduce(function (a, r) { return a + lineCost(r); }, 0);
  }
  function portionsPer(it) {
    var p = +it.perPortion || 1, y = +it.yieldPieces || 0;
    if (!(y > 0) || !(p > 0)) return 0;
    return Math.floor(y / p);
  }
  function leftoverPcs(it) {
    var p = +it.perPortion || 1, y = +it.yieldPieces || 0;
    if (!(y > 0) || !(p > 0)) return 0;
    return y - Math.floor(y / p) * p;
  }
  function costed(it) { return (it.recipe || []).length > 0 && portionsPer(it) > 0; }
  function unitCostOf(it) {
    if (!costed(it)) return null;
    return batchCost(it) / portionsPer(it) + (+it.packaging || 0);
  }

  /* ============ batch maths ============ */
  function sold(b) {
    var t = 0;
    for (var i = 0; i < (b.sales || []).length; i++) t += b.sales[i].qty;
    return t;
  }
  function remaining(b) { return b.qty - sold(b); }
  function expiresOn(b) { return addDays(b.madeOn, b.shelf); }
  function status(b) {
    if (b.voided) return "void";
    var left = remaining(b);
    if (left <= 0) return "done";
    var d = daysBetween(todayStr(), expiresOn(b));
    if (d < 0) return "expired";
    if (d === 0) return "today";
    if (d === 1) return "soon";
    return "fresh";
  }
  var STATUS_LABEL = {
    fresh: "IN DATE", soon: "EXPIRES TOMORROW", today: "LAST DAY",
    expired: "EXPIRED", done: "SOLD OUT", "void": "VOIDED"
  };
  function live() {
    return S.batches.filter(function (b) { return !b.voided; });
  }
  function totals(days) {
    var cutoff = days ? addDays(todayStr(), -days + 1) : null;
    var t = { cost: 0, revenue: 0, waste: 0, unitsOut: 0, unitsSold: 0, unitsWasted: 0, unknownCost: 0 };
    live().forEach(function (b) {
      if (cutoff && b.madeOn < cutoff) return;
      var s = sold(b);
      t.unitsOut += b.qty; t.unitsSold += s;
      t.revenue += s * (b.unitPrice || 0);
      if (b.unitCost == null) t.unknownCost += b.qty;
      else t.cost += b.qty * b.unitCost;
      if (status(b) === "expired") {
        var left = remaining(b);
        t.unitsWasted += left;
        if (b.unitCost != null) t.waste += left * b.unitCost;
      }
    });
    t.profit = t.revenue - t.cost;
    return t;
  }

  /* ============ persistence ============ */
  function buildDoc(next) {
    var css = document.getElementById("app-style").textContent.trim();
    var js = document.getElementById("app-code").textContent.trim();
    var json = JSON.stringify(next).replace(/</g, "\\u003c");
    var close = "<" + "/script>";
    return '<!doctype html>\n<html lang="en">\n<head>\n' +
      '<meta charset="utf-8">\n' +
      '<meta name="viewport" content="width=device-width,initial-scale=1">\n' +
      "<title>Dee's Stock</title>\n" +
      '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Cairo:wght@400;600;700;900&display=swap">\n' +
      '<style id="app-style">' + css + "<" + "/style>\n" +
      "</head>\n<body>\n" +
      '<div id="app"><' + "/div>\n" +
      '<script id="app-state" type="application/json">\n' + json + "\n" + close + "\n" +
      '<script id="app-code">\n' + js + "\n" + close + "\n" +
      "</body>\n</html>";
  }

  function save(mutate, okMsg) {
    if (readOnly) { toast("This view is read-only.", true); return; }
    if (!artifact) { toast("Still connecting — try again in a moment.", true); return; }
    if (busy) return;
    var next = clone(S);
    var restoreSeq = S.seq;
    S.seq = next.seq = restoreSeq;
    try { mutate(next); } catch (e) { toast(e.message || "Could not save.", true); return; }
    next.seq = S.seq;
    next.updatedAt = new Date().toISOString();
    busy = true; render();
    try { sessionStorage.setItem("deeserts.flash", okMsg || "Saved."); } catch (e) {}
    artifact.publish(buildDoc(next)).catch(function (err) {
      busy = false;
      try { sessionStorage.removeItem("deeserts.flash"); } catch (e) {}
      var code = err && err.code;
      if (code === "conflict") { toast("Someone saved first — reloading their version."); return; }
      if (code === "not_writer" || code === "not_granted" || code === "not_declared" ||
          code === "capability_disabled" || code === "capability_removed" || code === "consent_required") {
        readOnly = true; render();
        toast("You have view-only access to this board.", true);
        return;
      }
      if (code === "rate_limited") { toast("Saving too fast — wait a moment.", true); render(); return; }
      if (code === "too_large") { toast("The board is full. Archive old batches in Setup.", true); render(); return; }
      toast("Could not save. Try again.", true);
      render();
    });
  }

  /* Sandboxed frames block window.confirm / window.prompt — they return without
     asking, which silently cancels whatever they were guarding. Own dialog instead. */
  function ask(opts) {
    return new Promise(function (resolve) {
      var back = document.createElement("div");
      back.className = "modal";
      var h = '<div class="modalbox" role="dialog" aria-modal="true" aria-label="' + esc(opts.title || "Confirm") + '">';
      if (opts.title) h += "<h3>" + esc(opts.title) + "</h3>";
      if (opts.body) h += '<div class="msg">' + esc(opts.body) + "</div>";
      if (opts.input) h += '<div class="field" style="margin-top:16px"><label for="m-val">' +
        esc(opts.input.label) + '</label><input id="m-val" type="number" inputmode="numeric" value="' +
        esc(opts.input.value) + '" min="' + esc(opts.input.min) + '" max="' + esc(opts.input.max) + '"></div>';
      h += '<div class="modalacts">' +
        '<button class="btn ghost" type="button" data-m="no">Cancel</button>' +
        '<button class="btn ' + (opts.danger ? "danger" : "pri") + '" type="button" data-m="yes">' +
        esc(opts.ok || "Confirm") + "</button></div></div>";
      back.innerHTML = h;
      document.body.appendChild(back);

      var done = false;
      function finish(val) {
        if (done) return;
        done = true;
        document.removeEventListener("keydown", onKey, true);
        back.remove();
        resolve(val);
      }
      function onKey(e) {
        if (e.key === "Escape") { e.preventDefault(); finish(null); }
        else if (e.key === "Enter" && !opts.input) { e.preventDefault(); accept(); }
      }
      function accept() {
        if (!opts.input) { finish(true); return; }
        var v = parseInt(back.querySelector("#m-val").value, 10);
        if (!(v > 0)) { toast("Enter a whole number above zero.", true); return; }
        if (opts.input.max != null && v > opts.input.max) {
          toast("Only " + opts.input.max + " left in that batch.", true); return;
        }
        finish(v);
      }
      back.querySelector('[data-m="no"]').onclick = function () { finish(null); };
      back.querySelector('[data-m="yes"]').onclick = accept;
      back.onclick = function (e) { if (e.target === back) finish(null); };
      document.addEventListener("keydown", onKey, true);
      var f = back.querySelector("#m-val") || back.querySelector('[data-m="yes"]');
      if (f) { f.focus(); if (f.select) f.select(); }
      if (opts.input) {
        back.querySelector("#m-val").addEventListener("keydown", function (e) {
          if (e.key === "Enter") { e.preventDefault(); accept(); }
        });
      }
    });
  }

  var toastT = null;
  function toast(msg, bad) {
    var el = document.querySelector(".toast");
    if (el) el.remove();
    el = document.createElement("div");
    el.className = "toast" + (bad ? " bad" : "");
    el.setAttribute("role", "status");
    el.textContent = msg;
    document.body.appendChild(el);
    clearTimeout(toastT);
    toastT = setTimeout(function () { el.remove(); }, 3200);
  }

  /* ============ session ============ */
  function loadSession() {
    try {
      var uid = sessionStorage.getItem("deeserts.uid");
      if (uid && user(uid)) me = user(uid);
      var f = sessionStorage.getItem("deeserts.flash");
      if (f) { sessionStorage.removeItem("deeserts.flash"); setTimeout(function () { toast(f); }, 60); }
      var t = sessionStorage.getItem("deeserts.tab");
      if (t) tab = t;
    } catch (e) {}
  }
  function setTab(t) {
    tab = t;
    try { sessionStorage.setItem("deeserts.tab", t); } catch (e) {}
    render();
    window.scrollTo(0, 0);
  }
  function signOut() {
    me = null;
    try { sessionStorage.removeItem("deeserts.uid"); } catch (e) {}
    render();
  }

  /* ============ render ============ */
  function render() {
    if (!me) { renderLock(); return; }
    var perm = ROLES[me.role] || ROLES.truck;
    var alerts = live().filter(function (b) {
      var s = status(b);
      return s === "expired" || s === "today";
    }).length;

    var html = "";
    html += '<header class="bar"><div class="wrap">' +
      '<div class="logo" role="img" aria-label="Dee\'s Treats"></div>' +
      '<div class="brandline">Stock</div>' +
      '<div class="who"><span class="avatar">' + esc(initials(me.name)) + "</span>" +
      "<span>" + esc(me.name) + " &middot; " + perm.label + "</span>" +
      '<button class="out" type="button" data-act="signout">EXIT</button>' +
      "</div></div></header>";

    var tabs = [["stock", "STOCK", alerts], ["out", "DELIVERIES", 0], ["sell", "SALES", 0], ["money", "MONEY", 0]];
    if (perm.canDeliver) tabs.push(["recipes", "RECIPES", 0]);
    if (perm.canSetup) tabs.push(["setup", "SETUP", 0]);
    tabs.push(["account", "MY PIN", 0]);
    html += '<nav class="tabs"><div class="wrap">';
    tabs.forEach(function (t) {
      html += '<button class="tab" type="button" data-tab="' + t[0] + '" aria-current="' + (tab === t[0]) + '">' +
        t[1] + (t[2] ? '<span class="dot">' + t[2] + "</span>" : "") + "</button>";
    });
    html += "</div></nav>";

    html += '<main><div class="wrap">';
    if (readOnly) html += '<div class="banner info"><b>View only.</b> You can see everything here but not record anything — you need edit access to this board.</div>';
    if (S.defaultPins) html += '<div class="banner warn"><b>Everyone still has PIN 1234.</b> Change them in Setup before you share this link.</div>';
    var noCost = S.items.filter(function (i) { return i.active && !costed(i); }).length;
    if (noCost && perm.canDeliver) html += '<div class="banner warn"><b>' + noCost + " item" + (noCost > 1 ? "s have" : " has") +
      " no recipe costed yet.</b> Add ingredients and yield on the Recipes tab — cost, profit and the split stay incomplete until you do.</div>";

    var allowed = {};
    tabs.forEach(function (t) { allowed[t[0]] = true; });
    if (!allowed[tab]) tab = "stock";
    if (tab === "stock") html += viewStock(perm);
    else if (tab === "out") html += viewOut(perm);
    else if (tab === "sell") html += viewSell(perm);
    else if (tab === "money") html += viewMoney();
    else if (tab === "recipes") html += viewRecipes(perm);
    else if (tab === "setup") html += viewSetup(perm);
    else if (tab === "account") html += viewAccount();
    else html += viewStock(perm);
    html += "</div></main>";

    app.innerHTML = html;
    wire();
  }

  /* ---------- lock ---------- */
  function failState() {
    try { return JSON.parse(sessionStorage.getItem("deeserts.fail") || "{}"); } catch (e) { return {}; }
  }
  function lockedFor() {
    var f = failState();
    return f.until && Date.now() < f.until ? Math.ceil((f.until - Date.now()) / 1000) : 0;
  }
  function noteFail() {
    var f = failState();
    f.n = (f.n || 0) + 1;
    if (f.n >= 5) { f.until = Date.now() + 30000; f.n = 0; }
    try { sessionStorage.setItem("deeserts.fail", JSON.stringify(f)); } catch (e) {}
  }
  function clearFail() { try { sessionStorage.removeItem("deeserts.fail"); } catch (e) {} }

  function renderLock() {
    var wait = lockedFor();
    var h = '<div class="lock"><form class="lockbox" id="loginform" autocomplete="on">' +
      '<div class="logo" role="img" aria-label="Dee\'s Treats"></div>' +
      "<h1>Stock</h1>" +
      "<p>Sign in with your own login.</p>" +
      '<div class="field"><label for="who">USERNAME</label>' +
      '<input id="who" type="text" name="username" autocomplete="username" autocapitalize="none" ' +
      'autocorrect="off" spellcheck="false" placeholder="your username"' + (wait ? " disabled" : "") + "></div>" +
      '<div class="field"><label for="pin">PIN</label>' +
      '<input id="pin" type="password" name="password" inputmode="numeric" autocomplete="current-password" ' +
      'placeholder="••••"' + (wait ? " disabled" : "") + "></div>" +
      '<button class="btn pri" type="submit" style="width:100%"' + (wait ? " disabled" : "") + ">SIGN IN</button>";
    if (wait) h += '<div class="err">Too many attempts. Try again in ' + wait + "s.</div>";
    else if (lockErr) h += '<div class="err">' + esc(lockErr) + "</div>";
    h += '<p class="hint" style="margin-top:16px">Ask an admin if you do not have a login yet.</p>';
    h += "</form></div>";
    app.innerHTML = h;
    var form = document.getElementById("loginform");
    form.onsubmit = function (e) { e.preventDefault(); doLogin(); };
    if (wait) { setTimeout(function () { if (!me) renderLock(); }, 1000); return; }
    var w = document.getElementById("who");
    if (w) w.focus();
  }

  function doLogin() {
    if (lockedFor()) { renderLock(); return; }
    var whoEl = document.getElementById("who"), pinEl = document.getElementById("pin");
    if (!whoEl || !pinEl) return;
    var who = (whoEl.value || "").trim().toLowerCase();
    var pin = (pinEl.value || "").trim();
    if (!who || !pin) { lockErr = "Enter your username and PIN."; renderLock(); return; }
    var found = null;
    for (var i = 0; i < S.team.length; i++) {
      var t = S.team[i];
      if ((t.user || "").toLowerCase() === who || (t.name || "").trim().toLowerCase() === who) { found = t; break; }
    }
    /* hash regardless of whether the name exists, so a wrong username and a
       wrong PIN take the same time and give the same message */
    hash(pin).then(function (hp) {
      if (found && hp === found.pin) {
        me = found; lockErr = ""; clearFail();
        try { sessionStorage.setItem("deeserts.uid", found.id); } catch (e) {}
        render();
      } else {
        noteFail();
        lockErr = "That username and PIN don't match.";
        renderLock();
      }
    });
  }

  /* ---------- stock ---------- */
  function viewStock(perm) {
    var t = todayStr();
    var open = live().filter(function (b) { return remaining(b) > 0; });
    var expired = open.filter(function (b) { return status(b) === "expired"; });
    var lastDay = open.filter(function (b) { return status(b) === "today"; });
    var tomorrow = open.filter(function (b) { return status(b) === "soon"; });
    var onHand = open.reduce(function (a, b) { return a + remaining(b); }, 0);
    var todaySold = 0;
    live().forEach(function (b) {
      (b.sales || []).forEach(function (s) { if ((s.at || "").slice(0, 10) === t) todaySold += s.qty; });
    });

    var h = '<h2 class="sec">In stock</h2><p class="sub">' + niceDate(t) +
      " · everything delivered and not yet sold.</p>";
    h += '<div class="stats">' +
      stat("ON HAND", onHand, onHand + " unit" + (onHand === 1 ? "" : "s") + " unsold", "") +
      stat("SOLD TODAY", todaySold, "logged by the truck", "good") +
      stat("LAST DAY", lastDay.length, "sell these first", lastDay.length ? "warn" : "") +
      stat("EXPIRED", expired.length, "batches to write off", expired.length ? "bad" : "") +
      "</div>";

    if (expired.length) {
      h += '<div class="banner bad"><b>' + expired.length + " batch" + (expired.length > 1 ? "es have" : " has") +
        " passed its date.</b> Pull them off the counter and write them off — they still count as cost.</div>";
    }
    if (lastDay.length) {
      h += '<div class="banner warn"><b>' + lastDay.length + " batch" + (lastDay.length > 1 ? "es are" : " is") +
        " on its last day.</b> Anything unsold tonight becomes waste tomorrow.</div>";
    }

    var order = { expired: 0, today: 1, soon: 2, fresh: 3 };
    var sorted = open.slice().sort(function (a, b) {
      var d = order[status(a)] - order[status(b)];
      return d !== 0 ? d : (expiresOn(a) < expiresOn(b) ? -1 : 1);
    });
    if (open.length) {
      var byItem = {};
      open.forEach(function (b) {
        var k = b.itemId;
        if (!byItem[k]) byItem[k] = { n: 0, soonest: null, batches: 0 };
        byItem[k].n += remaining(b);
        byItem[k].batches += 1;
        var e = expiresOn(b);
        if (!byItem[k].soonest || e < byItem[k].soonest) byItem[k].soonest = e;
      });
      h += '<div class="subhead">BY ITEM</div><div class="tw"><table><thead><tr><th>ITEM</th>' +
        '<th class="r">ON HAND</th><th class="r">BATCHES</th><th>FIRST TO EXPIRE</th>' +
        "</tr></thead><tbody>";
      Object.keys(byItem).forEach(function (k) {
        var g = byItem[k], it = item(k);
        var d = daysBetween(t, g.soonest);
        var when = d < 0 ? "expired" : d === 0 ? "today" : d === 1 ? "tomorrow" : niceDate(g.soonest);
        var cls = d <= 0 ? "p-today" : d === 1 ? "p-soon" : "p-fresh";
        h += "<tr><td>" + esc(it ? it.name : "Deleted item") + '</td><td class="r num">' + g.n +
          '</td><td class="r num">' + g.batches + '</td><td><span class="pill ' + cls + '">' +
          esc(when.toUpperCase()) + "</span></td></tr>";
      });
      h += "</tbody></table></div>";
    }

    h += '<div class="subhead">EVERY BATCH</div>';
    h += sorted.length ? rows(sorted, perm, true) :
      '<div class="empty">Nothing in stock. Dee logs a delivery to start.</div>';
    if (tomorrow.length) h += '<p class="hint" style="margin-top:12px">' + tomorrow.length +
      " batch" + (tomorrow.length > 1 ? "es expire" : " expires") + " tomorrow.</p>";
    return h;
  }
  function stat(k, v, n, cls) {
    return '<div class="stat ' + cls + '"><div class="k">' + k + '</div><div class="v num">' + v +
      '</div><div class="n">' + esc(n) + "</div></div>";
  }

  /* ---------- rows ---------- */
  function rows(list, perm, withSell) {
    var h = '<div class="rows">';
    list.forEach(function (b) {
      var it = item(b.itemId);
      var st = status(b);
      var s = sold(b), left = remaining(b);
      var exp = expiresOn(b);
      var d = daysBetween(todayStr(), exp);
      h += '<div class="row s-' + st + '"><div class="stripe"></div><div class="in">' +
        '<div class="rt"><span class="nm">' + esc(it ? it.name : "Deleted item") + "</span>" +
        '<span class="qty num">' + left + " / " + b.qty + "</span>" +
        '<span class="pill p-' + st + '">' + STATUS_LABEL[st] + "</span>" +
        (b.voided ? "" : '<span class="pill p-lock">LOCKED</span>') + "</div>";
      h += '<div class="meta">' + (b.batches ? "<b>" + b.batches + " " + esc(b.batchWord || "batch") + (b.batches > 1 ? "s" : "") + "</b> · " : "") +
        "Made <b>" + niceDate(b.madeOn) + "</b> · expires <b>" + niceDate(exp) + "</b>" +
        (st === "expired" ? " (" + Math.abs(d) + "d ago)" : d >= 0 && !b.voided && left > 0 ? " (" + (d === 0 ? "today" : d + "d") + ")" : "") +
        " · logged <b>" + esc(stamp(b.at)) + "</b> by <b>" + esc(uname(b.by)) + "</b></div>";
      h += '<div class="meta">Sold <b>' + s + "</b> · cost " +
        (b.unitCost == null ? "<b>not set</b>" : "<b>" + cur() + " " + money(b.qty * b.unitCost) + "</b>") +
        " · sells at <b>" + cur() + " " + money(b.unitPrice) + "</b></div>";
      if (b.voided) h += '<div class="meta">Voided by <b>' + esc(uname(b.voidedBy)) + "</b>" +
        (b.voidReason ? ": " + esc(b.voidReason) : "") + "</div>";
      var pct = b.qty ? Math.round((s / b.qty) * 100) : 0;
      h += '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div>';
      if (withSell && !b.voided && left > 0 && perm.canSell && !readOnly) {
        h += '<div class="acts">' +
          '<button class="btn pri sm" type="button" data-sell="' + b.id + '" data-n="1">SOLD 1</button>' +
          '<button class="btn dark sm" type="button" data-sell="' + b.id + '" data-n="2">SOLD 2</button>' +
          '<button class="btn ghost sm" type="button" data-sellmany="' + b.id + '">OTHER…</button>' +
          "</div>";
      }
      h += "</div></div>";
    });
    return h + "</div>";
  }

  /* ---------- deliveries ---------- */
  function viewOut(perm) {
    var h = '<h2 class="sec">Deliveries out</h2>' +
      '<p class="sub">What Dee sends to the truck. Every delivery locks the moment it is saved — quantity, cost and date cannot be edited afterwards.</p>';
    if (perm.canDeliver && !readOnly) {
      h += '<div class="card">' +
        '<div class="field" style="max-width:220px"><label for="d-date">MADE ON</label>' +
        '<input id="d-date" type="date" value="' + todayStr() + '"></div>' +
        '<div id="d-rows"></div>' +
        '<button class="btn ghost sm" type="button" data-act="addrow2">+ ADD ANOTHER ITEM</button>' +
        '<div id="d-preview" style="margin-top:14px"></div>' +
        '<button class="btn pri" type="button" data-act="deliver" style="margin-top:14px">SAVE DELIVERY &amp; LOCK</button>' +
        "</div>";
    } else if (!readOnly) {
      h += '<div class="banner info">Only Dee\'s side can log deliveries. You can see every batch below.</div>';
    }
    var all = S.batches.slice().sort(function (a, b) { return a.at < b.at ? 1 : -1; });
    h += '<div class="subhead">ALL DELIVERIES (' + all.length + ")</div>";
    h += all.length ? rows(all, perm, false) : '<div class="empty">No deliveries logged yet.</div>';
    return h;
  }

  /* ---------- sales ---------- */
  function viewSell(perm) {
    var open = live().filter(function (b) { return remaining(b) > 0 && status(b) !== "expired"; });
    var h = '<h2 class="sec">Sales</h2>' +
      '<p class="sub">Tap what has sold. Entries are added to the batch and cannot be edited — log a correction as a new entry if you miscount.</p>';
    if (!perm.canSell) h += '<div class="banner info">Only the truck side can record sales.</div>';
    h += open.length ? rows(open, perm, true) :
      '<div class="empty">Nothing available to sell. Anything expired shows on Today.</div>';

    var log = [];
    live().forEach(function (b) {
      (b.sales || []).forEach(function (s) {
        log.push({ at: s.at, qty: s.qty, by: s.by, item: (item(b.itemId) || {}).name || "—" });
      });
    });
    log.sort(function (a, b) { return a.at < b.at ? 1 : -1; });
    if (log.length) {
      h += '<div class="subhead">RECENT ENTRIES</div><div class="tw"><table><thead><tr>' +
        "<th>WHEN</th><th>ITEM</th><th class=\"r\">QTY</th><th>BY</th></tr></thead><tbody>";
      log.slice(0, 25).forEach(function (r) {
        var dt = new Date(r.at);
        h += "<tr><td>" + esc(dt.toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })) +
          "</td><td>" + esc(r.item) + '</td><td class="r num">' + r.qty + "</td><td>" + esc(uname(r.by)) + "</td></tr>";
      });
      h += "</tbody></table></div>";
    }
    return h;
  }

  /* ---------- recipes ---------- */
  function viewRecipes(perm) {
    if (!perm.canDeliver) {
      return '<h2 class="sec">Recipes &amp; cost</h2>' +
        '<div class="banner info">Recipes are kept to Dee\'s side. The truck sees the cost totals on Money and on each delivery, not the ingredients behind them.</div>';
    }
    var editable = perm.canDeliver && !readOnly;
    var h = '<h2 class="sec">Recipes &amp; cost</h2>' +
      '<p class="sub">Cost is worked out per whole ' + esc(S.items[0] ? (S.items[0].batchWord || "batch") : "batch") +
      ', from supermarket pack prices — then divided by how many portions it cuts into. ' +
      'Numbers update as you type; nothing is saved until you press save.</p>';
    if (!editable) h += '<div class="banner info">Only Dee\'s side and admins can change recipes.</div>';

    S.items.forEach(function (it) {
      var ro = editable ? "" : " disabled";
      h += '<div class="card" data-recipe="' + it.id + '">';
      h += '<div class="recipe-h"><h3>' + esc(it.name) + "</h3>" +
        '<span class="pill ' + (costed(it) ? "p-fresh" : "p-today") + '">' +
        (costed(it) ? "COSTED" : "NEEDS RECIPE") + "</span></div>";

      h += '<div class="ing"><span><span class="lbl">INGREDIENT</span></span>' +
        '<span><span class="lbl">RECIPE QTY</span></span><span><span class="lbl">UNIT</span></span>' +
        '<span><span class="lbl">PACK PRICE</span></span><span><span class="lbl">PACK QTY</span></span>' +
        '<span><span class="lbl">COST USED</span></span><span></span></div>';
      (it.recipe || []).forEach(function (r, ix) {
        h += '<div class="ing" data-row="' + ix + '">' +
          '<input data-f="n" value="' + esc(r.n) + '" placeholder="ingredient"' + ro + ">" +
          '<input data-f="q" type="number" min="0" step="any" value="' + r.q + '"' + ro + ">" +
          '<input data-f="u" value="' + esc(r.u || "") + '" placeholder="g"' + ro + ">" +
          '<input data-f="pp" type="number" min="0" step="0.01" value="' + r.pp + '"' + ro + ">" +
          '<input data-f="pq" type="number" min="0" step="any" value="' + r.pq + '"' + ro + ">" +
          '<span class="out">0</span>' +
          (editable ? '<button class="x" type="button" data-delrow="' + it.id + ":" + ix + '" aria-label="Remove">×</button>' : "<span></span>") +
          "</div>";
      });
      if (!(it.recipe || []).length) h += '<p class="hint" style="margin:4px 0 10px">No ingredients yet.</p>';
      if (editable) h += '<button class="btn ghost sm" type="button" data-addrow="' + it.id + '">+ ADD INGREDIENT</button>';

      h += '<div class="grid2" style="margin-top:16px">' +
        '<div class="field"><label>PIECES PER ' + esc((it.batchWord || "batch").toUpperCase()) + '</label>' +
        '<input data-f="yieldPieces" type="number" min="0" step="any" value="' + (it.yieldPieces || 0) + '"' + ro + "></div>" +
        '<div class="field"><label>PIECES PER PORTION SOLD</label>' +
        '<input data-f="perPortion" type="number" min="1" step="any" value="' + (it.perPortion || 1) + '"' + ro + "></div>" +
        '<div class="field"><label>PACKAGING PER PORTION (' + cur() + ')</label>' +
        '<input data-f="packaging" type="number" min="0" step="0.01" value="' + (it.packaging || 0) + '"' + ro + "></div>" +
        '<div class="field"><label>SELLING PRICE (' + cur() + ')</label>' +
        '<input data-f="price" type="number" min="0" step="0.01" value="' + it.price + '"' + ro + "></div>" +
        '<div class="field"><label>CALL ONE BATCH A…</label>' +
        '<input data-f="batchWord" value="' + esc(it.batchWord || "batch") + '" placeholder="tray, cake"' + ro + "></div>" +
        "</div>";

      h += '<div class="costcard"><div class="grid">' +
        cc("batch", "BATCH COST") + cc("yield", "YIELD") + cc("ing", "INGREDIENT / UNIT") +
        cc("pack", "PACKAGING") + cc("price", "SELLS AT") + cc("profit", "GROSS PROFIT") + cc("margin", "MARGIN") +
        "</div></div>";
      h += '<p class="hint" style="margin-top:10px" data-spare></p>';
      h += '<p class="hint" style="margin-top:6px">Direct cost only — excludes labour, utilities, delivery and wastage.</p>';
      if (editable) h += '<div class="acts"><button class="btn dark sm" type="button" data-saverecipe="' + it.id + '">SAVE RECIPE</button></div>';
      h += "</div>";
    });
    return h;
  }
  function cc(k, label) {
    return '<div class="cc"><div class="k">' + label + '</div><div class="v num" data-cc="' + k + '">—</div></div>';
  }

  /* ---------- money ---------- */
  function viewMoney() {
    var t = totals(null);
    var pct = S.split.deesPct;
    var basis = S.split.basis === "revenue" ? t.revenue : t.profit;
    var deesCut = basis * (pct / 100), truckCut = basis * (1 - pct / 100);
    var h = '<h2 class="sec">Money</h2><p class="sub">Everything logged so far, using the price and cost locked onto each batch.</p>';
    h += '<div class="stats">' +
      stat("REVENUE", cur() + " " + money(t.revenue), t.unitsSold + " units sold", "good") +
      stat("COST", cur() + " " + money(t.cost), t.unitsOut + " units delivered", "") +
      stat("PROFIT", cur() + " " + money(t.profit), "revenue less cost", t.profit >= 0 ? "good" : "bad") +
      stat("WASTE", cur() + " " + money(t.waste), t.unitsWasted + " units expired unsold", t.waste > 0 ? "bad" : "") +
      "</div>";
    if (t.unknownCost) h += '<div class="banner warn"><b>' + t.unknownCost +
      " units have no cost recorded.</b> Profit and waste below are understated until those batches' items have an ingredient cost.</div>";

    h += '<div class="subhead">THE ' + pct + "/" + (100 - pct) + " SPLIT · ON " + (S.split.basis === "revenue" ? "REVENUE" : "PROFIT") + "</div>";
    h += '<div class="split">' +
      '<div class="sp d"><div class="k">DEE\'S TREATS</div><div class="v num">' + cur() + " " + money(deesCut) + "</div></div>" +
      '<div class="sp t"><div class="k">SMASH &amp; PASS</div><div class="v num">' + cur() + " " + money(truckCut) + "</div></div>" +
      "</div>";
    h += '<p class="hint" style="margin-top:10px">Split basis and percentage are set in Setup. Confirm with the other side which one your deal actually means — splitting revenue and splitting profit give very different numbers.</p>';

    h += '<div class="subhead">BY ITEM</div><div class="tw"><table><thead><tr><th>ITEM</th>' +
      '<th class="r">OUT</th><th class="r">SOLD</th><th class="r">WASTED</th><th class="r">REVENUE</th><th class="r">COST</th><th class="r">PROFIT</th>' +
      "</tr></thead><tbody>";
    S.items.forEach(function (it) {
      var o = 0, s = 0, w = 0, rev = 0, cost = 0, any = false;
      live().forEach(function (b) {
        if (b.itemId !== it.id) return;
        any = true;
        var sd = sold(b);
        o += b.qty; s += sd; rev += sd * (b.unitPrice || 0);
        if (b.unitCost != null) cost += b.qty * b.unitCost;
        if (status(b) === "expired") w += remaining(b);
      });
      if (!any) return;
      h += "<tr><td>" + esc(it.name) + '</td><td class="r num">' + o + '</td><td class="r num">' + s +
        '</td><td class="r num">' + w + '</td><td class="r num">' + money(rev) +
        '</td><td class="r num">' + money(cost) + '</td><td class="r num">' + money(rev - cost) + "</td></tr>";
    });
    h += "</tbody></table></div>";
    return h;
  }

  /* ---------- your own login ---------- */
  function viewAccount() {
    var h = '<h2 class="sec">Your login</h2>' +
      '<p class="sub">Signed in as <b>' + esc(me.name) + '</b> — username <b>' + esc(me.user || "—") +
      '</b>. Change your own PIN here; nobody else can see it.</p>';
    if (readOnly) return h + '<div class="banner info">This view is read-only, so your PIN cannot be changed from here.</div>';
    h += '<div class="card"><div class="grid2">' +
      '<div class="field"><label for="pw-old">CURRENT PIN</label>' +
      '<input id="pw-old" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••"></div>' +
      '<div class="field"><label for="pw-new">NEW PIN</label>' +
      '<input id="pw-new" type="password" inputmode="numeric" autocomplete="new-password" placeholder="4–8 digits"></div>' +
      '<div class="field"><label for="pw-two">REPEAT NEW PIN</label>' +
      '<input id="pw-two" type="password" inputmode="numeric" autocomplete="new-password" placeholder="••••"></div>' +
      "</div>" +
      '<button class="btn pri" type="button" data-act="changepin">CHANGE MY PIN</button>' +
      '<p class="hint" style="margin-top:12px">4 to 8 digits. If you forget it, an admin can set a new one for you in Setup.</p>' +
      "</div>";
    return h;
  }

  function changePin() {
    var oldEl = document.getElementById("pw-old"),
        newEl = document.getElementById("pw-new"),
        twoEl = document.getElementById("pw-two");
    var oldPin = (oldEl.value || "").trim(),
        newPin = (newEl.value || "").trim(),
        twoPin = (twoEl.value || "").trim();
    if (!oldPin || !newPin) { toast("Fill in your current PIN and the new one.", true); return; }
    if (!/^\d{4,8}$/.test(newPin)) { toast("New PIN must be 4–8 digits.", true); return; }
    if (newPin !== twoPin) { toast("The two new PINs do not match.", true); return; }
    if (newPin === oldPin) { toast("That is already your PIN.", true); return; }
    var uid = me.id;
    hash(oldPin).then(function (ho) {
      if (ho !== me.pin) { toast("Your current PIN is not right.", true); return; }
      return hash(newPin).then(function (hn) {
        save(function (n) {
          var t = n.team.filter(function (u) { return u.id === uid; })[0];
          t.pin = hn;
          var DEF = "d4165ae679b414636d9b7ff6fb6e1ee8b4824dfee69e3b2fc47fdfc259d38117";
          n.defaultPins = n.team.some(function (u) { return u.pin === DEF; });
        }, "PIN changed.");
      });
    });
  }

  /* ---------- setup ---------- */
  function viewSetup(perm) {
    if (!perm.canSetup) return '<div class="empty">Setup is admin only.</div>';
    var h = '<h2 class="sec">Setup</h2><p class="sub">Edit anything here. Changes apply to <em>future</em> deliveries only — batches already logged keep the price, cost and shelf life they were saved with.</p>';

    h += '<div class="subhead">ITEMS</div>';
    S.items.forEach(function (it) {
      h += '<div class="card" data-item="' + it.id + '"><div class="grid2">' +
        '<div class="field"><label>NAME</label><input data-f="name" value="' + esc(it.name) + '"></div>' +
        '<div class="field"><label>NOTE</label><input data-f="note" value="' + esc(it.note || "") + '" placeholder="4 pcs, weekends…"></div>' +
        '<div class="field"><label>SELL PRICE (' + cur() + ')</label><input data-f="price" type="number" min="0" step="0.01" value="' + it.price + '"></div>' +
        '<div class="field"><label>SHELF LIFE (DAYS)</label><input data-f="shelf" type="number" min="0" step="1" value="' + it.shelf + '"></div>' +
        '<div class="field"><label>ON THE MENU</label><select data-f="active"><option value="1"' + (it.active ? " selected" : "") + ">Yes</option><option value=\"0\"" + (!it.active ? " selected" : "") + ">No</option></select></div>" +
        '</div><div class="acts"><button class="btn dark sm" type="button" data-saveitem="' + it.id + '">SAVE ITEM</button>' +
        '<button class="btn danger sm" type="button" data-delitem="' + it.id + '">REMOVE</button></div></div>';
    });
    h += '<button class="btn ghost" type="button" data-act="additem">+ ADD ITEM</button>';

    h += '<div class="subhead">TEAM</div>';
    S.team.forEach(function (u) {
      h += '<div class="card" data-user="' + u.id + '"><div class="grid2">' +
        '<div class="field"><label>NAME</label><input data-f="name" value="' + esc(u.name) + '"></div>' +
        '<div class="field"><label>USERNAME (THEY TYPE THIS)</label><input data-f="user" value="' + esc(u.user || "") +
        '" autocapitalize="none" autocorrect="off" spellcheck="false"></div>' +
        '<div class="field"><label>SIDE</label><select data-f="role">' +
        '<option value="dees"' + (u.role === "dees" ? " selected" : "") + ">Dee's — logs deliveries</option>" +
        '<option value="truck"' + (u.role === "truck" ? " selected" : "") + ">Truck — logs sales</option>" +
        '<option value="admin"' + (u.role === "admin" ? " selected" : "") + ">Admin — everything</option>" +
        "</select></div>" +
        '<div class="field"><label>NEW PIN (BLANK = KEEP)</label><input data-f="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="••••"></div>' +
        '</div><div class="acts"><button class="btn dark sm" type="button" data-saveuser="' + u.id + '">SAVE PERSON</button>' +
        (S.team.length > 1 ? '<button class="btn danger sm" type="button" data-deluser="' + u.id + '">REMOVE</button>' : "") +
        "</div></div>";
    });
    h += '<button class="btn ghost" type="button" data-act="adduser">+ ADD PERSON</button>';

    h += '<div class="subhead">THE SPLIT</div><div class="card"><div class="grid2">' +
      '<div class="field"><label for="sp-pct">DEE\'S SHARE (%)</label><input id="sp-pct" type="number" min="0" max="100" step="1" value="' + S.split.deesPct + '"></div>' +
      '<div class="field"><label for="sp-basis">SPLIT ON</label><select id="sp-basis">' +
      '<option value="profit"' + (S.split.basis === "profit" ? " selected" : "") + ">Profit (after cost)</option>" +
      '<option value="revenue"' + (S.split.basis === "revenue" ? " selected" : "") + ">Revenue (before cost)</option>" +
      "</select></div>" +
      '<div class="field"><label for="sp-cur">CURRENCY</label><input id="sp-cur" value="' + cur() + '"></div>' +
      "</div>" +
      '<button class="btn dark sm" type="button" data-act="savesplit">SAVE</button></div>';

    var oldOnes = S.batches.filter(function (b) {
      return daysBetween(todayStr(), expiresOn(b)) < -30;
    }).length;
    h += '<div class="subhead">HOUSEKEEPING</div><div class="card">' +
      "<p style=\"margin:0 0 12px;font-size:14.5px;color:var(--ink-2)\">The whole board is saved inside this page, so it should not grow forever. " +
      (oldOnes ? "<b>" + oldOnes + " batches</b> expired more than 30 days ago." : "Nothing is older than 30 days yet.") + "</p>" +
      '<button class="btn danger sm" type="button" data-act="archive"' + (oldOnes ? "" : " disabled") + ">CLEAR BATCHES OVER 30 DAYS OLD</button></div>";
    return h;
  }

  /* ============ actions ============ */
  function wire() {
    app.querySelectorAll("[data-tab]").forEach(function (b) {
      b.onclick = function () { setTab(b.getAttribute("data-tab")); };
    });
    app.querySelectorAll("[data-sell]").forEach(function (b) {
      b.onclick = function () { logSale(b.getAttribute("data-sell"), +b.getAttribute("data-n")); };
    });
    app.querySelectorAll("[data-sellmany]").forEach(function (b) {
      b.onclick = function () {
        var bid = b.getAttribute("data-sellmany");
        var bt = S.batches.filter(function (x) { return x.id === bid; })[0];
        ask({ title: "How many sold?", ok: "LOG SALE",
              input: { label: "PORTIONS (UP TO " + remaining(bt) + ")", value: 1, min: 1, max: remaining(bt) } })
          .then(function (n) { if (n != null) logSale(bid, n); });
      };
    });
    app.querySelectorAll("[data-saveitem]").forEach(function (b) {
      b.onclick = function () { saveItem(b.getAttribute("data-saveitem")); };
    });
    app.querySelectorAll("[data-delitem]").forEach(function (b) {
      b.onclick = function () {
        var iid = b.getAttribute("data-delitem");
        var used = S.batches.some(function (x) { return x.itemId === iid; });
        if (used) { toast("This item has deliveries against it — set it to 'not on the menu' instead.", true); return; }
        ask({ title: "Remove this item?", body: "It disappears from the menu and from future deliveries.",
              ok: "REMOVE", danger: true }).then(function (go) {
          if (!go) return;
          save(function (n) { n.items = n.items.filter(function (i) { return i.id !== iid; }); }, "Item removed.");
        });
      };
    });
    app.querySelectorAll("[data-saveuser]").forEach(function (b) {
      b.onclick = function () { saveUser(b.getAttribute("data-saveuser")); };
    });
    app.querySelectorAll("[data-deluser]").forEach(function (b) {
      b.onclick = function () {
        var uid = b.getAttribute("data-deluser");
        if (uid === me.id) { toast("You cannot remove yourself.", true); return; }
        ask({ title: "Remove this person?", body: "They lose their login. Everything they already logged stays on the board.",
              ok: "REMOVE", danger: true }).then(function (go) {
          if (!go) return;
          save(function (n) { n.team = n.team.filter(function (u) { return u.id !== uid; }); }, "Person removed.");
        });
      };
    });
    var acts = {
      signout: signOut,
      login: doLogin,
      changepin: changePin,
      addrow2: addDeliveryRow,
      deliver: addDelivery,
      additem: function () {
        save(function (n) {
          n.items.push({ id: id("i"), name: "New item", note: "", price: 0, shelf: n.defaultShelf || 2,
            active: true, batchWord: "batch", yieldPieces: 0, perPortion: 1, packaging: 0.25, recipe: [] });
        }, "Item added.");
      },
      adduser: function () {
        save(function (n) {
          var nid = id("u");
          n.team.push({ id: nid, name: "New person", user: nid, role: "truck",
            pin: "d4165ae679b414636d9b7ff6fb6e1ee8b4824dfee69e3b2fc47fdfc259d38117" });
          n.defaultPins = true;
        }, "Person added with PIN 1234 — change it.");
      },
      savesplit: function () {
        var pct = parseFloat(document.getElementById("sp-pct").value);
        var basis = document.getElementById("sp-basis").value;
        var c = document.getElementById("sp-cur").value.trim().slice(0, 6) || "AED";
        if (!(pct >= 0 && pct <= 100)) { toast("Share must be between 0 and 100.", true); return; }
        save(function (n) { n.split = { deesPct: pct, basis: basis }; n.currency = c; }, "Split saved.");
      },
      archive: function () {
        ask({ title: "Clear old batches?",
              body: "Batches that expired over 30 days ago are deleted permanently, and their totals go with them.",
              ok: "CLEAR", danger: true }).then(function (go) {
          if (!go) return;
          save(function (n) {
            n.batches = n.batches.filter(function (b) { return daysBetween(todayStr(), addDays(b.madeOn, b.shelf)) >= -30; });
          }, "Old batches cleared.");
        });
      }
    };
    app.querySelectorAll("[data-act]").forEach(function (b) {
      var fn = acts[b.getAttribute("data-act")];
      if (fn) b.onclick = fn;
      if (busy) b.disabled = true;
    });
    if (busy) app.querySelectorAll(".btn").forEach(function (b) { b.disabled = true; });

    var rowsBox = document.getElementById("d-rows");
    if (rowsBox) {
      if (!rowsBox.children.length) addDeliveryRow();
      refreshPreview();
    }

    app.querySelectorAll("[data-saverecipe]").forEach(function (b) {
      b.onclick = function () { saveRecipe(b.getAttribute("data-saverecipe")); };
    });
    app.querySelectorAll("[data-addrow]").forEach(function (b) {
      b.onclick = function () {
        var iid = b.getAttribute("data-addrow");
        save(function (n) {
          var t = n.items.filter(function (i) { return i.id === iid; })[0];
          t.recipe = t.recipe || [];
          t.recipe.push({ n: "", q: 0, u: "g", pp: 0, pq: 100 });
        }, "Ingredient row added.");
      };
    });
    app.querySelectorAll("[data-delrow]").forEach(function (b) {
      b.onclick = function () {
        var p = b.getAttribute("data-delrow").split(":");
        save(function (n) {
          var t = n.items.filter(function (i) { return i.id === p[0]; })[0];
          t.recipe.splice(+p[1], 1);
        }, "Ingredient removed.");
      };
    });
    app.querySelectorAll("[data-recipe]").forEach(function (card) {
      var recalc = function () { liveCost(card); };
      card.querySelectorAll("input").forEach(function (el) { el.oninput = recalc; });
      recalc();
    });
  }

  /* live recalculation inside a recipe card, no save */
  function liveCost(card) {
    var g = function (el) { var v = parseFloat(el.value); return isNaN(v) ? 0 : v; };
    var total = 0;
    card.querySelectorAll("[data-row]").forEach(function (row) {
      var q = g(row.querySelector('[data-f="q"]')),
          pp = g(row.querySelector('[data-f="pp"]')),
          pq = g(row.querySelector('[data-f="pq"]'));
      var c = pq > 0 ? (q / pq) * pp : 0;
      total += c;
      row.querySelector(".out").textContent = money(c);
    });
    var pieces = g(card.querySelector('[data-f="yieldPieces"]')),
        per = g(card.querySelector('[data-f="perPortion"]')),
        pack = g(card.querySelector('[data-f="packaging"]')),
        price = g(card.querySelector('[data-f="price"]'));
    var portions = per > 0 ? pieces / per : 0;
    var ing = portions > 0 ? total / portions : null;
    var unit = ing == null ? null : ing + pack;
    var profit = unit == null ? null : price - unit;
    var margin = profit == null || !price ? null : (profit / price) * 100;
    var set = function (k, v, cls) {
      var el = card.querySelector('[data-cc="' + k + '"]');
      if (!el) return;
      el.textContent = v;
      var box = el.closest(".cc");
      box.classList.remove("good", "bad", "hi");
      if (cls) box.classList.add(cls);
    };
    set("batch", money(total), "hi");
    var whole = per > 0 ? Math.floor(pieces / per) : 0;
    var spare = per > 0 ? pieces - whole * per : 0;
    portions = whole;
    ing = portions > 0 ? total / portions : null;
    unit = ing == null ? null : ing + pack;
    profit = unit == null ? null : price - unit;
    margin = profit == null || !price ? null : (profit / price) * 100;
    set("yield", portions ? (pieces + " pcs / " + portions + " portions") : "set yield", portions ? "" : "bad");
    var note = card.querySelector("[data-spare]");
    if (note) note.innerHTML = portions
      ? (spare
          ? "<b>" + spare + " piece" + (spare > 1 ? "s" : "") + " left over per batch</b> — they are not sellable as a portion, so their cost sits on the " + portions + " portions that are."
          : pieces + " pcs \u00f7 " + per + " divides evenly — nothing wasted.")
      : "";
    set("ing", ing == null ? "—" : money(ing));
    set("pack", money(pack));
    set("price", money(price));
    set("profit", profit == null ? "—" : money(profit), profit == null ? "" : profit >= 0 ? "good" : "bad");
    set("margin", margin == null ? "—" : (Math.round(margin * 10) / 10) + "%", margin == null ? "" : margin >= 0 ? "good" : "bad");
  }

  function logSale(bid, n) {
    var b = S.batches.filter(function (x) { return x.id === bid; })[0];
    if (!b) return;
    if (n > remaining(b)) { toast("Only " + remaining(b) + " left in that batch.", true); return; }
    save(function (nx) {
      var t = nx.batches.filter(function (x) { return x.id === bid; })[0];
      t.sales = t.sales || [];
      t.sales.push({ qty: n, by: me.id, at: new Date().toISOString() });
    }, n + " sold — logged.");
  }

  function itemOptions(sel) {
    return S.items.filter(function (i) { return i.active; }).map(function (i) {
      return '<option value="' + i.id + '"' + (i.id === sel ? " selected" : "") + ">" +
        esc(i.name) + (i.note ? " (" + esc(i.note) + ")" : "") + "</option>";
    }).join("");
  }

  function addDeliveryRow() {
    var box = document.getElementById("d-rows");
    if (!box) return;
    var row = document.createElement("div");
    row.className = "drow";
    row.innerHTML = '<select data-d="item">' + itemOptions(null) + "</select>" +
      '<input data-d="n" type="number" min="1" step="1" value="1" aria-label="How many">' +
      '<span class="w" data-d="word"></span>' +
      '<button class="x" type="button" data-d="rm" aria-label="Remove this line">&times;</button>';
    box.appendChild(row);
    row.querySelector('[data-d="rm"]').onclick = function () {
      row.remove();
      if (!box.children.length) addDeliveryRow();
      refreshPreview();
    };
    row.querySelectorAll("select,input").forEach(function (el) {
      el.oninput = refreshPreview; el.onchange = refreshPreview;
    });
    refreshPreview();
  }

  /* read the form into a list of lines */
  function readDeliveryRows() {
    var out = [];
    var box = document.getElementById("d-rows");
    if (!box) return out;
    Array.prototype.forEach.call(box.children, function (row) {
      var it = item(row.querySelector('[data-d="item"]').value);
      var n = parseInt(row.querySelector('[data-d="n"]').value, 10);
      out.push({ it: it, n: n > 0 ? n : 0, row: row });
    });
    return out;
  }

  function refreshPreview() {
    var box = document.getElementById("d-rows"), pv = document.getElementById("d-preview");
    if (!box || !pv) return;
    var lines = readDeliveryRows();
    var madeOn = (document.getElementById("d-date") || {}).value || todayStr();
    var only = box.children.length < 2;
    var html = "", total = 0, units = 0, anyUncosted = false;
    lines.forEach(function (L) {
      var w = L.row.querySelector('[data-d="word"]');
      if (L.it) w.textContent = (L.it.batchWord || "batch") + (L.n === 1 ? "" : "s");
      L.row.querySelector('[data-d="rm"]').disabled = only;
      if (!L.it || !L.n) return;
      if (!costed(L.it)) {
        anyUncosted = true;
        html += '<div class="dline"><span>' + esc(L.it.name) + " — no recipe costed</span><span>no cost</span></div>";
        return;
      }
      var u = L.n * portionsPer(L.it), c = u * unitCostOf(L.it);
      units += u; total += c;
      html += '<div class="dline"><span>' + L.n + " " + esc(L.it.batchWord || "batch") + (L.n > 1 ? "s" : "") +
        " " + esc(L.it.name) + " = <b>" + u + " portions</b>, expires " + niceDate(addDays(madeOn, L.it.shelf)) +
        "</span><span class=\"num\">" + cur() + " " + money(c) + "</span></div>";
    });
    if (html) html += '<div class="dline"><span>' + units + " portions in total</span><span class=\"num\">" +
      cur() + " " + money(total) + "</span></div>";
    if (anyUncosted) html += '<p class="hint" style="margin-top:8px">Items without a recipe go in with no cost recorded.</p>';
    pv.innerHTML = html;
  }

  function addDelivery() {
    var madeOn = document.getElementById("d-date").value || todayStr();
    var lines = readDeliveryRows().filter(function (L) { return L.it && L.n > 0; });
    if (!lines.length) { toast("Add at least one item with a quantity.", true); return; }
    var summary = [], uncosted = [];
    lines.forEach(function (L) {
      var w = L.it.batchWord || "batch";
      if (costed(L.it)) {
        summary.push(L.n + " " + w + (L.n > 1 ? "s" : "") + " " + L.it.name +
          " = " + (L.n * portionsPer(L.it)) + " portions");
      } else {
        summary.push(L.n + " " + L.it.name + " (no cost)");
        uncosted.push(L.it.name);
      }
    });
    var msg = summary.join("\n") + "\n\nQuantity, cost and date cannot be changed after this.";
    if (uncosted.length) msg = "No recipe costed for: " + uncosted.join(", ") + " — they go in with no cost.\n\n" + msg;
    ask({ title: "Lock this delivery?", body: msg, ok: "SAVE & LOCK" }).then(function (go) {
      if (!go) return;
      doSaveDelivery(lines, madeOn);
    });
  }

  function doSaveDelivery(lines, madeOn) {
    var at = new Date().toISOString();
    save(function (nx) {
      var drop = id("d");
      lines.forEach(function (L) {
        var per = portionsPer(L.it);
        nx.batches.push({
          id: id("b"), drop: drop, itemId: L.it.id,
          qty: costed(L.it) ? L.n * per : L.n,
          unitCost: unitCostOf(L.it), unitPrice: L.it.price,
          batches: L.n, batchWord: L.it.batchWord || "batch",
          shelf: L.it.shelf, madeOn: madeOn,
          by: me.id, at: at, sales: []
        });
      });
    }, lines.length > 1 ? lines.length + " items locked in." : "Delivery locked in.");
  }

  function saveRecipe(iid) {
    var card = app.querySelector('[data-recipe="' + iid + '"]');
    var val = function (el) { var v = parseFloat(el.value); return isNaN(v) ? 0 : v; };
    var rows = [];
    var bad = false;
    card.querySelectorAll("[data-row]").forEach(function (row) {
      var nm = row.querySelector('[data-f="n"]').value.trim();
      var q = val(row.querySelector('[data-f="q"]'));
      var pp = val(row.querySelector('[data-f="pp"]'));
      var pq = val(row.querySelector('[data-f="pq"]'));
      var u = row.querySelector('[data-f="u"]').value.trim();
      if (!nm) return;
      if (pq <= 0) { bad = true; return; }
      rows.push({ n: nm, q: q, u: u, pp: pp, pq: pq });
    });
    if (bad) { toast("Pack quantity must be above zero — that is what the price divides by.", true); return; }
    var pieces = val(card.querySelector('[data-f="yieldPieces"]'));
    var per = val(card.querySelector('[data-f="perPortion"]'));
    var pack = val(card.querySelector('[data-f="packaging"]'));
    var price = val(card.querySelector('[data-f="price"]'));
    var word = card.querySelector('[data-f="batchWord"]').value.trim() || "batch";
    if (per <= 0) { toast("Pieces per portion must be above zero.", true); return; }
    if (pieces > 0 && per > pieces) { toast("A portion cannot be more pieces than the whole batch makes.", true); return; }
    save(function (nx) {
      var t = nx.items.filter(function (i) { return i.id === iid; })[0];
      t.recipe = rows; t.yieldPieces = pieces; t.perPortion = per;
      t.packaging = pack; t.price = price; t.batchWord = word;
    }, "Recipe saved.");
  }

  function saveItem(iid) {
    var card = app.querySelector('[data-item="' + iid + '"]');
    var g = function (f) { return card.querySelector('[data-f="' + f + '"]').value; };
    var price = parseFloat(g("price")), shelf = parseInt(g("shelf"), 10);
    if (!g("name").trim()) { toast("Item needs a name.", true); return; }
    if (isNaN(price) || price < 0) { toast("Price must be zero or more.", true); return; }
    if (isNaN(shelf) || shelf < 0) { toast("Shelf life must be zero or more days.", true); return; }
    save(function (n) {
      var t = n.items.filter(function (i) { return i.id === iid; })[0];
      t.name = g("name").trim(); t.note = g("note").trim();
      t.price = price; t.shelf = shelf; t.active = g("active") === "1";
    }, "Item saved.");
  }

  function saveUser(uid) {
    var card = app.querySelector('[data-user="' + uid + '"]');
    var g = function (f) { return card.querySelector('[data-f="' + f + '"]').value; };
    var name = g("name").trim(), role = g("role"), pin = g("pin").trim();
    var handle = g("user").trim().toLowerCase();
    if (!name) { toast("Person needs a name.", true); return; }
    if (!/^[a-z0-9._-]{2,20}$/.test(handle)) {
      toast("Username: 2–20 characters, lowercase letters, digits, dot, dash or underscore.", true); return;
    }
    if (S.team.some(function (t) { return t.id !== uid && (t.user || "").toLowerCase() === handle; })) {
      toast("That username is already taken.", true); return;
    }
    if (pin && !/^\d{4,8}$/.test(pin)) { toast("PIN must be 4–8 digits.", true); return; }
    var apply = function (h) {
      save(function (n) {
        var t = n.team.filter(function (u) { return u.id === uid; })[0];
        t.name = name; t.role = role; t.user = handle;
        if (h) t.pin = h;
        var DEF = "d4165ae679b414636d9b7ff6fb6e1ee8b4824dfee69e3b2fc47fdfc259d38117";
        n.defaultPins = n.team.some(function (u) { return u.pin === DEF; });
      }, "Person saved.");
    };
    if (pin) hash(pin).then(apply); else apply(null);
  }

  /* ============ boot ============ */
  loadSession();
  render();
  claude.use("artifact").then(function (a) {
    artifact = a;
    if (!a) { readOnly = true; }
    render();
  }).catch(function () { readOnly = true; render(); });
})();
</script>
