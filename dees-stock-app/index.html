<title>Dee's Stock</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Cairo:wght@400;600;700;900&display=swap">
<style id="app-style">
  :root{
    --brown:#4A2C2A; --cream:#FAF3E7; --gold:#C99334; --char:#1C1917;
    --butter:#FFD21C; --ketchup:#F02820; --paper:#FFF9EE;
    --ok:#2F7D4F; --warn:#C2650B; --bad:#C0271C;
    --ink:#2B1E1A; --ink-2:#6B584D; --ink-3:#9A8A7C;
    --line:#E6DBC8; --card:#FFFFFF; --shade:#F5EDDD;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--cream);color:var(--ink);
    font-family:Cairo,'Segoe UI',system-ui,sans-serif;font-size:16px;line-height:1.55}
  img{max-width:100%}
  [hidden]{display:none!important}
  button{font:inherit;cursor:pointer}
  input,select{font:inherit;color:inherit}
  .num{font-variant-numeric:tabular-nums}
  .disp{font-family:'Baloo 2',Cairo,sans-serif;font-weight:800}

  .wrap{max-width:880px;margin:0 auto;padding:0 16px}

  /* ---------- top bar ---------- */
  .bar{background:var(--paper);border-bottom:1px solid var(--line);padding:22px 0 16px}
  .bar .wrap{display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center}
  .logo{width:126px;height:51px;flex-shrink:0;

  .brandline{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:23px;line-height:1;
    color:var(--brown);letter-spacing:.01em}
  .who{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:700;color:var(--ink-2);
    flex-wrap:wrap;justify-content:center;margin-top:2px}
  .avatar{width:28px;height:28px;border-radius:50%;background:var(--gold);color:#2B1E1A;
    display:grid;place-items:center;font-weight:900;font-size:11px}
  .out{background:none;border:1.5px solid var(--line);color:var(--ink-3);border-radius:999px;
    padding:5px 11px;font-size:11px;font-weight:900;letter-spacing:.08em}
  .out:hover{border-color:var(--brown);color:var(--brown)}

  /* ---------- tabs ---------- */
  .tabs{background:var(--char);position:sticky;top:0;z-index:49;
    overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs .wrap{display:flex;gap:2px;padding:0 12px}
  .tab{background:none;border:0;color:#8C8279;padding:13px 14px;font-size:13px;font-weight:900;
    letter-spacing:.06em;white-space:nowrap;border-bottom:3px solid transparent;min-height:46px}
  .tab[aria-current="true"]{color:var(--butter);border-bottom-color:var(--butter)}
  .tab:focus-visible{outline:2px solid var(--butter);outline-offset:-4px}
  .tab .dot{display:inline-block;min-width:17px;height:17px;line-height:17px;border-radius:999px;
    background:var(--ketchup);color:#fff;font-size:10px;margin-left:6px;padding:0 4px}

  main{padding:20px 0 60px}
  h2.sec{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:22px;margin:0 0 4px}
  p.sub{margin:0 0 18px;color:var(--ink-2);font-size:15px}

  /* ---------- cards & banners ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
  .banner{border-radius:12px;padding:14px 16px;margin-bottom:14px;font-size:14.5px;line-height:1.5}
  .banner b{font-weight:900}
  .banner.warn{background:#FDF1DC;border:1px solid #EBC98A;color:#6A4708}
  .banner.bad{background:#FCE9E7;border:1px solid #F0B6B0;color:#7C1E16}
  .banner.info{background:var(--shade);border:1px solid var(--line);color:var(--ink-2)}

  /* ---------- stats ---------- */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .stat .k{font-size:11px;font-weight:900;letter-spacing:.14em;color:var(--ink-3)}
  .stat .v{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:26px;line-height:1.15;margin-top:4px}
  .stat .n{font-size:12.5px;color:var(--ink-2);margin-top:2px}
  .stat.good .v{color:var(--ok)} .stat.bad .v{color:var(--bad)} .stat.warn .v{color:var(--warn)}

  /* ---------- batch rows ---------- */
  .rows{display:flex;flex-direction:column;gap:10px}
  .row{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;
    display:grid;grid-template-columns:6px 1fr;align-items:stretch}
  .row .stripe{background:var(--line)}
  .row.s-fresh .stripe{background:var(--ok)}
  .row.s-soon .stripe{background:var(--warn)}
  .row.s-today .stripe{background:var(--ketchup)}
  .row.s-expired .stripe{background:var(--bad)}
  .row.s-done .stripe{background:var(--ink-3)}
  .row.s-void .stripe{background:var(--ink-3)}
  .row .in{padding:14px 16px;min-width:0}
  .rt{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .rt .nm{font-weight:900;font-size:17px}
  .rt .qty{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:17px;color:var(--brown)}
  .rt .unit{font-size:12.5px;font-weight:900;letter-spacing:.06em;color:var(--ink-3);text-transform:uppercase}
  .meta{font-size:13px;color:var(--ink-2);margin-top:4px}
  .meta b{color:var(--ink);font-weight:700}
  .pill{display:inline-block;font-size:10.5px;font-weight:900;letter-spacing:.07em;
    padding:3px 9px;border-radius:999px;vertical-align:middle}
  .p-fresh{background:#E4F1E8;color:#1F5D39}
  .p-soon{background:#FBEBD3;color:#8A4A06}
  .p-today{background:#FDE3E0;color:#93221A}
  .p-expired{background:var(--bad);color:#fff}
  .p-done{background:var(--shade);color:var(--ink-2)}
  .p-void{background:var(--shade);color:var(--ink-3)}
  .p-lock{background:var(--char);color:var(--butter)}

  .bar-track{height:7px;border-radius:4px;background:var(--shade);margin-top:10px;overflow:hidden}
  .bar-fill{height:100%;background:var(--gold);border-radius:4px}

  .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

  /* ---------- buttons ---------- */
  .btn{border:0;border-radius:10px;padding:11px 16px;font-size:14px;font-weight:900;
    min-height:44px;letter-spacing:.02em}
  .btn:focus-visible{outline:2px solid var(--char);outline-offset:2px}
  .btn.pri{background:var(--butter);color:var(--char)}
  .btn.pri:hover{background:#F0C316}
  .btn.dark{background:var(--char);color:var(--paper)}
  .btn.dark:hover{background:#332C28}
  .btn.ghost{background:transparent;color:var(--ink-2);border:1.5px solid var(--line)}
  .btn.ghost:hover{border-color:var(--ink-3);color:var(--ink)}
  .btn.danger{background:transparent;color:var(--bad);border:1.5px solid #F0B6B0}
  .btn.danger:hover{background:#FCE9E7}
  .btn.sm{padding:8px 12px;font-size:13px;min-height:38px}
  .btn:disabled{opacity:.45;cursor:not-allowed}

  /* ---------- forms ---------- */
  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
  .field label{font-size:12px;font-weight:900;letter-spacing:.1em;color:var(--ink-3)}
  .field input,.field select{border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;
    background:#fff;min-height:44px;width:100%}
  .field input:focus,.field select:focus{outline:2px solid var(--gold);outline-offset:-1px;border-color:var(--gold)}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 12px}
  .hint{font-size:12.5px;color:var(--ink-3)}

  /* ---------- table ---------- */
  .tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
  table{border-collapse:collapse;width:100%;min-width:520px}
  th,td{text-align:left;padding:11px 13px;border-bottom:1px solid var(--line);font-size:14.5px}
  th{font-size:11px;font-weight:900;letter-spacing:.1em;color:var(--ink-3);background:var(--shade)}
  tr:last-child td{border-bottom:0}
  td.r,th.r{text-align:right}

  /* ---------- lock screen ---------- */
  .lock{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--char)}
  .lockbox{background:var(--card);border-radius:18px;padding:30px 26px;width:100%;max-width:390px}
  .lockbox .logo{margin:0 auto 14px}
  .lockbox h1{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:26px;margin:0 0 4px;text-align:center}
  .lockbox p{margin:0 0 22px;color:var(--ink-2);font-size:14.5px;text-align:center}
  .err{color:var(--bad);font-size:13.5px;font-weight:700;margin-top:8px}

  /* ---------- dialog (native confirm/prompt are blocked in the sandbox) ---------- */
  .modal{position:fixed;inset:0;background:rgba(28,25,23,.6);display:grid;place-items:center;
    z-index:300;padding:18px}

  .calc{margin-top:18px;border-top:1px solid #6B4A42;padding-top:14px}

  .crow .num,.erow .num{white-space:nowrap}
  .crow b{color:var(--cream);font-weight:900}
  .crow.tot{border-top:1px solid #6B4A42;margin-top:6px;padding-top:11px;font-size:15px;color:var(--cream);font-weight:900}

  /* ---------- misc ---------- */
  .empty{text-align:center;padding:34px 20px;color:var(--ink-3);font-size:15px}

    font-size:14px;font-weight:700;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:90vw}

  .split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .sp{border-radius:12px;padding:16px;text-align:center}

  .sp.t{background:var(--butter);color:var(--char)}
  .sp .k{font-size:11px;font-weight:900;letter-spacing:.12em;opacity:.8}
  .sp .v{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:25px;margin-top:3px}

  /* ---------- what each partner makes ---------- */
  .earn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:600px){.earn{grid-template-columns:1fr}}
  .ecard{border-radius:14px;padding:17px 16px 15px}
  .ecard.d{background:var(--brown);color:var(--cream)}
  .ecard.t{background:var(--butter);color:var(--char)}
  .ecard .who3{font-size:11px;font-weight:900;letter-spacing:.12em;opacity:.72}

  .ecard.d .make{color:var(--gold)}
  .ecard .lab{font-size:12.5px;font-weight:700;opacity:.72;margin-bottom:13px}
  .erow{display:flex;justify-content:space-between;gap:14px;padding:5px 0;font-size:13.5px;opacity:.86}
  .erow.top{margin-top:6px;padding-top:10px;opacity:1;font-weight:900;font-size:14.5px}

  /* ============ helpers ============ */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {

    return v.toLocaleString("en-US", { minimumFractionDigits: v % 1 ? 2 : 0, maximumFractionDigits: 2 });
  }
  function cur() { return esc(S.currency || "AED"); }
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function addDays(ds, n) {
    var p = ds.split("-");
    var d = new Date(+p[0], +p[1] - 1, +p[2]);

  }

    return Math.round((db - da) / 86400000);

  function niceDate(ds) {

  function plural(w) {

    if (/[^aeiou]y$/i.test(w)) return w.slice(0, -1) + "ies";

    var data = new TextEncoder().encode("deeserts:" + pin);
    return crypto.subtle.digest("SHA-256", data).then(function (b) {
      return Array.prototype.map.call(new Uint8Array(b), function (x) {
        return x.toString(16).padStart(2, "0");
      }).join("");
    });
  }

  /* ============ recipe costing ============
     Costed per BATCH (one cake / tray), from supermarket pack prices.
     line cost = recipe qty / pack qty x pack price
     portions  = pieces per batch / pieces per portion
     unit cost = batch cost / portions + packaging                        */
  function lineCost(r) {
    var q = +r.q, pq = +r.pq, pp = +r.pp;
    if (!(pq > 0) || isNaN(q) || isNaN(pp)) return 0;
    return (q / pq) * pp;
  }
  function batchCost(it) {
    return (it.recipe || []).reduce(function (a, r) { return a + lineCost(r); }, 0);
  }
  function portionsPer(it) {
    var p = +it.perPortion || 1, y = +it.yieldPieces || 0;
    if (!(y > 0) || !(p > 0)) return 0;
    return Math.floor(y / p);
  }
  function leftoverPcs(it) {
    var p = +it.perPortion || 1, y = +it.yieldPieces || 0;
    if (!(y > 0) || !(p > 0)) return 0;
    return y - Math.floor(y / p) * p;
  }
  function costed(it) { return (it.recipe || []).length > 0 && portionsPer(it) > 0; }
  function unitCostOf(it) {
    if (!costed(it)) return null;
    return batchCost(it) / portionsPer(it) + (+it.packaging || 0);
  }

  /* ============ batch maths ============ */
  function sold(b) {
    var t = 0;
    for (var i = 0; i < (b.sales || []).length; i++) t += b.sales[i].qty;
    return t;
  }
  function remaining(b) { return b.qty - sold(b); }
  function expiresOn(b) { return addDays(b.madeOn, b.shelf); }
  function status(b) {
    if (b.voided) return "void";
    var left = remaining(b);
    if (left <= 0) return "done";
    var d = daysBetween(todayStr(), expiresOn(b));
    if (d < 0) return "expired";
    if (d === 0) return "today";
    if (d === 1) return "soon";
    return "fresh";
  }
  var STATUS_LABEL = {
    fresh: "IN DATE", soon: "EXPIRES TOMORROW", today: "LAST DAY",
    expired: "EXPIRED", done: "SOLD OUT", "void": "VOIDED"
  };
  function live() {
    return S.batches.filter(function (b) { return !b.voided; });
  }

  /* ============ where a sale came from ============
     The window, or one of the delivery apps. Whatever a sale was logged
     under is stamped on it, so renaming a channel later never rewrites
     what already happened. */
  function channels() {
    var c = S.channels;
    return (c && c.length) ? c : ["Window", "Delivery app"];
  }
  /* A sale is stamped with the day it happened, not the moment it was typed:
     the board is often filled in after the fact, and the day-by-day split
     is only honest if the sale lands on the right day. */
  function saleDate() {
    var v = "";
    try { v = sessionStorage.getItem("deeserts.sdate") || ""; } catch (e) {}
    return /^\d{4}-\d{2}-\d{2}$/.test(v) ? v : todayStr();
  }
  function setSaleDate(v) {
    try {
      if (/^\d{4}-\d{2}-\d{2}$/.test(v)) sessionStorage.setItem("deeserts.sdate", v);
      else sessionStorage.removeItem("deeserts.sdate");
    } catch (e) {}
    render();
  }
  function saleOn(s) { return s.on || (s.at || "").slice(0, 10); }

  function curChannel() {
    var list = channels(), v = "";
    try { v = sessionStorage.getItem("deeserts.ch") || ""; } catch (e) {}
    return list.indexOf(v) >= 0 ? v : list[0];
  }
  function setChannel(v) {
    try { sessionStorage.setItem("deeserts.ch", v); } catch (e) {}
    render();
  }
  function byChannel() {
    var map = {}, order = channels().slice();
    live().forEach(function (b) {
      (b.sales || []).forEach(function (s) {
        var k = s.ch || order[0];
        if (!map[k]) map[k] = { units: 0, revenue: 0 };
        map[k].units += s.qty;
        map[k].revenue += s.qty * (b.unitPrice || 0);
      });
    });
    Object.keys(map).forEach(function (k) { if (order.indexOf(k) < 0) order.push(k); });
    return { map: map, order: order.filter(function (k) { return map[k]; }) };
  }
  function channelBar(perm) {
    if (!perm.canSell || readOnly) return "";
    var now = curChannel(), sd = saleDate(), back = sd !== todayStr();
    var h = '<div class="chbar"><span class="chlab">THIS SALE CAME FROM</span><div class="chset">';
    channels().forEach(function (c) {
      h += '<button class="ch' + (c === now ? " on" : "") + '" type="button" data-ch="' + esc(c) + '">' +
        esc(c) + "</button>";
    });
    h += "</div></div>";
    h += '<div class="chbar"><span class="chlab">SOLD ON</span>' +
      '<input id="s-date" type="date" value="' + esc(sd) + '" max="' + esc(todayStr()) + '">' +
      (back ? '<button class="ch" type="button" data-sdate="today">BACK TO TODAY</button>' : "") +
      "</div>";
    if (back) {
      h += '<div class="banner warn"><b>Logging sales on ' + esc(niceDate(sd)) +
        ", not today.</b> Every SOLD you tap lands on that date until you change it back.</div>";
    }
    return h;
  }
  /* Stock that is made but not yet sold is not a loss — it is Dee's money
     sitting on the truck as cake. Only what has actually been sold, or has
     expired unsold, has been used up, and only that belongs against the
     takings. The rest is inventory and settles when it sells. */
  function totals(days) {
    var cutoff = days ? addDays(todayStr(), -days + 1) : null;
    var t = { spent: 0, costSold: 0, costWaste: 0, costStock: 0, revenue: 0,
              unitsOut: 0, unitsSold: 0, unitsWasted: 0, unitsLeft: 0, unknownCost: 0 };
    live().forEach(function (b) {
      if (cutoff && b.madeOn < cutoff) return;
      var s = sold(b), left = remaining(b), gone = status(b) === "expired";
      t.unitsOut += b.qty;
      t.unitsSold += s;
      t.revenue += s * (b.unitPrice || 0);
      if (gone) t.unitsWasted += left; else t.unitsLeft += left;
      if (b.unitCost == null) { t.unknownCost += b.qty; return; }
      t.spent += b.qty * b.unitCost;
      t.costSold += s * b.unitCost;
      if (gone) t.costWaste += left * b.unitCost;
      else t.costStock += left * b.unitCost;
    });
    t.waste = t.costWaste;
    t.cost = t.costSold + t.costWaste;    /* what has actually been used up */
    t.profit = t.revenue - t.cost;
    return t;
  }

  /* ============ the 50/50 settlement ============
     Dee's fronts every ingredient cost C. The truck takes all the cash R.
     For Dee's to end on its share d of the profit, the truck must hand over
     C x (1-d) + R x d  — its share of what Dee's spent, plus Dee's share of
     what the truck holds. At 50/50 that is simply half of each.            */
  function payments() { return S.payments || []; }
  function paidSoFar() {
    return payments().reduce(function (a, p) { return a + (+p.amount || 0); }, 0);
  }
  function settlement() {
    var t = totals(null);
    var d = (S.split.deesPct || 0) / 100;
    var costShare = t.cost * (1 - d);   // truck's share of the cost that has been used up
    var revShare = t.revenue * d;       // Dee's share of what the truck took
    var owed = costShare + revShare;
    var paid = paidSoFar();
    return { cost: t.cost, spent: t.spent, stock: t.costStock, waste: t.costWaste,
             stockUnits: t.unitsLeft, revenue: t.revenue, profit: t.profit, d: d,
             costShare: costShare, revShare: revShare, owed: owed,
             paid: paid, outstanding: owed - paid, unknownCost: t.unknownCost };
  }

  /* Everything still sellable on the truck: what it would fetch, what it
     cost Dee's, and the profit in it if it all sells. */
  function upside() {
    var units = 0, revenue = 0, profit = 0, cost = 0;
    live().forEach(function (b) {
      if (status(b) === "expired") return;
      var left = remaining(b);
      if (left <= 0) return;
      units += left;
      revenue += left * (b.unitPrice || 0);
      if (b.unitCost != null) {
        cost += left * b.unitCost;
        profit += left * ((b.unitPrice || 0) - b.unitCost);
      }
    });
    return { units: units, revenue: revenue, cost: cost, profit: profit };
  }

  /* What each partner ends up with once the outstanding balance is settled.
     Not cash in hand today — Dee's is out of pocket until the truck pays. */
  function earnings() {
    var s = settlement(), up = upside();
    var proj = s.profit + up.profit;
    return { s: s, up: up,
             deesNow: s.profit * s.d, truckNow: s.profit * (1 - s.d),
             projProfit: proj, deesProj: proj * s.d, truckProj: proj * (1 - s.d) };
  }

  /* ============ persistence ============ */
  function buildDoc(next) {
    var css = document.getElementById("app-style").textContent.trim();
    var js = document.getElementById("app-code").textContent.trim();
    var json = JSON.stringify(next).replace(/</g, "\\u003c");
    var close = "<" + "/script>";
    return '<!doctype html>\n<html lang="en">\n<head>\n' +
      '<meta charset="utf-8">\n' +
      '<meta name="viewport" content="width=device-width,initial-scale=1">\n' +
      "<title>Dee's Stock</title>\n" +
      '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Cairo:wght@400;600;700;900&display=swap">\n' +
      '<style id="app-style">' + css + "<" + "/style>\n" +
      "</head>\n<body>\n" +
      '<div id="app"><' + "/div>\n" +
      '<script id="app-state" type="application/json">\n' + json + "\n" + close + "\n" +
      '<script id="app-code">\n' + js + "\n" + close + "\n" +
      "</body>\n</html>";
  }

  function save(mutate, okMsg) {
    if (readOnly) { toast("This view is read-only.", true); return; }
    if (!artifact) { toast("Still connecting — try again in a moment.", true); return; }
    if (busy) return;
    var next = clone(S);
    var restoreSeq = S.seq;
    S.seq = next.seq = restoreSeq;
    try { mutate(next); } catch (e) { toast(e.message || "Could not save.", true); return; }
    next.seq = S.seq;
    next.updatedAt = new Date().toISOString();
    busy = true; render();
    try { sessionStorage.setItem("deeserts.flash", okMsg || "Saved."); } catch (e) {}
    artifact.publish(buildDoc(next)).catch(function (err) {
      busy = false;
      try { sessionStorage.removeItem("deeserts.flash"); } catch (e) {}
      var code = err && err.code;
      if (code === "conflict") { toast("Someone saved first — reloading their version."); return; }
      if (code === "not_writer" || code === "not_granted" || code === "not_declared" ||
          code === "capability_disabled" || code === "capability_removed" || code === "consent_required") {
        readOnly = true; render();
        toast("You have view-only access to this board.", true);
        return;
      }
      if (code === "rate_limited") { toast("Saving too fast — wait a moment.", true); render(); return; }
      if (code === "too_large") { toast("The board is full. Clear old stock in Setup.", true); render(); return; }
      toast("Could not save. Try again.", true);
      render();
    });
  }

  /* Sandboxed frames block window.confirm / window.prompt — they return without
     asking, which silently cancels whatever they were guarding. Own dialog instead. */
  function ask(opts) {
    return new Promise(function (resolve) {
      var back = document.createElement("div");
      back.className = "modal";
      var h = '<div class="modalbox" role="dialog" aria-modal="true" aria-label="' + esc(opts.title || "Confirm") + '">';
      if (opts.title) h += "<h3>" + esc(opts.title) + "</h3>";
      if (opts.body) h += '<div class="msg">' + esc(opts.body) + "</div>";
      if (opts.input) {
        h += '<div class="field" style="margin-top:16px"><label for="m-val">' + esc(opts.input.label) + "</label>";
        h += opts.input.type === "text"
          ? '<input id="m-val" type="text" maxlength="80" value="' + esc(opts.input.value || "") +
            '" placeholder="' + esc(opts.input.placeholder || "") + '">'
          : '<input id="m-val" type="number" inputmode="numeric" value="' + esc(opts.input.value) +
            '" min="' + esc(opts.input.min) + '" max="' + esc(opts.input.max) + '">';
        h += "</div>";
      }
      h += '<div class="modalacts">' +
        '<button class="btn ghost" type="button" data-m="no">Cancel</button>' +
        '<button class="btn ' + (opts.danger ? "danger" : "pri") + '" type="button" data-m="yes">' +
        esc(opts.ok || "Confirm") + "</button></div></div>";
      back.innerHTML = h;
      document.body.appendChild(back);

      var done = false;
      function finish(val) {
        if (done) return;
        done = true;
        document.removeEventListener("keydown", onKey, true);
        back.remove();
        resolve(val);
      }
      function onKey(e) {
        if (e.key === "Escape") { e.preventDefault(); finish(null); }
        else if (e.key === "Enter" && !opts.input) { e.preventDefault(); accept(); }
      }
      function accept() {
        if (!opts.input) { finish(true); return; }
        var el = back.querySelector("#m-val");
        if (opts.input.type === "text") {
          var txt = el.value.trim();
          if (!txt) { toast("Type a short reason so the record explains itself.", true); return; }
          finish(txt); return;
        }
        var v = parseInt(el.value, 10);
        var lo = opts.input.min != null ? +opts.input.min : 1;
        if (isNaN(v) || v < lo) { toast("Enter a whole number, " + lo + " or more.", true); return; }
        if (opts.input.max != null && v > +opts.input.max) {
          toast("That is more than the " + opts.input.max + " available.", true); return;
        }
        finish(v);
      }
      back.querySelector('[data-m="no"]').onclick = function () { finish(null); };
      back.querySelector('[data-m="yes"]').onclick = accept;
      back.onclick = function (e) { if (e.target === back) finish(null); };
      document.addEventListener("keydown", onKey, true);
      var f = back.querySelector("#m-val") || back.querySelector('[data-m="yes"]');
      if (f) { f.focus(); if (f.select) f.select(); }
      if (opts.input) {
        back.querySelector("#m-val").addEventListener("keydown", function (e) {
          if (e.key === "Enter") { e.preventDefault(); accept(); }
        });
      }
    });
  }

  /* ============ the PDF invoice ============
     Written by hand rather than pulled from a CDN: the page has to keep
     working offline and after it republishes itself, and a one-page
     invoice is a small enough slice of PDF 1.4 to own outright.
     Helvetica and Helvetica-Bold are built into every reader, so only
     their widths are carried here — enough to right-align money. */
  var HW = ("278 278 355 556 556 889 667 191 333 333 389 584 278 333 278 278 " +
    "556 556 556 556 556 556 556 556 556 556 278 278 584 584 584 556 " +
    "1015 667 667 722 722 667 611 778 722 278 500 667 556 833 722 778 " +
    "667 778 722 667 611 722 667 944 667 667 611 278 278 278 469 556 " +
    "333 556 556 500 556 556 278 556 556 222 222 500 222 833 556 556 " +
    "556 556 333 500 278 556 500 722 500 500 500 334 260 334 584").split(" ").map(Number);
  var HB = ("278 333 474 556 556 889 722 238 333 333 389 584 278 333 278 278 " +
    "556 556 556 556 556 556 556 556 556 556 333 333 584 584 584 611 " +
    "975 722 722 722 722 667 611 778 722 278 556 722 611 833 722 778 " +
    "667 778 722 667 611 722 667 944 667 667 611 333 278 333 584 556 " +
    "333 556 611 556 611 556 333 611 611 278 278 556 278 889 611 611 " +
    "611 611 389 556 333 611 556 778 556 556 500 389 280 389 584").split(" ").map(Number);

  /* WinAnsi is Latin-1 over 0xA0-0xFF, so accents pass straight through;
     the typographic characters the app uses get plain equivalents. */
  var PDF_FALLBACK = { "—": "-", "–": "-", "→": "->", "·": "-",
                       "‘": "'", "’": "'", "“": '"', "”": '"',
                       "÷": "/", "…": "..." };
  function winAnsi(s) {
    var out = "";
    for (var i = 0; i < s.length; i++) {
      var c = s.charAt(i), n = s.charCodeAt(i);
      if (n >= 0x20 && n <= 0x7e) out += c;
      else if (n >= 0xa0 && n <= 0xff) out += c;
      else out += (PDF_FALLBACK[c] || (n === 10 ? " " : "?"));
    }
    return out;
  }
  function textWidth(s, size, bold) {
    var tbl = bold ? HB : HW, w = 0;
    for (var i = 0; i < s.length; i++) {
      var n = s.charCodeAt(i);
      w += (n >= 32 && n <= 126) ? tbl[n - 32] : 556;
    }
    return w * size / 1000;
  }
  function pdfStr(s) { return "(" + winAnsi(s).replace(/[\\()]/g, function (c) { return "\\" + c; }) + ")"; }

  /* a tiny drawing surface that accumulates content-stream operators */
  function pdfPage() {
    var ops = [];
    return {
      ops: ops,
      rect: function (x, y, w, h, rgb) {
        ops.push(rgb.join(" ") + " rg " + x + " " + y + " " + w + " " + h + " re f");
        return this;
      },
      text: function (s, x, y, size, bold, rgb) {
        if (s == null || s === "") return this;
        ops.push("BT " + (rgb || [0, 0, 0]).join(" ") + " rg /" + (bold ? "F2" : "F1") + " " +
                 size + " Tf " + x + " " + y + " Td " + pdfStr(String(s)) + " Tj ET");
        return this;
      },
      right: function (s, xRight, y, size, bold, rgb) {
        s = String(s == null ? "" : s);
        return this.text(s, Math.round((xRight - textWidth(winAnsi(s), size, bold)) * 100) / 100,
                         y, size, bold, rgb);
      }
    };
  }
  function pdfDoc(content) {
    var objs = [
      "<</Type/Catalog/Pages 2 0 R>>",
      "<</Type/Pages/Kids[3 0 R]/Count 1>>",
      "<</Type/Page/Parent 2 0 R/MediaBox[0 0 595.28 841.89]" +
        "/Resources<</Font<</F1 5 0 R/F2 6 0 R>>>>/Contents 4 0 R>>",
      "<</Length " + content.length + ">>\nstream\n" + content + "\nendstream",
      "<</Type/Font/Subtype/Type1/BaseFont/Helvetica/Encoding/WinAnsiEncoding>>",
      "<</Type/Font/Subtype/Type1/BaseFont/Helvetica-Bold/Encoding/WinAnsiEncoding>>"
    ];
    var out = "%PDF-1.4\n%\xe2\xe3\xcf\xd3\n", offsets = [];
    objs.forEach(function (body, i) {
      offsets.push(out.length);
      out += (i + 1) + " 0 obj\n" + body + "\nendobj\n";
    });
    var xref = out.length;
    out += "xref\n0 " + (objs.length + 1) + "\n0000000000 65535 f \n";
    offsets.forEach(function (o) {
      out += ("0000000000" + o).slice(-10) + " 00000 n \n";
    });
    out += "trailer\n<</Size " + (objs.length + 1) + "/Root 1 0 R>>\nstartxref\n" + xref + "\n%%EOF\n";
    var bytes = new Uint8Array(out.length);
    for (var i = 0; i < out.length; i++) bytes[i] = out.charCodeAt(i) & 0xff;
    return bytes;
  }

  var BROWN = [0.29, 0.17, 0.16], GREY = [0.42, 0.35, 0.30], RULE = [0.90, 0.86, 0.78];

      pg.right(count(b.qty, bPortion(b)), 372, y, 10, false, GREY);
      pg.right(b.unitCost == null ? "-" : money(b.unitCost), 460, y, 10, false);
      pg.right(line == null ? "-" : money(line), R - 8, y, 10, true);
      y -= 12;
      pg.rect(L, y + 2, R - L, 0.6, RULE);
      y -= 12;
    });

    y -= 6;
    pg.right("TOTAL COST TO DEE'S", 460, y, 9, true, GREY);
    pg.right(cur() + " " + money(total), R - 8, y, 14, true, BROWN);
    y -= 18;
    var d = (S.split.deesPct || 0) / 100;
    pg.right("Smash & Pass " + Math.round((1 - d) * 100) + "% share of this cost", 460, y, 9, false, GREY);
    pg.right(cur() + " " + money(total * (1 - d)), R - 8, y, 10, false, GREY);
    y -= 14;

    if (uncosted) {

    /* footer */
    pg.rect(L, 74, R - L, 0.6, RULE);
